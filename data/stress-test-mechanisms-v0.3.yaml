pmm_version: 0.3.1
document_type: pmm_dataset
dataset_id: pmm:dataset:heterogeneous-mechanisms-stress-test
metadata:
  title: PMM v0.3 heterogeneous mechanism stress test
  description: >-
    Deliberately heterogeneous records used to test whether PMM separates
    constructs, states, mechanisms, interventions, outcomes, measurements,
    statistical moderation, and causal effects across levels of analysis.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.3.1
    created_at: '2026-08-26T00:00:00+03:00'
    modified_at: '2026-08-26T00:00:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
namespaces:
  pmm: https://pmm.local/id/

objects:
  - id: pmm:context:successive-memory-task
    type: Context
    label: Successive memory-task context
    definition: >-
      Experimental context in which currently relevant material is tested after
      earlier, potentially competing material has been encoded.
    ontological_level: type
    curation_status: provisional
    context_kind: experimental
    dimensions:
      task_family: multiple-list or trial-sequence memory task
      earlier_material: present
    scope: Human laboratory memory tasks; exact interference depends on task and material similarity.
    provenance: *provenance

  - id: pmm:context:reinforcement-learning-task
    type: Context
    label: Reinforcement-learning task context
    definition: >-
      Experimental or computational context with states, actions, outcomes, and
      trial-wise value updating.
    ontological_level: type
    curation_status: provisional
    context_kind: experimental
    dimensions:
      repeated_choice: true
      feedback: trial-wise
    scope: Model-based description; neural implementation requires separate claims.
    provenance: *provenance

  - id: pmm:context:hpa-regulation
    type: Context
    label: HPA-axis regulatory context
    definition: >-
      Physiological context covering basal or stress-related hypothalamic-
      pituitary-adrenal activity and glucocorticoid feedback.
    ontological_level: type
    curation_status: provisional
    context_kind: physical
    dimensions:
      system: hypothalamic-pituitary-adrenal axis
      regime: basal or stress-responsive
    scope: Mammalian physiology; timing and receptor contributions vary by regime and tissue.
    provenance: *provenance

  - id: pmm:context:social-evaluative-stress
    type: Context
    label: Social-evaluative stress context
    definition: >-
      Controlled stress context involving social evaluation and repeated
      physiological sampling after the stressor.
    ontological_level: type
    curation_status: provisional
    context_kind: experimental
    dimensions:
      stressor_family: MISTiC or Trier-derived task
      sampling: repeated post-stressor saliva samples
    scope: The pilot result below is restricted to children aged 11-15 years.
    provenance: *provenance

  - id: pmm:construct:proactive-interference
    type: Construct
    label: Proactive interference
    definition: >-
      Impairment of memory for newer target information associated with prior
      learning or activation of competing information.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - This label denotes a performance phenomenon, not one uniquely established mechanism.
      - Encoding competition and retrieval competition must remain distinguishable hypotheses.
    provenance: *provenance

  - id: pmm:state:prior-memory-traces
    type: State
    label: Activated prior memory traces
    definition: Previously encoded information that remains available and can compete with current targets.
    ontological_level: type
    curation_status: provisional
    state_kind: cognitive
    bearer_scope: person
    temporal_scale: episode
    provenance: *provenance

  - id: pmm:behavior:target-recall-response
    type: Behavior
    label: Target recall response
    definition: Observable response reporting the currently relevant target item.
    ontological_level: type
    curation_status: provisional
    behavior_kind: verbal_behavior
    observability: direct
    actor_scope: person
    response_topography: Spoken, typed, or selected target response.
    provenance: *provenance

  - id: pmm:outcome:target-retrieval-performance
    type: Outcome
    label: Target retrieval performance
    definition: Accuracy or latency of retrieval for currently relevant target information.
    ontological_level: type
    curation_status: provisional
    outcome_kind: performance
    valence: not_applicable
    provenance: *provenance

  - id: pmm:mechanism:retrieval-competition
    type: Mechanism
    label: Retrieval competition from prior traces
    definition: >-
      Proposed process in which activated prior traces compete with a current
      target during retrieval, reducing target accessibility or selection.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - role: competing information
        object_id: pmm:state:prior-memory-traces
      - role: retrieval response
        object_id: pmm:behavior:target-recall-response
      - role: performance consequence
        object_id: pmm:outcome:target-retrieval-performance
    realization_conditions:
      - Prior and current information are both available at retrieval.
      - The task creates competition through overlap, recency, or response conflict.
    provenance: *provenance

  - id: pmm:measurement:proactive-interference-cost
    type: Measurement
    label: Proactive-interference cost
    definition: Difference in target accuracy or latency between interference and matched control conditions.
    ontological_level: type
    curation_status: provisional
    measurement_kind: behavioral_task
    target_ids:
      - pmm:construct:proactive-interference
      - pmm:outcome:target-retrieval-performance
    method: Contrast performance after competing prior material with an appropriate noncompeting baseline.
    unit_of_analysis: behavior
    result_type: continuous
    provenance: *provenance

  - id: pmm:construct:reward-prediction-error
    type: Construct
    label: Reward prediction error
    definition: >-
      Computational discrepancy between received and expected reward, commonly
      extended in temporal-difference models to include discounted next-state value.
    ontological_level: type
    curation_status: provisional
    construct_kind: computational
    boundary_notes:
      - A computational variable is not identical to a dopamine signal.
      - Distributional, sensory, and belief-state variants require explicit model specifications.
    provenance: *provenance

  - id: pmm:state:expected-action-value
    type: State
    label: Expected action value
    definition: Current model-derived estimate of expected future return for an action in a state.
    ontological_level: type
    curation_status: provisional
    state_kind: cognitive
    bearer_scope: person
    temporal_scale: episode
    provenance: *provenance

  - id: pmm:outcome:received-reward
    type: Outcome
    label: Received reward
    definition: Appetitive consequence delivered or observed on a learning trial.
    ontological_level: type
    curation_status: provisional
    outcome_kind: event_occurrence
    valence: appetitive
    provenance: *provenance

  - id: pmm:mechanism:temporal-difference-value-update
    type: Mechanism
    label: Temporal-difference value updating
    definition: >-
      Computational process that changes a value estimate as a function of a
      prediction-error term and a learning-rate parameter.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: computational
    role_bindings:
      - role: prior value estimate
        object_id: pmm:state:expected-action-value
      - role: outcome input
        object_id: pmm:outcome:received-reward
      - role: error signal
        object_id: pmm:construct:reward-prediction-error
    realization_conditions:
      - A formally specified update rule links trial outcomes to later value estimates.
      - Learning rate and state representation are identified or estimated.
    provenance: *provenance

  - id: pmm:measurement:fitted-reward-prediction-error
    type: Measurement
    label: Fitted trial-wise reward prediction error
    definition: Trial-wise latent prediction-error estimate generated by a fitted reinforcement-learning model.
    ontological_level: type
    curation_status: provisional
    measurement_kind: computational_parameter
    target_ids:
      - pmm:construct:reward-prediction-error
      - pmm:state:expected-action-value
    method: Fit a preregistered learning model to choices and outcomes, then compute trial-wise latent values.
    unit_of_analysis: paradigm
    result_type: model_parameter
    provenance: *provenance

  - id: pmm:state:circulating-glucocorticoid-level
    type: State
    label: Circulating glucocorticoid level
    definition: Time-indexed concentration of cortisol or corticosterone in circulation.
    ontological_level: type
    curation_status: provisional
    state_kind: physiological
    bearer_scope: organism
    temporal_scale: episode
    provenance: *provenance

  - id: pmm:state:hpa-secretory-drive
    type: State
    label: HPA secretory drive
    definition: Time-indexed activity promoting downstream glucocorticoid secretion within the HPA axis.
    ontological_level: type
    curation_status: provisional
    state_kind: physiological
    bearer_scope: organism
    temporal_scale: episode
    provenance: *provenance

  - id: pmm:mechanism:glucocorticoid-negative-feedback
    type: Mechanism
    label: Glucocorticoid negative feedback on HPA activity
    definition: >-
      Physiological feedback process through which glucocorticoid signaling
      contributes to limiting or shaping subsequent HPA-axis secretory activity.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: physiological
    role_bindings:
      - role: feedback signal
        object_id: pmm:state:circulating-glucocorticoid-level
      - role: regulated activity
        object_id: pmm:state:hpa-secretory-drive
    realization_conditions:
      - Glucocorticoid and/or mineralocorticoid receptor signaling is available.
      - Temporal regime and tissue location are specified.
    provenance: *provenance

  - id: pmm:intervention:dexamethasone-challenge
    type: Intervention
    label: Dexamethasone challenge
    definition: Experimental pharmacological manipulation used to probe glucocorticoid feedback sensitivity.
    ontological_level: type
    curation_status: provisional
    intervention_kind: pharmacological
    target_ids:
      - pmm:mechanism:glucocorticoid-negative-feedback
      - pmm:state:hpa-secretory-drive
    delivery: Timed administration followed by endocrine sampling under a specified protocol.
    intended_direction: test
    provenance: *provenance

  - id: pmm:measurement:serial-cortisol
    type: Measurement
    label: Serial cortisol measurement
    definition: Repeated cortisol assay used to characterize level, trajectory, or pulsatility over time.
    ontological_level: type
    curation_status: provisional
    measurement_kind: physiology
    target_ids:
      - pmm:state:circulating-glucocorticoid-level
      - pmm:state:hpa-secretory-drive
    method: Repeated saliva, plasma, or other validated matrix sampling with time stamps.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

  - id: pmm:intervention:psychosocial-stressor
    type: Intervention
    label: Standardized psychosocial stressor
    definition: Controlled task manipulation intended to elicit a social-evaluative stress response.
    ontological_level: type
    curation_status: provisional
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:state:cortisol-stress-response
    delivery: Standardized age-appropriate social-evaluative task.
    intended_direction: increase
    provenance: *provenance

  - id: pmm:intervention:parent-social-buffer
    type: Intervention
    label: Parent social-buffer condition
    definition: Randomized condition providing brief parent interaction around a social-evaluative stressor.
    ontological_level: type
    curation_status: provisional
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:state:cortisol-stress-response
      - pmm:mechanism:social-buffering
    delivery: Brief audiovisual parent interaction at protocol-defined time points.
    intended_direction: decrease
    provenance: *provenance

  - id: pmm:event:post-stressor-time-course
    type: Event
    label: Post-stressor sampling time course
    definition: Ordered sequence of post-stressor sampling occasions used to estimate response trajectory.
    ontological_level: type
    curation_status: provisional
    event_kind: state_transition
    participant_ids:
      - pmm:state:cortisol-stress-response
    temporal_scale: hours
    provenance: *provenance

  - id: pmm:state:cortisol-stress-response
    type: State
    label: Cortisol stress-response trajectory
    definition: Time-indexed change in cortisol concentration following a defined stressor.
    ontological_level: type
    curation_status: provisional
    state_kind: physiological
    bearer_scope: person
    temporal_scale: episode
    provenance: *provenance

  - id: pmm:mechanism:social-buffering
    type: Mechanism
    label: Social buffering of physiological stress
    definition: >-
      Family of processes through which a social partner or social signal changes
      the magnitude or time course of a stress response.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: social
    role_bindings:
      - role: social input
        object_id: pmm:intervention:parent-social-buffer
      - role: regulated stress response
        object_id: pmm:state:cortisol-stress-response
    realization_conditions:
      - Partner identity, relationship, developmental stage, and interaction modality are specified.
      - Stressor and physiological outcome are operationalized separately.
    boundary_notes:
      - An observed buffering effect does not by itself identify the mediating mechanism.
    provenance: *provenance

  - id: pmm:measurement:salivary-cortisol-trajectory
    type: Measurement
    label: Salivary cortisol trajectory
    definition: Repeated salivary cortisol assay summarized as change or modeled response over time.
    ontological_level: type
    curation_status: provisional
    measurement_kind: physiology
    target_ids:
      - pmm:state:cortisol-stress-response
    method: Baseline and repeated post-stressor salivary cortisol assays.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

relations:
  - id: pmm:relation:proactive-interference-measured-by-cost
    subject_id: pmm:construct:proactive-interference
    predicate: measured_by
    object_id: pmm:measurement:proactive-interference-cost
    provenance: *provenance
  - id: pmm:relation:retrieval-competition-in-memory-task
    subject_id: pmm:mechanism:retrieval-competition
    predicate: occurs_in_context
    object_id: pmm:context:successive-memory-task
    provenance: *provenance
  - id: pmm:relation:rpe-measured-by-model
    subject_id: pmm:construct:reward-prediction-error
    predicate: measured_by
    object_id: pmm:measurement:fitted-reward-prediction-error
    provenance: *provenance
  - id: pmm:relation:value-update-has-rpe
    subject_id: pmm:mechanism:temporal-difference-value-update
    predicate: has_participant
    object_id: pmm:construct:reward-prediction-error
    provenance: *provenance
  - id: pmm:relation:hpa-feedback-in-regulatory-context
    subject_id: pmm:mechanism:glucocorticoid-negative-feedback
    predicate: occurs_in_context
    object_id: pmm:context:hpa-regulation
    provenance: *provenance
  - id: pmm:relation:glucocorticoid-measured-by-cortisol
    subject_id: pmm:state:circulating-glucocorticoid-level
    predicate: measured_by
    object_id: pmm:measurement:serial-cortisol
    provenance: *provenance
  - id: pmm:relation:social-buffering-in-stress-context
    subject_id: pmm:mechanism:social-buffering
    predicate: occurs_in_context
    object_id: pmm:context:social-evaluative-stress
    provenance: *provenance
  - id: pmm:relation:cortisol-response-measured-by-saliva
    subject_id: pmm:state:cortisol-stress-response
    predicate: measured_by
    object_id: pmm:measurement:salivary-cortisol-trajectory
    provenance: *provenance

claims:
  - id: pmm:claim:proactive-interference-definition
    claim_type: definition
    statement: >-
      Proactive interference is impaired memory for newer information associated
      with previously learned information; it is not a unique mechanism label.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: Recent review supports the phenomenon while identifying multiple encoding and retrieval accounts.
    scope:
      population: Humans studied with laboratory memory paradigms.
      species: [human]
      context_ids: [pmm:context:successive-memory-task]
      temporal_scope: Within or across experimental learning episodes.
    defined_object_id: pmm:construct:proactive-interference
    source_ids: [pmm:source:proactive-interference-review-2020]
    evidence_ids: []
    provenance: *provenance

  - id: pmm:claim:retrieval-competition-hypothesis
    claim_type: mechanism_hypothesis
    statement: Activated prior traces can reduce current target retrieval through competition at retrieval.
    epistemic_status: proposed
    confidence:
      level: low
      rationale: Reviews support retrieval competition as one account but also identify encoding contributions and task dependence.
    scope:
      population: Humans in successive memory tasks with competing material.
      species: [human]
      context_ids: [pmm:context:successive-memory-task]
      temporal_scope: During target retrieval.
      boundary_conditions:
        - Does not assert that all proactive-interference effects arise at retrieval.
    mechanism_id: pmm:mechanism:retrieval-competition
    exposure_id: pmm:state:prior-memory-traces
    outcome_id: pmm:outcome:target-retrieval-performance
    temporal_ordering: Prior traces are activated before or during the current retrieval attempt.
    falsifiable_boundary: >-
      The account is weakened where interference remains after retrieval competition
      is eliminated and is fully explained by encoding-stage differences.
    evidence_ids: [pmm:evidence:proactive-interference-review]
    provenance: *provenance

  - id: pmm:claim:reward-prediction-error-definition
    claim_type: definition
    statement: Reward prediction error is a model-defined discrepancy term used to update expected value.
    epistemic_status: supported
    confidence:
      level: high
      rationale: The computational term is well defined, although neural interpretations remain model-dependent.
    scope:
      population: Computational and neurobehavioral reinforcement-learning models.
      species: [mixed]
      context_ids: [pmm:context:reinforcement-learning-task]
      temporal_scope: Trial-wise learning.
    defined_object_id: pmm:construct:reward-prediction-error
    source_ids: [pmm:source:rpe-perspective-2024]
    evidence_ids: []
    provenance: *provenance

  - id: pmm:claim:temporal-difference-update-hypothesis
    claim_type: mechanism_hypothesis
    statement: A reward prediction-error term changes later action-value estimates under a temporal-difference update rule.
    epistemic_status: proposed
    confidence:
      level: moderate
      rationale: Strong as a formal model relation, but correspondence with a unique biological process is not assumed.
    scope:
      population: Agents or organisms modeled with temporal-difference reinforcement learning.
      species: [mixed]
      context_ids: [pmm:context:reinforcement-learning-task]
      temporal_scope: Across successive feedback trials.
      boundary_conditions:
        - Applies only when the specified model provides an adequate account of choices.
    mechanism_id: pmm:mechanism:temporal-difference-value-update
    exposure_id: pmm:outcome:received-reward
    outcome_id: pmm:state:expected-action-value
    temporal_ordering: Outcome and prediction error on trial t precede the updated value used on a later trial.
    falsifiable_boundary: >-
      The hypothesis fails for a dataset if a preregistered temporal-difference model
      cannot predict held-out choice updates better than specified alternatives.
    evidence_ids: [pmm:evidence:rpe-perspective]
    provenance: *provenance

  - id: pmm:claim:hpa-negative-feedback-definition
    claim_type: definition
    statement: >-
      Glucocorticoid negative feedback comprises receptor-linked processes that
      regulate subsequent HPA activity and contribute to pulsatile dynamics.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: Physiological review supports multiple feedback sites and receptor contributions rather than one simple loop.
    scope:
      population: Mammalian HPA-axis physiology.
      species: [mixed]
      context_ids: [pmm:context:hpa-regulation]
      temporal_scope: Basal ultradian and stress-response regulation.
    defined_object_id: pmm:mechanism:glucocorticoid-negative-feedback
    source_ids: [pmm:source:hpa-feedback-review-2018]
    evidence_ids: []
    provenance: *provenance

  - id: pmm:claim:hpa-feedback-mechanism-hypothesis
    claim_type: mechanism_hypothesis
    statement: Increases in glucocorticoid signaling contribute to limiting or reshaping later HPA secretory drive.
    epistemic_status: proposed
    confidence:
      level: moderate
      rationale: Broad mechanism is established physiologically, but this generic PMM record does not identify site, receptor, timing, or estimand.
    scope:
      population: Mammalian HPA-axis systems.
      species: [mixed]
      context_ids: [pmm:context:hpa-regulation]
      temporal_scope: Minutes to hours, conditional on the physiological regime.
      boundary_conditions:
        - Receptor subtype, tissue, timing, and basal versus stress regime must be specified in empirical claims.
    mechanism_id: pmm:mechanism:glucocorticoid-negative-feedback
    exposure_id: pmm:state:circulating-glucocorticoid-level
    outcome_id: pmm:state:hpa-secretory-drive
    temporal_ordering: Glucocorticoid signaling precedes the regulated later secretory activity.
    falsifiable_boundary: >-
      A scoped version is challenged if selective interruption of the specified
      receptor pathway leaves the preregistered downstream HPA response unchanged.
    evidence_ids: [pmm:evidence:hpa-feedback-review]
    provenance: *provenance

  - id: pmm:claim:social-buffering-definition
    claim_type: definition
    statement: Social buffering denotes a change in stress-response magnitude or trajectory attributable to a social condition.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: The term is operationally useful when partner, modality, stressor, and outcome are specified.
    scope:
      population: Children exposed to a controlled social-evaluative stress task.
      species: [human]
      context_ids: [pmm:context:social-evaluative-stress]
      temporal_scope: Acute laboratory stress episode.
    defined_object_id: pmm:mechanism:social-buffering
    source_ids: [pmm:source:donzella-social-buffering-2026]
    evidence_ids: []
    provenance: *provenance

  - id: pmm:claim:buffer-condition-moderates-cortisol-time-course
    claim_type: moderation
    moderation_inference: statistical_interaction
    statement: Randomized social-buffer condition modified the post-stressor cortisol trajectory across sampling trials.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: The randomized trial reported a condition-by-trial interaction, but the effect estimate was not extracted beyond p < .05.
    scope:
      population: 180 children aged 11-15 years in the MISTiC experiment.
      species: [human]
      context_ids: [pmm:context:social-evaluative-stress]
      temporal_scope: Baseline through 65 minutes after baseline.
      boundary_conditions:
        - Does not generalize automatically to adults, other support partners, or subjective stress.
    exposure_id: pmm:event:post-stressor-time-course
    moderator_id: pmm:intervention:parent-social-buffer
    outcome_id: pmm:state:cortisol-stress-response
    interaction_term:
      metric: trial-by-condition interaction
      value_status: qualitative_only
      direction: negative
      notes: Reported p < .05; parent condition differed from alone and researcher conditions in post-hoc tests.
    evidence_ids: [pmm:evidence:donzella-moderation]
    limitations:
      - A statistical interaction is not itself an identified mediating mechanism.
    provenance: *provenance

  - id: pmm:claim:parent-buffer-causal-effect-on-cortisol
    claim_type: causal_effect
    statement: Assignment to the parent-buffer condition changed the cortisol stress-response trajectory relative to comparison conditions.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: Random assignment supports a causal condition contrast, while the extracted record lacks a numerical standardized effect.
    scope:
      population: 180 children aged 11-15 years in the MISTiC experiment.
      species: [human]
      context_ids: [pmm:context:social-evaluative-stress]
      temporal_scope: Acute post-stressor cortisol trajectory.
      boundary_conditions:
        - Estimand is assignment to the study condition, not social support in all settings.
    exposure_id: pmm:intervention:parent-social-buffer
    outcome_id: pmm:state:cortisol-stress-response
    causal_estimand: Intention-to-treat contrast in repeated cortisol trajectory for parent buffer versus randomized comparison conditions.
    identification_strategy: randomized_intervention
    temporal_ordering: Buffer assignment and interactions preceded post-stressor cortisol measurements.
    causal_assumptions:
      consistency: Each randomized condition corresponds to the protocol-defined interaction.
      exchangeability: Supported by random assignment; implementation details were not independently audited here.
      positivity: Three conditions were assigned in the trial.
      interference: Assumed no effect of one child's assignment on another child's cortisol response.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:donzella-causal-contrast]
    limitations:
      - Numerical effect size and allocation details require full-text extraction before expert review.
    provenance: *provenance

evidence:
  - id: pmm:evidence:proactive-interference-review
    claim_ids: [pmm:claim:retrieval-competition-hypothesis]
    source_id: pmm:source:proactive-interference-review-2020
    extraction_locator: Abstract and review synthesis of encoding- and retrieval-stage mechanisms.
    evidence_kind: narrative_review
    design: Critical review of behavioral and imaging studies across proactive-interference paradigms.
    population: Human experimental memory studies.
    species: [human]
    inference_support: mechanism
    support_direction: mixed
    causal_support: indirect
    domains:
      directness: partially_indirect
      risk_of_bias: not_assessed
      consistency: mixed
      precision: not_reported
      replication: conceptual_replication
    summary: Both encoding and retrieval processes contribute; retrieval competition is plausible but not uniquely sufficient.
    limitations:
      - Not a source-specific causal estimate for the PMM mechanism claim.
    provenance: *provenance

  - id: pmm:evidence:rpe-perspective
    claim_ids: [pmm:claim:temporal-difference-update-hypothesis]
    source_id: pmm:source:rpe-perspective-2024
    extraction_locator: Abstract and conceptual synthesis.
    evidence_kind: narrative_review
    design: Perspective integrating computational accounts and dopamine findings.
    population: Human and nonhuman reinforcement-learning research.
    species: [mixed]
    inference_support: mechanism
    support_direction: mixed
    causal_support: indirect
    domains:
      directness: partially_indirect
      risk_of_bias: not_assessed
      consistency: mostly_consistent
      precision: not_reported
      replication: conceptual_replication
    summary: Prediction-error accounts explain important findings but simple dopamine-is-RPE identity claims face empirical challenges.
    limitations:
      - Supports model plausibility, not a one-to-one neural identity.
    provenance: *provenance

