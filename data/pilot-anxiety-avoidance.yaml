claims:
  - id: pmm:claim:potential-threat-anxiety-response
    statement: Potential threat is a neurobehavioral construct characterized by anxiety-related responses to possible harm that is distant, ambiguous, or uncertain.
    inference_type: descriptive
    knowledge_status: established_empirical
    confidence:
      level: high
      rationale: Current official RDoC definition; used here as a construct boundary, not as a claim that every threat cue produces the same response.
    scope:
      population: Humans studied dimensionally across normal-to-abnormal functioning.
      species: [human]
      context_ids: [pmm:context:human-anxiety]
      temporal_scope: Episode of anticipated possible harm.
      boundary_conditions:
        - Does not include acute, imminent threat by definition.
    evidence_ids: [pmm:evidence:rdoc-potential-threat-definition]
    limitations:
      - RDoC is an evolving research framework and not a diagnostic system.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:anxiety-avoidance-association
    statement: Higher anxiety or anxious threat responding is generally associated with a greater probability or extent of avoidance, with substantial task, person, and context heterogeneity.
    inference_type: correlation
    knowledge_status: supported_empirical
    confidence:
      level: moderate
      rationale: Reviews converge on the association and clinical relevance, but operationalizations vary and this pilot contains no pooled effect estimate.
    scope:
      population: Human nonclinical and anxiety-related clinical samples.
      species: [human]
      context_ids: [pmm:context:human-anxiety]
      temporal_scope: Concurrent or short-lag association.
      boundary_conditions:
        - Adaptive avoidance of genuine danger is included only when separately identified.
        - Anxiety can occur without avoidance and avoidance can occur without self-reported anxiety.
    exposure_id: pmm:state:anxiety-response
    outcome_id: pmm:behavior:avoidance-response
    association_estimate:
      metric: qualitative direction across reviewed literature
      value_status: qualitative_only
      direction: positive
      notes: No pooled magnitude is asserted.
    confounding_note: Threat severity, controllability, expected value, learning history, trait differences, and measurement method can affect both anxiety and avoidance.
    evidence_ids: [pmm:evidence:human-anxiety-avoidance-reviews]
    limitations:
      - Association does not establish that anxiety causes avoidance in every case.
      - Avoidance is heterogeneous and may be adaptive, goal-directed, habitual, Pavlovian, or socially constrained.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:avoidance-causes-outcome-reduction
    statement: In a controlled active-avoidance contingency, performing the specified avoidance response reduces, prevents, or terminates the programmed aversive outcome relative to the specified comparator.
    inference_type: causation
    knowledge_status: established_empirical
    confidence:
      level: high
      rationale: The response-outcome contingency is experimentally assigned; the claim is deliberately restricted to the programmed outcome and paradigm.
    scope:
      population: Participants or organisms in controlled active-avoidance or escape paradigms.
      species: [human, rodent, mixed]
      context_ids: [pmm:context:controlled-active-avoidance]
      temporal_scope: Immediate response-to-outcome interval within a trial.
      boundary_conditions:
        - Requires a verified response-contingent difference in the aversive outcome.
        - Does not establish long-term clinical benefit or harm.
    exposure_id: pmm:behavior:avoidance-response
    outcome_id: pmm:state:aversive-outcome-reduction
    causal_estimand: Difference in aversive-outcome probability, intensity, or duration under assigned response-contingent avoidance versus the declared control condition.
    identification_strategy: controlled_contingency
    temporal_ordering: The specified response occurs before programmed omission, reduction, or termination of the aversive outcome.
    causal_assumptions:
      consistency: The avoidance response and aversive outcome are operationally specified and delivered as programmed.
      exchangeability: Established by experimental control or assignment for the within-paradigm contingency.
      positivity: Both response/control contingencies are observable or experimentally available in the design.
      interference: One participant's response does not alter another participant's programmed outcome.
      assessment: plausible
    evidence_ids: [pmm:evidence:instrumental-avoidance-contingency]
    limitations:
      - The programmed contingency does not identify whether fear reduction, safety value, action-outcome knowledge, or habit controls later behavior.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:contingent-reduction-reinforces-avoidance
    statement: Under active-avoidance learning conditions, response-contingent omission, reduction, or termination of an aversive outcome can increase the future probability of the avoidance response.
    inference_type: causation
    knowledge_status: established_empirical
    confidence:
      level: moderate
      rationale: Instrumental negative reinforcement is well established, but the controlling representation and generalization from laboratory tasks to clinical behavior vary.
    scope:
      population: Participants or organisms exposed to repeated response-outcome contingencies.
      species: [human, rodent, mixed]
      context_ids: [pmm:context:controlled-active-avoidance]
      temporal_scope: Across learning trials under the relevant discriminative context.
      boundary_conditions:
        - Future responding must increase; short-term relief alone is not sufficient.
        - The aversive change must be contingent on the response.
    exposure_id: pmm:state:aversive-outcome-reduction
    outcome_id: pmm:behavior:avoidance-response
    causal_estimand: Change in future avoidance-response probability under contingent aversive-outcome reduction versus noncontingent or absent reduction.
    identification_strategy: controlled_contingency
    temporal_ordering: The contingent consequence follows a response and future response probability is measured on later opportunities.
    causal_assumptions:
      consistency: The consequence and target response remain sufficiently stable across acquisition trials.
      exchangeability: Experimental contingency assignment separates response-dependent from response-independent outcome changes.
      positivity: Participants have opportunities to emit and withhold the response under comparable cues.
      interference: Learning contingencies are individual and do not cross participants.
      assessment: partly_tested
    evidence_ids:
      - pmm:evidence:instrumental-avoidance-contingency
      - pmm:evidence:avoidance-learning-review
    limitations:
      - Safety signals, Pavlovian defensive responses, and habits can also maintain avoidance.
      - The exact reinforcer may be outcome omission, relief, perceived control, or conditioned safety depending on design.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:clinical-maintenance-loop
    statement: In some human anxiety contexts, heightened potential-threat responding promotes avoidance; short-term aversive-outcome reduction then negatively reinforces avoidance and reduces opportunities for corrective learning, contributing to persistence.
    inference_type: causation
    knowledge_status: proposed_integrative
    confidence:
      level: low
      rationale: Each component has empirical support, but the complete causal chain is not directly identified as a universal mechanism across disorders, people, and contexts.
    scope:
      population: Humans with persistent or maladaptive anxiety-related avoidance.
      species: [human]
      context_ids: [pmm:context:human-anxiety]
      temporal_scope: Repeated episodes over days to years.
      boundary_conditions:
        - Applies only where avoidance is response-contingently followed by aversive reduction and later avoidance increases.
        - Does not apply when avoidance is adaptive, externally constrained, or maintained mainly by other consequences.
    exposure_id: pmm:state:anxiety-response
    outcome_id: pmm:behavior:avoidance-response
    causal_estimand: Longitudinal change in context-matched avoidance attributable to the full anxiety-to-contingent-relief learning pathway.
    identification_strategy: other
    temporal_ordering: Potential-threat response precedes avoidance; consequence follows avoidance; later avoidance is measured prospectively.
    causal_assumptions:
      consistency: Anxiety, avoidance, relief/outcome reduction, and later behavior must be operationalized separately and comparably over time.
      exchangeability: Unmeasured threat severity, goals, social constraints, and treatment exposure would need control or randomization.
      positivity: Comparable opportunities for avoidance and approach must exist across relevant contexts.
      interference: Social reinforcement and shared environments may violate no-interference assumptions.
      assessment: unverified
    evidence_ids: [pmm:evidence:human-anxiety-avoidance-reviews]
    integrated_claim_ids:
      - pmm:claim:anxiety-avoidance-association
      - pmm:claim:avoidance-causes-outcome-reduction
      - pmm:claim:contingent-reduction-reinforces-avoidance
    falsifiable_boundary: The model is weakened where anxiety predicts avoidance but measured response-contingent reduction does not predict increased future avoidance, or where manipulating the contingency does not alter persistence.
    limitations:
      - Statistical mediation has not been asserted or encoded without an indirect-effect estimate.
      - HiTOP alignment locates relevant clinical dimensions but does not validate this mechanism.
      - RDoC alignment locates potential threat but does not imply a complete maintenance chain.
    provenance:
      record_version: 0.2.0
