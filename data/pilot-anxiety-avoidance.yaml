pmm_version: 0.2.0
document_type: pmm_dataset
dataset_id: pmm:dataset:anxiety-avoidance-pilot
metadata:
  title: Anxiety, threat, avoidance, and negative reinforcement pilot
  description: >-
    A deliberately small pilot separating potential threat/anxiety, observable
    avoidance, response-contingent aversive-outcome reduction, and the negative
    reinforcement learning mechanism.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.2.schema.yaml
  provenance:
    record_version: 0.2.0
    created_at: '2026-08-26T00:00:00+03:00'
    modified_at: '2026-08-26T00:00:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
    change_note: Initial PMM v0.2 pilot.

namespaces:
  pmm: https://pmm.example.org/id/
  rdoc: https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/
  cogatlas: https://www.cognitiveatlas.org/
  mf: http://purl.obolibrary.org/obo/MF_
  nbo: http://purl.obolibrary.org/obo/NBO_
  hitop: https://www.hitop-system.org/
  doi: https://doi.org/

objects:
  - id: pmm:context:controlled-active-avoidance
    type: Context
    label: Controlled active-avoidance contingency
    definition: >-
      An experimental context in which a specified response changes the
      probability, duration, or intensity of a specified aversive outcome.
    knowledge_status: operational_definition
    context_kind: experimental
    dimensions:
      contingency: response-dependent
      comparison: response versus no response or yoked/noncontingent control
      outcome_valence: aversive
      acquisition: repeated trials
    scope: Human or non-human active-avoidance and escape-learning paradigms with an explicit response-outcome contingency.
    boundary_notes:
      - Passive Pavlovian threat responding is outside this context unless an instrumental response changes the outcome.
      - Avoidance, escape, punishment, and extinction must not be treated as synonyms.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:context:human-anxiety
    type: Context
    label: Human anxiety context
    definition: >-
      Human functioning in which possible harm is distant, ambiguous, or
      uncertain and anxiety or anxious apprehension is measured dimensionally.
    knowledge_status: supported_empirical
    context_kind: composite
    dimensions:
      species: human
      threat_probability: uncertain-or-ambiguous
      clinical_scope: transdiagnostic-and-nonclinical
      measurement: dimensional
    scope: Human research across nonclinical and anxiety-related clinical samples; not a diagnostic rule.
    external_mappings:
      - system: RDoC
        external_id: RDoC:Potential-Threat-Anxiety
        label: Potential Threat (Anxiety)
        url: https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/definitions-of-the-rdoc-domains-and-constructs
        mapping_relation: close_match
        mapping_status: verified
        rationale: RDoC defines potential threat as possible harm that is distant, ambiguous, or uncertain in probability.
        accessed_at: '2026-08-26'
      - system: HiTOP
        external_id: HiTOP:internalizing-spectrum
        label: Internalizing spectrum
        url: https://www.hitop-system.org/
        mapping_relation: related_match
        mapping_status: provisional
        rationale: HiTOP is relevant to dimensional clinical phenotype organization, not to the learning mechanism itself.
        accessed_at: '2026-08-26'
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated
      source_snapshot_date: '2026-08-26'

  - id: pmm:entity:potential-threat
    type: Entity
    label: Potential threat
    definition: A represented or encountered possibility of harm that is temporally distant, ambiguous, or uncertain in probability.
    aliases: [uncertain threat]
    knowledge_status: operational_definition
    entity_kind: construct
    boundary_notes:
      - Distinguish potential threat/anxiety from acute threat/fear in RDoC.
      - A threat cue does not by itself establish subjective anxiety or avoidance.
    external_mappings:
      - system: RDoC
        external_id: RDoC:Potential-Threat-Anxiety
        label: Potential Threat (Anxiety)
        url: https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/definitions-of-the-rdoc-domains-and-constructs
        mapping_relation: close_match
        mapping_status: verified
        rationale: PMM adopts the RDoC potential-threat boundary while keeping threat representation separate from measured state response.
        accessed_at: '2026-08-26'
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:state:anxiety-response
    type: State
    label: Anxiety response state
    definition: >-
      A time-bounded pattern of anxious apprehension, vigilance, arousal, or
      related responses under potential threat; no single indicator is assumed
      to exhaust the state.
    aliases: [anxious apprehension]
    knowledge_status: supported_empirical
    state_kind: affective
    bearer_scope: person
    temporal_scale: episode
    boundary_notes:
      - This is a state, not a diagnosis and not the RDoC construct itself.
      - Self-report, physiology, and behavior may dissociate and should remain separate measurements.
    external_mappings:
      - system: RDoC
        external_id: RDoC:Potential-Threat-Anxiety
        label: Potential Threat (Anxiety)
        url: https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/definitions-of-the-rdoc-domains-and-constructs
        mapping_relation: related_match
        mapping_status: verified
        rationale: The PMM state can be one manifestation measured within the broader RDoC construct.
        accessed_at: '2026-08-26'
      - system: CognitiveAtlas
        external_id: CognitiveAtlas:anxiety
        label: anxiety
        url: https://www.cognitiveatlas.org/concepts
        mapping_relation: close_match
        mapping_status: provisional
        rationale: Label-level match found; a stable concept identifier and definition require release-pinned review.
        accessed_at: '2026-08-26'
      - system: MF
        external_id: MF:mental-process-or-quality
        label: mental process or quality
        url: https://bioportal.bioontology.org/ontologies/MF
        mapping_relation: broad_match
        mapping_status: provisional
        rationale: MF provides upper-level mental-functioning classes, but no exact anxiety term was asserted in this pilot.
        accessed_at: '2026-08-26'
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:behavior:avoidance-response
    type: Behavior
    label: Avoidance response
    definition: >-
      An action or omission selected in relation to anticipated aversive
      consequences that increases distance from, prevents, terminates, or
      reduces contact with a specified threat or aversive outcome.
    aliases: [active avoidance, avoidance behavior]
    knowledge_status: established_empirical
    behavior_kind: response_pattern
    observable: true
    actor_scope: organism
    response_topography: Task- and context-specific; may include locomotion, choice, withdrawal, refusal, or a safety behavior.
    function_note: Functional classification requires evidence about the response-outcome contingency; topography alone is insufficient.
    boundary_notes:
      - Adaptive avoidance of real harm and maladaptive generalized avoidance are distinct scopes.
      - Escape terminates an ongoing aversive event; avoidance prevents or reduces an anticipated event.
    external_mappings:
      - system: NBO
        external_id: NBO:avoidance-behavior
        label: avoidance behavior
        url: https://bioportal.bioontology.org/ontologies/NBO
        mapping_relation: related_match
        mapping_status: provisional
        rationale: NBO covers behavioral processes and phenotypes; exact release term must be confirmed before promotion.
        accessed_at: '2026-08-26'
      - system: CognitiveAtlas
        external_id: CognitiveAtlas:action-outcome-learning
        label: action-outcome learning
        url: https://www.cognitiveatlas.org/concepts
        mapping_relation: related_match
        mapping_status: provisional
        rationale: Cognitive Atlas lists action-outcome learning; avoidance is a response class rather than the same concept.
        accessed_at: '2026-08-26'
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:state:aversive-outcome-reduction
    type: State
    label: Aversive-outcome reduction
    definition: >-
      A measured decrease in the probability, intensity, or duration of an
      aversive event or state relative to an explicit counterfactual or control
      condition.
    aliases: [aversive outcome omission, short-term relief]
    knowledge_status: operational_definition
    state_kind: outcome
    bearer_scope: interaction
    temporal_scale: momentary
    boundary_notes:
      - Objective outcome omission and subjective relief are different measurements.
      - Reduction must be attributed to avoidance only when response contingency is identified.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:mechanism:negative-reinforcement
    type: Mechanism
    label: Negative reinforcement
    definition: >-
      Instrumental learning in which a response-contingent removal, reduction,
      or prevention of an aversive event increases the future probability or
      rate of that response under relevant conditions.
    knowledge_status: established_empirical
    process_kind: learning
    input_ids:
      - pmm:behavior:avoidance-response
      - pmm:state:aversive-outcome-reduction
    output_ids:
      - pmm:behavior:avoidance-response
    necessary_conditions:
      - A specified response is followed by removal, reduction, or prevention of a specified aversive event relative to a comparator.
      - The future probability or rate of the response increases under relevant conditions.
      - The response-outcome relation is contingent rather than merely temporally adjacent.
    sufficient_conditions:
      - Within the operational scope, demonstrated response contingency plus increased future responding is sufficient to classify the process as negative reinforcement.
    boundary_notes:
      - Negative means removal or reduction, not that the mechanism is harmful.
      - Reinforcement is defined by increased behavior, not by subjective pleasantness.
      - Outcome omission, fear reduction, safety signaling, and habit may each contribute; PMM does not collapse them into one latent process.
    external_mappings:
      - system: CognitiveAtlas
        external_id: CognitiveAtlas:action-outcome-learning
        label: action-outcome learning
        url: https://www.cognitiveatlas.org/concepts
        mapping_relation: broad_match
        mapping_status: provisional
        rationale: Negative reinforcement is one form of instrumental action-outcome learning.
        accessed_at: '2026-08-26'
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:measurement:avoidance-response-rate
    type: Measurement
    label: Avoidance response rate
    definition: Count or proportion of opportunities on which the predefined avoidance response occurs.
    knowledge_status: operational_definition
    measurement_kind: behavioral_task
    target_ids: [pmm:behavior:avoidance-response]
    method: Count avoidance responses and divide by eligible trials or observation time; report response definition and denominator.
    unit_of_analysis: behavior
    result_type: continuous
    psychometric_notes: Reliability and validity are paradigm-specific; rate alone does not establish the response function.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:measurement:aversive-outcome-probability
    type: Measurement
    label: Conditional aversive-outcome probability
    definition: Estimated probability of the aversive outcome conditional on response and on no response.
    knowledge_status: operational_definition
    measurement_kind: behavioral_task
    target_ids:
      - pmm:behavior:avoidance-response
      - pmm:state:aversive-outcome-reduction
    method: Estimate p(O|R) and p(O|not R) or experimentally set these contingencies and report both.
    unit_of_analysis: paradigm
    result_type: continuous
    psychometric_notes: The contrast p(O|R) - p(O|not R) identifies the programmed instrumental contingency, not every psychological process controlling behavior.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:intervention:exposure-response-prevention
    type: Intervention
    label: Exposure with response prevention
    definition: >-
      A psychological or experimental procedure that presents a feared or
      threat-related cue while preventing or reducing the target avoidance or
      safety response so new outcome information can be observed.
    knowledge_status: supported_empirical
    intervention_kind: psychological
    target_ids:
      - pmm:behavior:avoidance-response
      - pmm:state:anxiety-response
    delivery: Repeated, planned contact with a specified cue or situation while the defined avoidance response is reduced or prevented.
    intended_direction: decrease
    boundary_notes:
      - This pilot does not assert one protocol or efficacy estimate across diagnoses.
      - Ethical and clinical use requires individualized assessment and is outside PMM's current scope.
    provenance:
      record_version: 0.2.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

