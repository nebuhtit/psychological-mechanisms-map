  - id: pmm:source:harkin-2016-monitoring
    title: Does monitoring goal progress promote goal attainment? A meta-analysis of the experimental evidence
    source_type: peer_reviewed_article
    authors: [Benjamin Harkin, Thomas L. Webb, Betty P. I. Chang, Andrew Prestwich, Mark Conner, Ian Kellar, Yael Benn, Paschal Sheeran]
    year: 2016
    doi: 10.1037/bul0000025
