    url: https://pubmed.ncbi.nlm.nih.gov/26479070/
    accessed_at: '2026-08-26'
    authority_note: Large meta-analysis of randomized progress-monitoring interventions used for bounded causal and statistical-mediation claims.
    provenance: *provenance

  - id: pmm:source:kluger-denisi-1996-feedback
    title: The effects of feedback interventions on performance — a historical review, a meta-analysis, and a preliminary feedback intervention theory
    source_type: peer_reviewed_article
    authors: [Avraham N. Kluger, Angelo DeNisi]
    year: 1996
    doi: 10.1037/0033-2909.119.2.254
    url: https://doi.org/10.1037/0033-2909.119.2.254
    accessed_at: '2026-08-26'
    authority_note: Large historical meta-analysis used to prevent treating generic performance feedback as uniformly beneficial and to keep its explanatory theory provisional.
    provenance: *provenance
