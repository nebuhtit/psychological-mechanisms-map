pmm_version: 0.3.4
document_type: pmm_dataset
dataset_id: pmm:dataset:emotion-process-evidence-v0-3
metadata:
  title: Evidence pack for emotion components and appraisal
  description: Separates an emotion-relevant event, appraisal, subjective feeling, physiology, action tendency, expression, overt action, measurement, and a proposed coordination mechanism.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.1.0
    created_at: '2026-08-26T23:30:00+03:00'
    modified_at: '2026-08-26T23:30:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:context:emotion-relevant-event
    type: Context
    label: Emotion-relevant event
    definition: An internal or external event that is potentially relevant to a person's goals, needs, values, relationships, or safety in a declared situation.
    ontological_level: type
    curation_status: provisional
    context_kind: composite
    dimensions:
      event_source: internal or external
      personal_relevance: study-specific or person-specific
      temporal_scale: seconds to minutes
    scope: Time-bounded human emotional episodes represented by the included literature.
    boundary_notes:
      - The same event need not be emotionally relevant to every person or on every occasion.
    provenance: *provenance

  - id: pmm:construct:emotion-episode
    type: Construct
    label: Emotion episode
    definition: A time-bounded, person-in-context process involving some combination of appraisal, subjective experience, physiological change, action tendency, expression, and overt action.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - An emotion word or questionnaire score is not the complete episode.
      - The components can differ in timing, intensity, and direction and need not form one invariant package.
      - This component definition does not decide among appraisal, basic-emotion, constructionist, interoceptive, or learning accounts of emotion causation.
    provenance: *provenance

  - id: pmm:construct:event-appraisal-profile
    type: Construct
    label: Event appraisal profile
    definition: A pattern of evaluated meaning dimensions such as goal relevance, pleasantness, certainty, control, agency, anticipated effort, and compatibility with current concerns.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Appraisal can be rapid, automatic, or partly outside awareness and is not limited to deliberate verbal thought.
      - Appraisal dimensions and terminology differ across theories and studies.
      - A profile inferred only from an emotion label is circular and is not an independent measurement.
    provenance: *provenance

  - id: pmm:state:subjective-emotional-feeling
    type: State
    label: Subjective emotional feeling
    definition: The time-indexed conscious experience of affect or emotion reported by a person during or after an event.
    ontological_level: type
    curation_status: accepted
    state_kind: affective
    bearer_scope: person
    temporal_scale: episode
    boundary_notes:
      - Subjective feeling is not interchangeable with autonomic activity, facial expression, or an observer's emotion label.
    provenance: *provenance

  - id: pmm:state:emotion-related-physiological-response
    type: State
    label: Emotion-related physiological response
    definition: Time-indexed autonomic, endocrine, respiratory, or other bodily change measured during an emotion-relevant event.
    ontological_level: type
    curation_status: accepted
    state_kind: physiological
    bearer_scope: person
    temporal_scale: episode
    boundary_notes:
      - Different physiological channels need not covary or uniquely identify a named emotion.
    provenance: *provenance

  - id: pmm:construct:emotion-action-tendency
    type: Construct
    label: Emotion-related action tendency
    definition: A context-sensitive readiness or inclination toward a class of actions, such as approach, withdrawal, attack, freezing, support seeking, or repair.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - A tendency is not the same as an observed action and may be inhibited, redirected, or never performed.
    provenance: *provenance

  - id: pmm:behavior:emotion-expression
    type: Behavior
    label: Emotion-related expression
    definition: Observable facial, vocal, postural, or gestural behavior occurring during an emotion-relevant event.
    ontological_level: type
    curation_status: accepted
    behavior_kind: response_pattern
    observability: direct
    actor_scope: person
    response_topography: Protocol-defined facial, vocal, postural, or gestural change.
    function_note: Expression can communicate, regulate interaction, or reflect response preparation, but its function cannot be inferred from appearance alone.
    provenance: *provenance

  - id: pmm:behavior:emotion-related-action
    type: Behavior
    label: Emotion-related overt action
    definition: Observable action taken during or after an emotion-relevant event that may alter the situation, the person's exposure, or social feedback.
    ontological_level: type
    curation_status: accepted
    behavior_kind: action
    observability: direct
    actor_scope: person
    response_topography: Study- or person-specific approach, avoidance, communication, inhibition, or problem-solving action.
    function_note: Similar-looking actions can serve different functions and the same feeling can precede different actions.
    provenance: *provenance

  - id: pmm:measurement:event-appraisal-report
    type: Measurement
    label: Event appraisal report
    definition: Self-report or structured rating of declared appraisal dimensions for a specific event or recalled episode.
    ontological_level: type
    curation_status: accepted
    measurement_kind: self_report
    target_ids: [pmm:construct:event-appraisal-profile]
    method: Rate study-defined meaning dimensions independently of the final emotion label where possible.
    unit_of_analysis: self_report
    result_type: continuous
    boundary_notes:
      - Retrospective reports can reconstruct appraisals after the emotion and do not establish temporal or causal order.
    provenance: *provenance

  - id: pmm:measurement:emotional-feeling-report
    type: Measurement
    label: Emotional feeling report
    definition: Self-reported intensity, quality, or category of conscious emotional experience during or after a declared event.
    ontological_level: type
    curation_status: accepted
    measurement_kind: self_report
    target_ids: [pmm:state:subjective-emotional-feeling]
    method: Use a declared rating scale, emotion vocabulary, timing, and reference period.
    unit_of_analysis: self_report
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:emotion-physiology-recording
    type: Measurement
    label: Emotion-related physiology recording
    definition: Channel-specific recording of bodily responses time-locked to an emotion-relevant event.
    ontological_level: type
    curation_status: accepted
    measurement_kind: physiology
    target_ids: [pmm:state:emotion-related-physiological-response]
    method: Record and analyze each declared physiological channel with its own baseline, timing, and preprocessing.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:emotion-expression-coding
    type: Measurement
    label: Emotion expression coding
    definition: Observer or automated coding of declared facial, vocal, postural, or gestural features during an event.
    ontological_level: type
    curation_status: accepted
    measurement_kind: observation
    target_ids: [pmm:behavior:emotion-expression]
    method: Apply a declared coding protocol to recorded expressive behavior without treating the code as direct access to subjective feeling.
    unit_of_analysis: behavior
    result_type: continuous
    provenance: *provenance

  - id: pmm:mechanism:appraisal-guided-component-coordination
    type: Mechanism
    label: Appraisal-guided component coordination
    definition: Proposed dynamic process in which evaluations of an event's meaning help organize changing action tendencies, physiology, expression, feeling, and action over time.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - {role: relevant event, object_id: pmm:context:emotion-relevant-event}
      - {role: evaluated meaning, object_id: pmm:construct:event-appraisal-profile}
      - {role: subjective experience, object_id: pmm:state:subjective-emotional-feeling}
      - {role: bodily response, object_id: pmm:state:emotion-related-physiological-response}
      - {role: action readiness, object_id: pmm:construct:emotion-action-tendency}
      - {role: overt action, object_id: pmm:behavior:emotion-related-action}
    realization_conditions:
      - Appraisal and response components are measured repeatedly with sufficient temporal resolution.
      - Competing bodily, learning, perceptual, and constructionist explanations remain testable.
      - Component changes are not inferred from one self-report score alone.
    boundary_notes:
      - The complete coordination loop is a theoretical mechanism, not a direct consequence of appraisal-emotion correlations.
      - Appraisal need not be conscious or verbal, but calling an unmeasured process automatic does not verify it.
    provenance: *provenance

relations:
  - {id: pmm:relation:appraisal-profile-measured-by-report, subject_id: pmm:construct:event-appraisal-profile, predicate: measured_by, object_id: pmm:measurement:event-appraisal-report, provenance: *provenance}
  - {id: pmm:relation:emotional-feeling-measured-by-report, subject_id: pmm:state:subjective-emotional-feeling, predicate: measured_by, object_id: pmm:measurement:emotional-feeling-report, provenance: *provenance}
  - {id: pmm:relation:emotion-physiology-measured-by-recording, subject_id: pmm:state:emotion-related-physiological-response, predicate: measured_by, object_id: pmm:measurement:emotion-physiology-recording, provenance: *provenance}
  - {id: pmm:relation:emotion-expression-measured-by-coding, subject_id: pmm:behavior:emotion-expression, predicate: measured_by, object_id: pmm:measurement:emotion-expression-coding, provenance: *provenance}

claims:
  - id: pmm:claim:emotion-episode-is-multicomponent-process
    claim_type: definition
    statement: An emotion episode should be represented as a time-varying set of experiential, physiological, action-related, and expressive components in context rather than as one interchangeable score or label.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'Major component reviews converge on separating response systems, while theories disagree about their causal organization and the primacy of conscious feeling.'}
    scope:
      population: Humans experiencing or reporting time-bounded emotional events.
      species: [human]
      context_ids: [pmm:context:emotion-relevant-event]
      temporal_scope: Seconds to minutes within an emotional episode.
    defined_object_id: pmm:construct:emotion-episode
    source_ids: [pmm:source:mauss-robinson-2009-emotion-measures, pmm:source:scherer-moors-2019-emotion-process]
    evidence_ids: []
    limitations:
      - This representation organizes measurement and does not establish that one component causes the others or that every episode contains every component.
    provenance: *provenance

  - id: pmm:claim:emotion-measures-are-not-interchangeable
    claim_type: definition
    statement: Self-reported feeling, physiology, expressive behavior, action, and observer labels measure different aspects of an emotional episode and no single channel is a universal gold standard for the others.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'The measurement review found unique variance and limited convergence across experiential, physiological, and behavioral systems, although each method also has specific limitations.'}
    scope:
      population: Humans measured during laboratory or naturalistic emotional events represented in the review literature.
      species: [human]
      context_ids: [pmm:context:emotion-relevant-event]
      temporal_scope: Measurement within or after a declared emotional episode.
    defined_object_id: pmm:measurement:emotional-feeling-report
    source_ids: [pmm:source:mauss-robinson-2009-emotion-measures]
    evidence_ids: []
    limitations:
      - Self-report is the most direct available measure of conscious feeling but is not a complete measure of physiology, behavior, or an unreported process.
    provenance: *provenance

  - id: pmm:claim:appraisal-patterns-associated-with-emotion-reports
    claim_type: association
    statement: Across the studies synthesized by Yeo and Ong, measured appraisal dimensions were systematically associated with reported emotions, but the profiles were overlapping and included many relationships not uniquely predicted in advance.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'A large mixed-effects meta-analysis synthesized 2,634 effects from 309 studies, but heterogeneous terminology, retrospective self-report, shared method, and noncausal designs limit mechanistic interpretation.'}
    scope:
      population: Human participants represented in 309 appraisal-emotion studies across 251 reports.
      species: [human]
      context_ids: [pmm:context:emotion-relevant-event]
      temporal_scope: Event appraisal and reported emotion in experimental, recalled, and other study contexts included in the meta-analysis.
      boundary_conditions:
        - Forty-seven appraisal dimensions, 63 emotions, heterogeneous measures, and the study designs included by Yeo and Ong.
    exposure_id: pmm:measurement:event-appraisal-report
    outcome_id: pmm:measurement:emotional-feeling-report
    estimate: {metric: mean correlation for previously hypothesized appraisal-emotion relationships, value_status: reported, value: 0.33, direction: positive, notes: 'Seventy-five percent of previously hypothesized relationships were statistically significant; unpredicted relationships averaged r = .27.'}
    confounding_note: Shared self-report method, retrospective reconstruction, emotion-label semantics, event selection, culture, and study design can produce or alter appraisal-emotion associations.
    evidence_ids: [pmm:evidence:yeo-ong-2024-appraisal-meta-analysis]
    limitations:
      - Correlation does not show that a measured appraisal uniquely caused the emotion, nor that changing one appraisal will reliably change every response channel.
    provenance: *provenance

  - id: pmm:claim:appraisal-guided-coordination-is-mechanism-hypothesis
    claim_type: mechanism_hypothesis
    statement: Changes in multi-level appraisal may help organize the unfolding pattern of action tendency, physiology, expression, feeling, and overt action during an emotion episode.
    epistemic_status: proposed
    confidence: {level: low, rationale: 'Experimental appraisal manipulations and component findings constrain the theory, but comprehensive tests of temporal coordination, mediation, and alternatives remain incomplete.'}
    scope:
      population: Humans in appraisal and emotion-process studies.
      species: [human]
      context_ids: [pmm:context:emotion-relevant-event]
      temporal_scope: Dynamic unfolding of an emotional episode over seconds to minutes.
      boundary_conditions:
        - Repeated, independently operationalized appraisal and response-component measurements with explicit temporal ordering.
    mechanism_id: pmm:mechanism:appraisal-guided-component-coordination
    exposure_id: pmm:construct:event-appraisal-profile
    outcome_id: pmm:construct:emotion-episode
    temporal_ordering: The theory predicts appraisal changes that precede or recursively interact with later component changes, but many studies measure appraisal and feeling retrospectively at the same time.
    falsifiable_boundary: The account is weakened when independently manipulated appraisal dimensions fail to alter predicted later components, or when competing bodily, perceptual, learning, or constructionist models explain the temporal data better.
    evidence_ids: [pmm:evidence:scherer-moors-2019-component-process-review]
    limitations:
      - The review supports a research programme and partial predictions, not one universally established causal sequence for all emotions.
    provenance: *provenance

evidence:
  - id: pmm:evidence:yeo-ong-2024-appraisal-meta-analysis
    claim_ids: [pmm:claim:appraisal-patterns-associated-with-emotion-reports]
    source_id: pmm:source:yeo-ong-2024-appraisal-meta
    extraction_locator: PubMed abstract reporting the mixed-effects synthesis, study and effect counts, and mean correlations for predicted and unpredicted appraisal-emotion relationships.
    evidence_kind: meta_analysis
    design: Mixed-effects meta-analysis of 2,634 effect sizes from 309 studies across 251 reports, covering 47 appraisal dimensions, 63 emotions, and 853 specific relationships.
    population: Human participants in the appraisal-emotion studies included by Yeo and Ong.
    species: [human]
    inference_support: association
    support_direction: supports
    causal_support: none
    effect: {metric: mean correlation for previously hypothesized appraisal-emotion relationships, value_status: reported, value: 0.33, direction: positive, notes: '75.0% of hypothesized relationships were statistically significant; unpredicted relationships averaged r = .27.'}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: adequate, replication: independent_replication}
    summary: Appraisal dimensions showed systematic but nonunique associations with reported emotions across a large heterogeneous literature.
    limitations:
      - The abstract-level extraction does not re-grade every included study, and shared method, retrospective designs, heterogeneity, and publication selection limit causal interpretation.
    provenance: *provenance

  - id: pmm:evidence:scherer-moors-2019-component-process-review
    claim_ids: [pmm:claim:appraisal-guided-coordination-is-mechanism-hypothesis]
    source_id: pmm:source:scherer-moors-2019-emotion-process
    extraction_locator: Abstract and review synthesis describing event appraisal, component differentiation, interactions, and unresolved temporal coordination.
    evidence_kind: narrative_review
    design: Integrative review emphasizing experimental emotion research and neighboring domains relevant to elicitation, action tendencies, physiology, expression, feeling, and labeling.
    population: Human emotion studies reviewed by the authors.
    species: [human]
    inference_support: mechanism
    support_direction: mixed
    causal_support: indirect
    domains: {directness: partially_indirect, risk_of_bias: not_assessed, consistency: mixed, precision: not_reported, replication: conceptual_replication}
    summary: The review reports evidence compatible with appraisal-related component differentiation while identifying interactions, timing, and synchronization as unresolved mechanism problems.
    limitations:
      - A narrative review of heterogeneous studies cannot by itself establish the complete appraisal-to-component causal architecture.
    provenance: *provenance

sources:
  - id: pmm:source:yeo-ong-2024-appraisal-meta
    title: Associations between cognitive appraisals and emotions — a meta-analytic review
    source_type: peer_reviewed_article
    authors: [Gerard C. Yeo, Desmond C. Ong]
    year: 2024
    doi: 10.1037/bul0000452
    pmid: '39404856'
    url: https://pubmed.ncbi.nlm.nih.gov/39404856/
    accessed_at: '2026-08-26'
    authority_note: Recent large meta-analysis used for quantitative appraisal-emotion associations, not for causal mechanism claims.
    provenance: *provenance

  - id: pmm:source:scherer-moors-2019-emotion-process
    title: The emotion process — event appraisal and component differentiation
    source_type: peer_reviewed_article
    authors: [Klaus R. Scherer, Agnes Moors]
    year: 2019
    doi: 10.1146/annurev-psych-122216-011854
    pmid: '30110576'
    url: https://pubmed.ncbi.nlm.nih.gov/30110576/
    accessed_at: '2026-08-26'
    authority_note: Authoritative process review used to define component distinctions and represent appraisal-driven coordination as a theory requiring further tests.
    provenance: *provenance

  - id: pmm:source:mauss-robinson-2009-emotion-measures
    title: Measures of emotion — a review
    source_type: peer_reviewed_article
    authors: [Iris B. Mauss, Michael D. Robinson]
    year: 2009
    doi: 10.1080/02699930802204677
    pmid: '19809584'
    url: https://pubmed.ncbi.nlm.nih.gov/19809584/
    accessed_at: '2026-08-26'
    authority_note: Measurement review used to prevent subjective experience, physiology, and behavior from being treated as interchangeable emotion measures.
    provenance: *provenance
