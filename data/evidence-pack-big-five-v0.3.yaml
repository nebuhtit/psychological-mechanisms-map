dataset_id: pmm:dataset:big-five-measurement-evidence-v0-3
metadata:
  title: Evidence pack for the Big Five taxonomy and BFI-2 measurement
  description: Separates a descriptive trait taxonomy, five broad trait constructs, questionnaire context, item responses, scores, factor-model parameters, academic performance, and noncausal associations.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.1.0
    created_at: '2026-08-26T23:00:00+03:00'
    modified_at: '2026-08-26T23:00:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:construct:big-five-trait-taxonomy
    type: Construct
    label: Big Five trait taxonomy
    definition: Hierarchical descriptive system organizing covariation among relatively enduring personality tendencies into five broad domains and narrower facets.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - The taxonomy describes dimensions, not five personality types.
      - A trait score summarizes responses under a measurement model; it is not a directly observed entity or a causal mechanism.
      - The taxonomy does not imply that all personality variation, development, culture, or psychopathology is exhausted by five domains.
    provenance: *provenance

  - id: pmm:construct:extraversion-trait
    type: Construct
    label: Extraversion
    definition: Broad trait domain organizing tendencies related to sociability, assertiveness, energy, and engagement with social or rewarding environments.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes: [A domain score is dimensional and does not assign a person to an extravert or introvert type.]
    provenance: *provenance
  - id: pmm:construct:agreeableness-trait
    type: Construct
    label: Agreeableness
    definition: Broad trait domain organizing tendencies related to compassion, respectfulness, trust, and cooperative interpersonal orientation.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes: [Agreeableness is not equivalent to moral worth, compliance, or absence of conflict.]
    provenance: *provenance
  - id: pmm:construct:conscientiousness-trait
    type: Construct
    label: Conscientiousness
    definition: Broad trait domain organizing tendencies related to organization, productiveness, responsibility, and regulation of goal-directed activity.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes: [A conscientiousness score does not identify which habits, skills, incentives, or environments generated the observed responses.]
    provenance: *provenance
  - id: pmm:construct:negative-emotionality-trait
    type: Construct
    label: Negative Emotionality
    aliases: [Neuroticism]
    definition: Broad trait domain organizing relatively stable individual differences in anxiety-proneness, depressive affect, and emotional volatility.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes: [A trait dimension is not a current emotional state, symptom diagnosis, or disorder.]
    provenance: *provenance
  - id: pmm:construct:open-mindedness-trait
    type: Construct
    label: Open-Mindedness
    aliases: [Openness to Experience]
    definition: Broad trait domain organizing tendencies related to intellectual curiosity, aesthetic sensitivity, and creative imagination.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes: [Open-Mindedness is not interchangeable with intelligence, political tolerance, or creativity performance.]
    provenance: *provenance

  - id: pmm:context:bfi2-self-report-assessment
    type: Context
    label: BFI-2 self-report assessment
    definition: Standardized questionnaire context in which a respondent rates 60 short personality-descriptive phrases on an agreement scale for scoring five domains and 15 facets.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      respondent: self-report
      item_count: 60
      response_scale: five-point agreement scale
      domains: Extraversion, Agreeableness, Conscientiousness, Negative Emotionality, Open-Mindedness
      facets: three per domain
    scope: Standard BFI-2 administration and scoring in populations for which the instrument and language version are appropriate.
    boundary_notes:
      - The instrument is copyrighted and freely available for noncommercial research under conditions stated by its authors.
      - The Berkeley Personality Lab states that there is no official BFI-2 manual with published norms.
      - Translation, age, response style, missingness, and administration mode can affect score interpretation.
    provenance: *provenance

  - id: pmm:behavior:bfi2-item-rating
    type: Behavior
    label: BFI-2 item rating
    definition: Observable selection of an agreement response to one personality-descriptive questionnaire phrase.
    ontological_level: type
    curation_status: accepted
    behavior_kind: verbal_behavior
    observability: direct
    actor_scope: person
    response_topography: Selection of one point on the protocol-defined agreement scale.
    function_note: A rating can reflect trait-relevant self-perception, item interpretation, reference group, response style, impression management, or transient context.
    provenance: *provenance

  - id: pmm:measurement:bfi2-domain-facet-scores
    type: Measurement
    label: BFI-2 domain and facet scores
    definition: Scored composites of item ratings intended to estimate five broad personality domains and 15 narrower facets.
    ontological_level: type
    curation_status: accepted
    measurement_kind: psychometric_scale
    target_ids: [pmm:construct:extraversion-trait, pmm:construct:agreeableness-trait, pmm:construct:conscientiousness-trait, pmm:construct:negative-emotionality-trait, pmm:construct:open-mindedness-trait]
    method: Apply the instrument authors' scoring rules to a standard, appropriately translated BFI-2 administration and document missing-data handling.
    unit_of_analysis: self_report
    result_type: continuous
    boundary_notes:
      - Scores are estimates conditional on items, scoring, language, population, and response quality.
      - Scores should not be converted into categorical personality types without a separately validated rule.
    provenance: *provenance

  - id: pmm:measurement:bfi2-hierarchical-factor-profile
    type: Measurement
    label: BFI-2 hierarchical factor profile
    definition: Model-based representation of item covariation as 15 facet dimensions nested within five broad personality domains.
    ontological_level: type
    curation_status: provisional
    measurement_kind: computational_parameter
    target_ids: [pmm:construct:big-five-trait-taxonomy, pmm:measurement:bfi2-domain-facet-scores]
    method: Fit and compare declared hierarchical psychometric models to item-level responses, reporting fit, loadings, reliability, and validation data.
    unit_of_analysis: person
    result_type: model_parameter
    boundary_notes:
      - A factor loading is a statistical parameter, not a psychological mechanism.
      - Model fit does not prove that five domains are biologically fundamental or invariant in every population.
    provenance: *provenance

  - id: pmm:outcome:academic-performance
    type: Outcome
    label: Academic performance
    definition: Protocol-defined educational performance such as grades, grade-point average, examination scores, or teacher-rated achievement.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    boundary_notes: [Different educational levels, subjects, grading systems, and raters are not interchangeable outcomes.]
    provenance: *provenance

