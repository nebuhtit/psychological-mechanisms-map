claims:
  - id: pmm:claim:big-five-is-dimensional-taxonomy
    claim_type: definition
    statement: The Big Five is a hierarchical dimensional taxonomy of broad personality-trait covariation, not a classification into five person types or a causal theory of personality.
    epistemic_status: supported
    confidence: {level: moderate, rationale: "The definition follows the integrative taxonomy literature and BFI-2 authors' description, while boundaries and measurement invariance remain empirical questions."}
    scope:
      population: Humans described with Big Five trait language and measures.
      species: [human]
      context_ids: [pmm:context:bfi2-self-report-assessment]
      temporal_scope: Relatively enduring patterns summarized across observations or self-reports.
    defined_object_id: pmm:construct:big-five-trait-taxonomy
    source_ids: [pmm:source:john-naumann-soto-2008-big-five, pmm:source:berkeley-bfi2-2026]
    evidence_ids: []
    limitations: [The definition does not establish one correct instrument, universal norms, causal mechanisms, or exhaustive coverage of personality.]
    provenance: *provenance

  - id: pmm:claim:bfi2-supports-five-domain-fifteen-facet-profile
    claim_type: association
    statement: In the Soto and John BFI-2 development studies, item responses supported a hierarchical measurement profile with 15 facets nested within five broad domains and showed useful reliability and validity patterns.
    epistemic_status: supported
    confidence: {level: moderate, rationale: "Multiple development and validation studies support the intended hierarchy, but results are instrument-, sample-, language-, and model-dependent."}
    scope:
      population: Participants in the BFI-2 development and validation studies reported by Soto and John.
      species: [human]
      context_ids: [pmm:context:bfi2-self-report-assessment]
      temporal_scope: Questionnaire administration through psychometric model estimation.
      boundary_conditions: [The reported English-language BFI-2 item pool, samples, scoring, criteria, and hierarchical model comparisons.]
    exposure_id: pmm:behavior:bfi2-item-rating
    outcome_id: pmm:measurement:bfi2-hierarchical-factor-profile
    estimate: {metric: support for five-domain and 15-facet hierarchical measurement structure, value_status: qualitative_only, direction: positive, notes: "The studies developed and assessed the BFI-2 hierarchy, reliability, self-peer agreement, and predictive validity."}
    confounding_note: Item wording, response styles, shared method, sample composition, model selection, and criterion measurement can influence the observed structure and validity.
    evidence_ids: [pmm:evidence:soto-john-2017-bfi2-validation]
    limitations: [Psychometric structure is evidence about measurement organization, not proof of a biological or causal personality architecture.]
    provenance: *provenance

  - id: pmm:claim:conscientiousness-associated-with-academic-performance
    claim_type: association
    statement: Across the studies synthesized by Poropat, higher measured Conscientiousness was positively associated with academic performance, while effect size and relevance varied by educational level, measure, and criterion.
    epistemic_status: supported
    confidence: {level: moderate, rationale: "A large meta-analysis synthesized samples totaling more than 70,000 for some comparisons, but observational association and heterogeneous measures limit causal and individual prediction."}
    scope:
      population: Students represented in primary, secondary, and tertiary educational studies included by Poropat.
      species: [human]
      context_ids: [pmm:context:bfi2-self-report-assessment]
      temporal_scope: Personality assessment and academic outcomes in the included studies.
      boundary_conditions: [Included Five-Factor Model personality measures and protocol-defined academic performance criteria.]
    exposure_id: pmm:measurement:bfi2-domain-facet-scores
    outcome_id: pmm:outcome:academic-performance
    estimate: {metric: meta-analytic association between measured Conscientiousness and academic performance, value_status: qualitative_only, direction: positive, notes: Conscientiousness showed the strongest and most consistent positive academic-performance association among the broad traits in the reported synthesis.}
    confounding_note: Prior achievement, intelligence, socioeconomic conditions, motivation, study behavior, rater effects, and measurement differences can contribute to observed associations.
    evidence_ids: [pmm:evidence:poropat-2009-academic-meta-analysis]
    limitations: [The association does not show that changing a trait score causes better grades or justify high-stakes decisions about an individual.]
    provenance: *provenance

evidence:
  - id: pmm:evidence:soto-john-2017-bfi2-validation
    claim_ids: [pmm:claim:bfi2-supports-five-domain-fifteen-facet-profile]
    source_id: pmm:source:soto-john-2017-bfi2
    extraction_locator: Article abstract and study overview describing development and assessment of the hierarchical five-domain, 15-facet BFI-2 model.
    evidence_kind: cross_sectional_observational
    design: Multi-study questionnaire development and validation using item selection, hierarchical factor modeling, reliability, self-peer agreement, and criterion relations.
    population: Human participants in the BFI-2 development and validation studies; sample totals are not re-extracted in this pilot.
    species: [human]
    inference_support: association
    support_direction: supports
    causal_support: none
    effect: {metric: hierarchical measurement performance across development and validation studies, value_status: qualitative_only, direction: positive, notes: The reported studies supported five domains and 15 distinguishable facets with enhanced bandwidth and fidelity.}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: adequate, replication: conceptual_replication}
    summary: Development and validation studies supported the intended BFI-2 domain-facet hierarchy and criterion-related measurement properties.
    limitations: [The instrument was developed within particular samples and languages, and shared self-report method can inflate some relations.]
    provenance: *provenance

  - id: pmm:evidence:poropat-2009-academic-meta-analysis
    claim_ids: [pmm:claim:conscientiousness-associated-with-academic-performance]
    source_id: pmm:source:poropat-2009-academic-performance
    extraction_locator: PubMed abstract and meta-analytic report of Five-Factor Model personality and academic-performance relationships.
    evidence_kind: meta_analysis
    design: Meta-analysis of personality-academic performance associations across educational levels and study designs.
    population: Students represented in the included primary, secondary, and tertiary education studies; cumulative sample sizes reached more than 70,000 for some analyses.
    species: [human]
    inference_support: association
    support_direction: supports
    causal_support: none
    effect: {metric: association of broad personality factors with academic performance, value_status: qualitative_only, direction: positive, notes: Conscientiousness showed a positive association with academic performance across the synthesized literature.}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: adequate, replication: independent_replication}
    summary: A large meta-analysis found a positive Conscientiousness-academic performance association across heterogeneous educational studies.
    limitations: [Observational measures, publication selection, construct heterogeneity, and educational context limit causal and individual-level interpretation.]
    provenance: *provenance

