    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions: {stressor_family: MISTiC or modified TSST, outcome_domain: salivary cortisol}
    scope: Laboratory social-evaluative stress in the age ranges declared by each claim.
    provenance: *provenance

  - id: pmm:context:early-institutional-care-history
    type: Context
    label: Early institutional-care history
    definition: Developmental history of early orphanage care followed by international adoption in the Hostinar et al. sample.
    ontological_level: type
    curation_status: accepted
    context_kind: developmental
    dimensions: {exposure_period: early childhood, sampling_group: postinstitutionalized adoptees}
