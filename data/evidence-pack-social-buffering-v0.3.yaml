  - id: pmm:intervention:comparison-buffer-condition
    type: Intervention
    label: Comparison support condition
    definition: Randomized researcher, stranger, or no-buffer condition defined by the source study.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids: [pmm:state:cortisol-stress-response]
    delivery: Study-specific comparison interaction or absence of support.
    intended_direction: test
    provenance: *provenance

  - id: pmm:measurement:serial-salivary-cortisol
    type: Measurement
    label: Serial salivary cortisol
    definition: Repeated salivary cortisol assay used to estimate stress reactivity and recovery over time.
    ontological_level: type
    curation_status: accepted
    measurement_kind: physiology
    target_ids: [pmm:state:cortisol-stress-response]
    method: Collect saliva at protocol-defined baseline and post-stressor times and assay cortisol concentration.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

  - id: pmm:mechanism:social-co-regulation
    type: Mechanism
    label: Social co-regulation of stress responding
    definition: Proposed process through which interaction with a familiar support figure changes stress appraisal or regulatory activity and thereby alters physiological responding.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: social
    role_bindings:
      - {role: support condition, object_id: pmm:intervention:parent-buffer-condition}
      - {role: stress context, object_id: pmm:context:child-social-evaluative-stress}
      - {role: physiological response, object_id: pmm:state:cortisol-stress-response}
    realization_conditions:
      - The support figure is available under the source-specific protocol.
      - Relationship and developmental context permit effective co-regulation.
    boundary_notes:
      - A randomized support-condition effect does not identify the mediating psychological or neural process.
    provenance: *provenance

relations:
