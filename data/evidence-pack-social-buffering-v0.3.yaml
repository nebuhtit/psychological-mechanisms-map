    temporal_scale: minutes
    provenance: *provenance

  - id: pmm:intervention:parent-buffer-condition
    type: Intervention
    label: Parent social-buffer condition
    definition: Randomized protocol condition providing parent interaction or support around a social-evaluative stressor.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids: [pmm:state:cortisol-stress-response]
