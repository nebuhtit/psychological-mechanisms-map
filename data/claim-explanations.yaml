annotation_version: 0.1.0
canonical_language: en
languages: [en, ru]
method: Editorial explanations are written from the linked Claim, Evidence, and Source records. They simplify wording without increasing the strength or scope of the scientific inference.
review_status: source_checked_editorial
reviewed_at: '2026-08-26'
entries:
  - claim_id: pmm:claim:rdoc-potential-threat-definition
    en: >-
      This is the NIMH RDoC term for reactions to a possible danger that is not immediate or clearly predictable. It describes what researchers mean by “potential threat”; it is not evidence that this construct causes a particular behavior.
    ru: >-
      Это термин системы RDoC для реакций на возможную опасность, которая не является непосредственной и точно предсказуемой. Здесь объясняется, что исследователи называют «потенциальной угрозой»; само определение ничего не доказывает о причинах поведения.

  - claim_id: pmm:claim:active-avoidance-contingency-definition
    en: >-
      In an active-avoidance experiment, a participant can perform an action that changes whether, when, or how often an unpleasant event occurs, compared with not performing that action. This describes the task arrangement; it does not by itself show that avoidance was learned.
    ru: >-
      В эксперименте с активным избеганием участник может совершить действие, которое меняет вероятность или момент неприятного события по сравнению с бездействием. Это описание устройства задания, а не доказательство того, что участник уже научился избеганию.

  - claim_id: pmm:claim:anxiety-avoidance-association
    en: >-
      People or situations with stronger anxiety-related responses often also show more avoidance on average. The relationship varies substantially, so anxiety does not always lead to avoidance and the association alone does not establish cause.
    ru: >-
      В среднем более выраженная тревожная реакция часто сопровождается более сильным избеганием. Но эта связь сильно различается между людьми и ситуациями: тревога не всегда приводит к избеганию, а совместное появление двух явлений ещё не доказывает причинность.

  - claim_id: pmm:claim:assigned-loss-probability-changes-choice
    en: >-
      In a small laboratory study, participants gradually preferred the action that had been programmed to produce monetary loss less often. The experiment shows learning from different loss probabilities in that task, not a general rule for real-life anxiety or avoidance.
    ru: >-
      В небольшом лабораторном исследовании участники постепенно чаще выбирали действие, при котором денежная потеря происходила реже. Это показывает обучение на разной вероятности потери в конкретном задании, но не устанавливает общее правило для тревоги и избегания в жизни.

  - claim_id: pmm:claim:negative-reinforcement-mechanism-hypothesis
    en: >-
      If an action prevents or ends something unpleasant, that successful outcome may make the same action more likely next time. This is one explanation of avoidance learning; signals of safety and habit can also control the behavior, so the mechanism cannot be inferred from repeated avoidance alone.
    ru: >-
      Если действие предотвращает или прекращает неприятное событие, успешный результат может повысить вероятность такого же действия в следующий раз. Это одно из объяснений обучения избеганию; поведение также могут поддерживать сигнал безопасности или привычка, поэтому по одному повторению избегания нельзя определить механизм.

  - claim_id: pmm:claim:clinical-maintenance-loop-hypothesis
    en: >-
      Avoiding a feared situation can bring immediate relief. That relief may make avoidance more likely next time, while the person loses chances to learn that the situation is safe or manageable. This is a proposed process that may maintain anxiety in some contexts, not a rule for every form of avoidance.
    ru: >-
      Когда человек избегает пугающей ситуации, ему может быстро стать легче. Из-за этого в следующий раз он с большей вероятностью снова выберет избегание и не получит возможности проверить, действительно ли ситуация опасна или переносима. Это возможный механизм сохранения тревоги в некоторых условиях, а не правило для любого избегания.

  - claim_id: pmm:claim:proactive-interference-definition
    en: >-
      Proactive interference occurs when information learned earlier makes newer information harder to remember. The label describes a pattern of errors; it does not specify one unique mental or neural mechanism.
    ru: >-
      Проактивная интерференция возникает, когда ранее выученная информация мешает вспомнить более новую. Этот термин описывает наблюдаемый тип ошибок, но сам по себе не указывает на единственный психический или нейронный механизм.

  - claim_id: pmm:claim:retrieval-competition-hypothesis
    en: >-
      One proposed explanation is that, during recall, older memories compete with the newer target memory and make it harder to select. The reviewed evidence also allows problems during encoding, so retrieval competition is not established as the only cause.
    ru: >-
      Одно из возможных объяснений состоит в том, что при воспоминании старые следы конкурируют с нужной новой информацией и затрудняют её выбор. Но обзор допускает и нарушения на этапе запоминания, поэтому конкуренция при извлечении не доказана как единственная причина.

  - claim_id: pmm:claim:reward-prediction-error-definition
    en: >-
      A reward prediction error is the difference between the reward expected before an outcome and the reward actually received. It is a quantity in a learning model, not automatically the same thing as activity in one brain region or neurotransmitter system.
    ru: >-
      Ошибка предсказания вознаграждения — это разница между ожидаемой и фактически полученной наградой. Это величина в модели обучения; её нельзя автоматически отождествлять с активностью одной области мозга или одного нейромедиатора.

  - claim_id: pmm:claim:temporal-difference-update-hypothesis
    en: >-
      Temporal-difference models propose that a prediction error changes the stored value of preceding cues or actions, which then changes later choices. This is a useful computational explanation, but it does not show that every biological learning process implements the model in the same way.
    ru: >-
      Модели временных различий предполагают, что ошибка прогноза обновляет ценность предшествующих сигналов или действий и тем самым влияет на последующий выбор. Это полезное вычислительное объяснение, но оно не доказывает, что все биологические процессы обучения реализуют его одинаково.

  - claim_id: pmm:claim:hpa-negative-feedback-definition
    en: >-
      HPA negative feedback means that cortisol-related signals later restrain or reshape further activity of the stress-hormone system. It is not a single instant switch: several receptors, brain and pituitary sites, and time scales are involved.
    ru: >-
      Отрицательная обратная связь ГГН-оси означает, что сигналы, связанные с кортизолом, затем ограничивают или перестраивают дальнейшую активность гормональной системы стресса. Это не один мгновенный выключатель: участвуют разные рецепторы, участки мозга и гипофиза и разные временные интервалы.

  - claim_id: pmm:claim:hpa-feedback-mechanism-hypothesis
    en: >-
      The proposed mechanism is that glucocorticoid signaling helps prevent the HPA stress response from continuing unchecked and helps shape its pulses over time. The exact contribution depends on receptor, site, timing, and physiological state.
    ru: >-
      Предполагается, что сигналы глюкокортикоидов не дают стрессовой реакции ГГН-оси продолжаться без ограничений и участвуют в формировании её пульсаций. Конкретный эффект зависит от типа рецептора, места действия, времени и состояния организма.

  - claim_id: pmm:claim:social-buffering-definition
    en: >-
      Social buffering means that the presence or support of another person changes the size or time course of a stress response. The term describes an effect to be measured; it does not by itself identify how the support produced that effect.
    ru: >-
      Социальная буферизация означает, что присутствие или поддержка другого человека меняет силу либо развитие стрессовой реакции во времени. Термин описывает измеряемый эффект, но сам по себе не объясняет, каким механизмом поддержка его вызвала.

  - claim_id: pmm:claim:buffer-condition-moderates-cortisol-time-course
    en: >-
      In the child stress experiment, cortisol changed over time differently depending on which support condition the child had been assigned to. This is an interaction with sampling time, not a claim that one condition had a fixed effect at every measurement.
    ru: >-
      В эксперименте с детьми динамика кортизола во времени различалась в зависимости от назначенного условия поддержки. Речь идёт о различии траекторий по моментам измерения, а не о постоянном одинаковом эффекте поддержки в каждой точке времени.

  - claim_id: pmm:claim:parent-buffer-causal-effect-on-cortisol
    en: >-
      Children were assigned to different support conditions during a laboratory stress task, and the parent-support condition produced a different cortisol trajectory than the comparison conditions. The causal conclusion is limited to this task, sample, and measured hormone response.
    ru: >-
      Во время лабораторного стрессового задания детей распределяли по разным условиям поддержки, и при поддержке родителя динамика кортизола отличалась от условий сравнения. Причинный вывод относится только к этому заданию, этой выборке и измеренной гормональной реакции.

  - claim_id: pmm:claim:safety-signal-contingency-affects-avoidance
    en: >-
      In several experiments, people avoided more when their response itself produced a signal indicating safety. The effect was not equally clear in all experiments and controls, so the current evidence is mixed rather than conclusive.
    ru: >-
      В нескольких экспериментах люди чаще избегали угрозы, когда их действие само вызывало сигнал безопасности. Эффект проявился не во всех экспериментах и контрольных условиях одинаково ясно, поэтому данные считаются смешанными, а не окончательными.

  - claim_id: pmm:claim:conditioned-safety-signal-mechanism-hypothesis
    en: >-
      A signal that repeatedly appears after successful avoidance may itself become desirable and help reinforce the avoidance response. This is a proposed explanation; the experiments do not show that a conditioned safety signal is the only process maintaining avoidance.
    ru: >-
      Сигнал, который многократно появляется после успешного избегания, может сам приобрести положительное значение и подкреплять избегающее действие. Это возможное объяснение; эксперименты не показывают, что условный сигнал безопасности является единственным механизмом поддержания избегания.

  - claim_id: pmm:claim:assigned-loss-probability-affects-choice
    en: >-
      In the Kim task, participants increasingly selected the action associated with a lower probability of monetary loss. Because the probabilities were programmed, the task supports a narrow causal effect on choice, but it does not identify whether relief, safety, or another representation drove learning.
    ru: >-
      В задании Kim участники всё чаще выбирали действие, связанное с меньшей вероятностью денежной потери. Поскольку вероятности задавались экспериментально, результат поддерживает узкий причинный вывод о выборе, но не показывает, что именно управляло обучением: облегчение, безопасность или другое представление.

  - claim_id: pmm:claim:active-control-affects-later-threat-response
    en: >-
      Participants who could actively prevent shock during learning showed a different skin-conductance response the next day than yoked participants who received the same events without control. This shows an effect of controllability in that protocol, not a general reduction of all later fear or anxiety.
    ru: >-
      Участники, которые во время обучения могли действием предотвратить удар током, на следующий день отличались по кожно-гальванической реакции от участников, получавших те же события без контроля. Это эффект контролируемости в конкретном протоколе, а не доказательство общего снижения любой последующей тревоги или страха.

  - claim_id: pmm:claim:context-shift-causes-renewal
    en: >-
      A conditioned fear response can return when testing takes place outside the context where extinction was learned. This shows that extinction learning is often tied to context; it does not mean that fear must return after every context change.
    ru: >-
      Условная реакция страха может вернуться, если проверка проходит не в той обстановке, где происходило угасание. Это показывает зависимость угасания от контекста, но не означает, что страх обязательно возвращается при любой смене обстановки.

  - claim_id: pmm:claim:time-allows-spontaneous-recovery
    en: >-
      Even after a fear response decreases during extinction, part of the response can reappear after a delay without new threat learning. The size of this spontaneous recovery depends on the procedure and is not evidence that extinction had no effect.
    ru: >-
      Даже если во время угасания реакция страха уменьшилась, спустя время часть реакции может вернуться без нового обучения угрозе. Величина такого спонтанного восстановления зависит от процедуры и не означает, что угасание совсем не подействовало.

  - claim_id: pmm:claim:extinction-memory-mechanism-hypothesis
    en: >-
      A leading explanation is that extinction creates new “this cue is now safe” learning that competes with the older threat memory rather than erasing it. Return of fear is compatible with this account, but does not prove it is the only mechanism of extinction.
    ru: >-
      Одно из основных объяснений состоит в том, что при угасании формируется новое знание «этот сигнал теперь безопасен», которое конкурирует со старой памятью об угрозе, а не стирает её. Возврат страха согласуется с этой моделью, но не доказывает, что это единственный механизм угасания.

  - claim_id: pmm:claim:reactivation-extinction-prevents-return
    en: >-
      A large preregistered direct replication found no reliable advantage of giving extinction shortly after memory reactivation over ordinary extinction: fear returned in both groups. The original procedure therefore should not be presented as a robust way to prevent return of fear.
    ru: >-
      В крупной заранее зарегистрированной прямой репликации угасание вскоре после реактивации памяти не имело надёжного преимущества перед обычным угасанием: страх возвращался в обеих группах. Поэтому исходную процедуру нельзя представлять как устойчиво доказанный способ предотвращения возврата страха.

  - claim_id: pmm:claim:extended-training-causes-outcome-insensitivity
    en: >-
      One influential experiment reported that extensive training made responses less sensitive to whether the outcome was still valuable, which is used as a laboratory sign of habit. A later multilaboratory study did not find a robust training-duration effect, so the evidence is mixed.
    ru: >-
      В одном влиятельном эксперименте после длительной тренировки действия стали меньше зависеть от текущей ценности результата — это используют как лабораторный признак привычки. Позднее многоцентровое исследование не обнаружило устойчивого эффекта длительности тренировки, поэтому данные остаются смешанными.

  - claim_id: pmm:claim:acute-stress-causes-habit-shift
    en: >-
      Two preregistered exact replications did not find evidence that acute stress shifted behavior from goal-directed control to habits. However, the unstressed groups also failed the expected goal-directed benchmark, so the studies cannot establish that stress never has such an effect.
    ru: >-
      Две заранее зарегистрированные точные репликации не нашли подтверждения тому, что острый стресс переключает поведение с целенаправленного контроля на привычный. Но и группы без стресса не показали ожидаемый эталон целенаправленного поведения, поэтому эти исследования не доказывают, что такого эффекта стресса не бывает никогда.

  - claim_id: pmm:claim:habit-measures-converge
    en: >-
      Different laboratory tasks and self-report questionnaires intended to measure habit did not consistently identify the same individual differences. They should not be treated as interchangeable measures of one established “habit strength” variable.
    ru: >-
      Разные лабораторные задания и опросники, предназначенные для измерения привычек, не выявляли одни и те же индивидуальные различия достаточно последовательно. Их нельзя считать взаимозаменяемыми измерениями единой доказанной «силы привычки».

  - claim_id: pmm:claim:habitual-control-mechanism-hypothesis
    en: >-
      Habitual control is proposed to occur when a cue triggers a learned response with little use of the outcome’s current value. The idea is useful, but human tasks do not always produce or measure this form of control reliably.
    ru: >-
      Предполагается, что при привычном контроле сигнал запускает выученное действие почти без учёта текущей ценности результата. Эта идея полезна, но лабораторные задания у людей не всегда надёжно создают или измеряют именно такой контроль.

  - claim_id: pmm:claim:reappraisal-reduces-reported-negative-emotion
    en: >-
      In brief laboratory tasks, people instructed to reinterpret a negative stimulus usually reported feeling less negative than under the comparison instruction. This supports a short-term effect on self-report, not a guarantee of lasting benefit in everyday life or therapy.
    ru: >-
      В коротких лабораторных заданиях люди, которым предлагали переосмыслить неприятный стимул, обычно сообщали о менее сильных негативных переживаниях, чем при инструкции сравнения. Это подтверждает кратковременный эффект на самоотчёт, но не гарантирует длительную пользу в повседневной жизни или терапии.

  - claim_id: pmm:claim:reappraisal-reduces-autonomic-reactivity
    en: >-
      Reappraisal reduced some bodily measures of emotional arousal in one experiment, but another study found no clear physiological difference after acute stress. Subjective relief and autonomic change therefore should not be assumed to move together.
    ru: >-
      В одном эксперименте переоценка уменьшала некоторые физиологические показатели возбуждения, но в другом исследовании после острого стресса ясного физиологического различия не обнаружили. Поэтому нельзя считать, что субъективное облегчение и вегетативная реакция всегда изменяются одинаково.

  - claim_id: pmm:claim:neural-response-statistically-mediates-reappraisal
    en: >-
      In an fMRI analysis, changes in particular brain signals statistically accounted for part of the link between the reappraisal instruction and reported emotion. Because the brain activity was measured rather than experimentally changed, this is statistical mediation, not proof that those signals caused the emotional change.
    ru: >-
      В анализе фМРТ изменения некоторых мозговых сигналов статистически объясняли часть связи между инструкцией переоценки и самооценкой эмоции. Поскольку активность мозга измеряли, а не изменяли экспериментально, это статистическая медиация, а не доказательство того, что именно эти сигналы вызвали изменение эмоции.

  - claim_id: pmm:claim:meaning-reinterpretation-mechanism-hypothesis
    en: >-
      Cognitive reappraisal is proposed to work by changing what a situation is understood to mean before the emotional response is fully expressed. The studies show effects of reappraisal instructions, but do not establish one universal internal mechanism for every person and situation.
    ru: >-
      Предполагается, что когнитивная переоценка действует через изменение смысла ситуации до того, как эмоциональная реакция полностью развернулась. Исследования показывают эффект инструкции переоценки, но не устанавливают один универсальный внутренний механизм для всех людей и ситуаций.

  - claim_id: pmm:claim:lures-increase-n-back-false-alarms
    en: >-
      In verbal N-back tasks, a lure was a familiar item seen recently but in the wrong serial position. Participants falsely accepted these lures more often than ordinary non-targets, showing that the task requires control over familiarity, not just remembering items.
    ru: >-
      В вербальном N-back «ловушкой» был знакомый элемент, недавно показанный, но находившийся не на нужной позиции. Участники ошибочно принимали такие элементы за цель чаще обычных нецелевых стимулов, поэтому задание требует контролировать чувство знакомости, а не просто помнить элементы.

  - claim_id: pmm:claim:n-back-weakly-converges-with-complex-span
    en: >-
      People who scored well on verbal N-back were only slightly more likely to score well on operation span. The two tasks therefore should not be treated as interchangeable tests of one working-memory ability.
    ru: >-
      Люди с высоким результатом в вербальном N-back лишь немного чаще показывали высокий результат в тесте operation span. Поэтому эти задания нельзя считать взаимозаменяемыми измерениями одной и той же способности рабочей памяти.

  - claim_id: pmm:claim:n-back-and-backward-recall-are-distinct-factors
    en: >-
      In a large task battery, performance on N-back tasks and backward-recall tasks was best described by two related but distinct statistical factors. Calling both “working memory” does not mean they measure exactly the same ability.
    ru: >-
      В большой батарее заданий результаты N-back и воспроизведения в обратном порядке лучше описывались двумя связанными, но различными статистическими факторами. Общее название «рабочая память» не означает, что эти задания измеряют совершенно одну и ту же способность.

  - claim_id: pmm:claim:episodic-retrieval-can-support-n-back
    en: >-
      A computational model reproduced important N-back results by retrieving recent episodes rather than relying only on a fixed-capacity working-memory store. This shows that episodic retrieval is a viable explanation, not that the brain uses only this mechanism during N-back.
    ru: >-
      Вычислительная модель воспроизвела важные результаты N-back за счёт извлечения недавних эпизодов, а не только ограниченного хранилища рабочей памяти. Это показывает, что эпизодическое извлечение является возможным объяснением, но не доказывает, что мозг использует в N-back только этот механизм.

  - claim_id: pmm:claim:interoceptive-dimensions-are-dissociable
    en: >-
      Accurately detecting heartbeats, judging oneself as sensitive to bodily signals, and knowing when one’s heartbeat judgment is correct were distinct abilities in the study. A person can score high on one of these dimensions and not on the others.
    ru: >-
      Точность восприятия сердцебиения, субъективная оценка своей чувствительности к телесным сигналам и понимание того, когда собственный ответ верен, оказались разными характеристиками. Человек может иметь высокий показатель по одной из них и невысокий по другим.

  - claim_id: pmm:claim:cardiac-accuracy-not-generally-associated-with-anxiety
    en: >-
      A preregistered meta-analysis of 55 studies found no overall relationship between anxiety and objective performance on heartbeat counting or discrimination tasks. This does not mean that anxiety is unrelated to every aspect of interoception, especially attention to or interpretation of bodily sensations.
    ru: >-
      Заранее зарегистрированный метаанализ 55 исследований не обнаружил общей связи между тревогой и объективным выполнением заданий на подсчёт или различение сердцебиений. Это не означает, что тревога не связана с другими сторонами интероцепции, например с вниманием к телесным ощущениям или их интерпретацией.

  - claim_id: pmm:claim:isoproterenol-increases-anxiety-in-lesion-case-study
    en: >-
      In two people with bilateral amygdala damage, a drug that increased cardiorespiratory arousal produced more anxiety than saline, and one person experienced panic. The result shows that intense bodily signals can support anxiety without an intact amygdala, but two cases cannot establish a general mechanism.
    ru: >-
      У двух людей с двусторонним повреждением миндалины препарат, усиливавший сердечно-дыхательное возбуждение, вызвал больше тревоги, чем физраствор; у одного человека возникла паника. Результат показывает, что сильные телесные сигналы могут поддерживать тревогу без сохранной миндалины, но два случая не устанавливают общий механизм.

  - claim_id: pmm:claim:appraisal-may-link-bodily-signals-to-anxiety
    en: >-
      One hypothesis is that bodily changes contribute to anxiety through how the person notices and interprets them, rather than through signal intensity alone. The drug challenge is compatible with this idea but did not manipulate or measure the proposed appraisal pathway directly.
    ru: >-
      Одна из гипотез состоит в том, что телесные изменения влияют на тревогу через то, как человек их замечает и истолковывает, а не только через их физическую силу. Фармакологическая проба согласуется с этой идеей, но не изменяла и не измеряла предполагаемый путь интерпретации напрямую.

  - claim_id: pmm:claim:parent-buffer-changes-cortisol-trajectory
    en: >-
      During a laboratory stress task for children, assignment to support from a parent led to a different cortisol pattern over time than the comparison support conditions. The result concerns hormone response in this protocol, not every psychological benefit of parental presence.
    ru: >-
      Во время лабораторного стрессового задания у детей поддержка родителя приводила к иной динамике кортизола, чем условия сравнения. Результат относится к гормональной реакции в этом протоколе, а не ко всем возможным психологическим эффектам присутствия родителя.

  - claim_id: pmm:claim:buffer-condition-interacts-with-sampling-time
    en: >-
      The difference between support conditions was not constant: it depended on when cortisol was sampled after the stress task. This means the study found different response trajectories, not simply a single higher or lower cortisol value.
    ru: >-
      Различие между условиями поддержки не было постоянным и зависело от того, когда после стрессового задания измеряли кортизол. То есть исследование выявило разные траектории реакции, а не просто одно более высокое или низкое значение.

  - claim_id: pmm:claim:care-history-moderates-parent-support-effect
    en: >-
      Parent support dampened the cortisol response relative to stranger support in children without an institutional-care history, but not in previously institutionalized children. Early care history therefore changed the observed effect of who provided support in this sample.
    ru: >-
      У детей без опыта институционального ухода поддержка родителя ослабляла кортизоловую реакцию по сравнению с поддержкой незнакомого человека, а у ранее находившихся в учреждениях детей такого различия не было. Значит, в этой выборке ранняя история ухода изменяла эффект того, кто оказывал поддержку.

  - claim_id: pmm:claim:co-regulation-may-produce-buffering
    en: >-
      A proposed explanation is that a familiar caregiver helps the child regulate threat and arousal, which then reduces the stress-hormone response. The experiments demonstrate conditional buffering effects but do not isolate co-regulation as the causal mechanism.
    ru: >-
      Возможное объяснение состоит в том, что знакомый взрослый помогает ребёнку регулировать восприятие угрозы и возбуждение, что затем уменьшает гормональную стрессовую реакцию. Эксперименты показывают зависимый от условий буферный эффект, но не выделяют совместную регуляцию как доказанный причинный механизм.

  - claim_id: pmm:claim:rpe-is-model-defined-discrepancy
    en: >-
      In reinforcement-learning models, reward prediction error is the numerical difference between what was expected and what was obtained. A positive error means “better than expected” and a negative error “worse than expected”; the number is defined by the model, not directly observed in a neuron.
    ru: >-
      В моделях обучения с подкреплением ошибка предсказания награды — это численная разница между ожидаемым и полученным результатом. Положительная ошибка означает «лучше ожидания», отрицательная — «хуже ожидания»; эта величина задаётся моделью, а не наблюдается напрямую в отдельном нейроне.

  - claim_id: pmm:claim:timed-dopamine-stimulation-increases-learned-seeking
    en: >-
      In rats, precisely timed activation of dopamine neurons at reward delivery caused a cue to produce stronger reward seeking later. This supports a causal role for that stimulation in cue-reward learning in the tested animal procedures, not a general claim about all human rewards.
    ru: >-
      У крыс точно синхронизированная активация дофаминовых нейронов в момент награды приводила к более сильному последующему поиску награды по сигналу. Это подтверждает причинную роль такой стимуляции в обучении «сигнал — награда» в данных опытах на животных, но не является общим выводом обо всех наградах у людей.

  - claim_id: pmm:claim:distributional-model-predicts-held-out-reversal-point
    en: >-
      A model fitted to one half of each mouse dopamine neuron’s responses predicted where that neuron’s response would reverse in the other half of the trials. This supports a stable, heterogeneous distributional code in that dataset, but prediction alone does not prove that the model is the unique biological mechanism.
    ru: >-
      Модель, настроенная на половине ответов каждого дофаминового нейрона мыши, предсказывала точку смены ответа этого нейрона на другой половине проб. Это поддерживает устойчивое неоднородное распределённое кодирование в данных эксперимента, но само предсказание не доказывает, что модель описывает единственный биологический механизм.

  - claim_id: pmm:claim:rpe-may-drive-temporal-difference-updating
    en: >-
      The proposed process is that each prediction error updates the expected value of earlier cues or actions, gradually changing future choices. Dopamine signals are an important candidate implementation, but they also carry information beyond a simple scalar prediction error.
    ru: >-
      Предполагается, что каждая ошибка прогноза обновляет ожидаемую ценность предшествующих сигналов или действий и постепенно меняет будущий выбор. Дофаминовые сигналы считаются важным кандидатом на реализацию этого процесса, но они несут и другую информацию, не сводимую к одной численной ошибке.

  - claim_id: pmm:claim:hpa-feedback-is-multiple-receptor-linked-processes
    en: >-
      Cortisol feedback is produced by several receptor-linked processes acting at different sites and delays. Treating HPA feedback as one uniform arrow hides important differences between fast, delayed, brain, pituitary, continuous, and pulsatile regulation.
    ru: >-
      Обратная связь кортизола создаётся несколькими процессами, связанными с разными рецепторами, участками действия и задержками. Представление её одной однородной стрелкой скрывает различия между быстрым и отсроченным, мозговым и гипофизарным, непрерывным и пульсирующим регулированием.

  - claim_id: pmm:claim:cortisol-replacement-suppresses-acth-after-delay
    en: >-
      In healthy volunteers whose cortisol production had been pharmacologically reduced, giving cortisol back was followed after a delay by lower ACTH secretion. This supports delayed negative feedback under that endocrine manipulation, not an instantaneous effect in every stress response.
    ru: >-
      У здоровых добровольцев, которым фармакологически снижали выработку кортизола, введение кортизола спустя некоторое время уменьшало секрецию АКТГ. Это подтверждает отсроченную отрицательную обратную связь в данном эндокринном эксперименте, но не мгновенный одинаковый эффект при любой стрессовой реакции.

  - claim_id: pmm:claim:metyrapone-increases-continuous-and-pulsatile-acth
    en: >-
      Metyrapone reduced cortisol synthesis in healthy participants, after which both continuous and pulsatile components of ACTH secretion increased. The intervention supports cortisol feedback on ACTH dynamics, while the exact feedback sites remain unresolved by this result alone.
    ru: >-
      Метирапон снижал синтез кортизола у здоровых участников, после чего возрастали и непрерывная, и пульсирующая составляющие секреции АКТГ. Вмешательство подтверждает обратное влияние кортизола на динамику АКТГ, но само по себе не определяет точные места действия этой связи.

  - claim_id: pmm:claim:cortisol-signaling-may-limit-later-hpa-drive
    en: >-
      A proposed integrative mechanism is that cortisol signaling limits later drive through the HPA axis and helps organize its pulses. Evidence supports feedback, but its timing and location are heterogeneous, so the mechanism should not be represented as one simple linear inhibition.
    ru: >-
      Интегративная гипотеза состоит в том, что сигналы кортизола ограничивают последующую активность ГГН-оси и помогают организовать её пульсации. Данные поддерживают наличие обратной связи, но её время и место действия неоднородны, поэтому механизм нельзя изображать как одно простое линейное торможение.

  - claim_id: pmm:claim:naloxone-blocks-expectation-placebo-analgesia
    en: >-
      In one ischemic-pain experiment, naloxone removed the pain reduction produced by an expectation-based placebo procedure. This supports endogenous opioid involvement in that protocol, but does not show that all placebo analgesia is opioid-mediated.
    ru: >-
      В одном эксперименте с ишемической болью налоксон устранял уменьшение боли, вызванное плацебо-процедурой, основанной на ожидании. Это подтверждает участие эндогенной опиоидной системы в данном протоколе, но не показывает, что вся плацебо-анальгезия работает через опиоиды.

  - claim_id: pmm:claim:dopamine-modulation-null-effect
    en: >-
      In this human experiment, increasing or blocking dopamine pharmacologically produced no detectable change in treatment-expectation formation or placebo analgesia at the tested doses and times. This is evidence for a scoped null effect, not proof that dopamine is irrelevant to every placebo process.
    ru: >-
      В этом эксперименте на людях фармакологическое усиление или блокирование дофаминовой передачи не вызвало обнаружимого изменения формирования ожиданий лечения или плацебо-анальгезии при проверенных дозах и сроках. Это ограниченный нулевой результат, а не доказательство того, что дофамин не участвует ни в одном плацебо-процессе.

  - claim_id: pmm:claim:conditioning-neural-statistical-mediation
    en: >-
      In pooled neuroimaging data, measured brain activity statistically accounted for part of the difference between conditioned-plus-suggested and suggestion-only placebo analgesia. Because the neural signal was not manipulated, the analysis does not prove that this activity caused the pain reduction.
    ru: >-
      В объединённых данных нейровизуализации измеренная активность мозга статистически объясняла часть различия между плацебо с обусловливанием и словесным внушением и плацебо только с внушением. Поскольку мозговой сигнал не изменяли экспериментально, анализ не доказывает, что именно эта активность вызвала уменьшение боли.

  - claim_id: pmm:claim:expectation-opioid-mechanism-hypothesis
    en: >-
      Treatment expectations may recruit the body’s own opioid system and thereby reduce pain in some placebo procedures. Naloxone studies and a meta-analysis support this pathway, but effects vary across protocols and people, so it is not a universal placebo mechanism.
    ru: >-
      Ожидание эффекта лечения может в некоторых плацебо-процедурах активировать собственную опиоидную систему организма и тем самым уменьшать боль. Исследования с налоксоном и метаанализ поддерживают этот путь, но результаты различаются между протоколами и людьми, поэтому это не универсальный механизм любого плацебо.

  - claim_id: pmm:claim:rdoc-attention-regulates-limited-access
    en: >-
      In RDoC, “Attention” is a broad name for processes that control which information gains priority when awareness, perception, or action cannot process everything equally. PMM’s spatial-attention record covers only one part of that broad construct and is not a mechanism by itself.
    ru: >-
      В RDoC «внимание» — это широкое название процессов, которые определяют, какая информация получает приоритет, когда сознание, восприятие или действие не могут одинаково обработать всё сразу. Запись PMM о пространственном внимании охватывает лишь часть этого понятия и сама по себе не является механизмом.

  - claim_id: pmm:claim:valid-spatial-cues-reduce-detection-latency
    en: >-
      In the reported visual experiments, people responded faster when a cue correctly indicated where the target would appear than when the target appeared at an unexpected location. The manipulation establishes a task-specific cueing effect, but response speed alone cannot tell whether the cue changed perception, decision-making, or both.
    ru: >-
      В описанных зрительных экспериментах люди быстрее отвечали, когда подсказка правильно указывала место появления цели, чем когда цель появлялась в неожиданном месте. Эксперимент подтверждает эффект подсказки в этих заданиях, но одна скорость ответа не показывает, изменилась ли работа восприятия, принятие решения или оба процесса.

  - claim_id: pmm:claim:valid-endogenous-cues-improve-sequential-accuracy
    en: >-
      In one small orientation-discrimination experiment, valid cues improved accuracy even when the two possible target intervals were separated by enough time to redirect attention. This shows a cueing effect in that protocol and weakens a purely sensory explanation, but it does not establish one universal mechanism of attention.
    ru: >-
      В небольшом эксперименте по различению ориентации правильные подсказки повышали точность даже тогда, когда два возможных интервала предъявления были достаточно разделены во времени для переноса внимания. Это подтверждает эффект подсказки в данном протоколе и ослабляет чисто сенсорное объяснение, но не устанавливает единый универсальный механизм внимания.

  - claim_id: pmm:claim:sensory-enhancement-may-contribute-to-spatial-cueing
    en: >-
      One proposed process is that attention improves the quality of sensory information from the cued location. A multialternative experiment found higher model-estimated sensitivity there, but another detection-like task showed that sensory improvement cannot explain every cueing effect. The mechanism therefore remains conditional and proposed.
    ru: >-
      Одна из гипотез состоит в том, что внимание улучшает качество сенсорной информации из указанного подсказкой места. В одном многоальтернативном эксперименте модель оценила чувствительность в этом месте выше, но другое задание показало, что сенсорное улучшение объясняет не каждый эффект подсказки. Поэтому механизм остаётся условной гипотезой.

  - claim_id: pmm:claim:decision-weighting-may-contribute-to-spatial-cueing
    en: >-
      Another proposed process is that a predictive cue changes how strongly evidence from each location or time interval influences the final choice. Two experiments support this decision-related contribution, but it may operate together with sensory enhancement and was inferred through task comparisons and models rather than directly observed.
    ru: >-
      Другая гипотеза состоит в том, что предсказывающая подсказка меняет вес информации из разных мест или временных интервалов при окончательном выборе ответа. Два эксперимента поддерживают вклад этого процесса принятия решения, но он может работать вместе с сенсорным усилением и был выведен из сравнений заданий и моделей, а не наблюдался напрямую.

  - claim_id: pmm:claim:rdoc-declarative-memory-covers-facts-and-events
    en: >-
      RDoC uses “declarative memory” for processes that encode, retain, consolidate, and retrieve facts and events. It includes contributions to episodic and semantic memory, but it is not one test score, one brain region, or all forms of memory.
    ru: >-
      В RDoC «декларативная память» охватывает процессы кодирования, сохранения, консолидации и извлечения фактов и событий. Она включает эпизодическую и семантическую память, но не сводится к одному тесту, одной области мозга или всем видам памяти вообще.

  - claim_id: pmm:claim:semantic-encoding-questions-improve-later-word-recognition
    en: >-
      People later recognized words better when they had previously answered a question about each word’s meaning than when they had answered only about its appearance or sound. The experiment shows that the assigned encoding operation changed later performance, but it does not by itself reveal one unique memory mechanism.
    ru: >-
      Люди лучше узнавали слова, если ранее отвечали на вопрос об их значении, а не только о внешнем виде или звучании. Эксперимент показывает, что заданный способ обработки слова изменил последующий результат, но сам по себе не выявляет единственный механизм памяти.

  - claim_id: pmm:claim:developmental-amnesia-dissociates-episodic-and-semantic-memory
    en: >-
      Three people with early hippocampal pathology had profound difficulty remembering personally experienced events while acquiring much more factual, language, and school knowledge. This supports a distinction between episodic and semantic memory, but three clinical cases cannot establish a general causal rule.
    ru: >-
      Три человека с ранним повреждением гиппокампа испытывали выраженные трудности с воспоминанием лично пережитых событий, но значительно лучше усваивали факты, язык и школьные знания. Это поддерживает различие эпизодической и семантической памяти, однако три клинических случая не устанавливают общее причинное правило.

  - claim_id: pmm:claim:elaborative-semantic-encoding-may-support-retention
    en: >-
      One proposed explanation is that analyzing a word’s meaning connects it with context and existing knowledge, leaving a more distinctive representation for later recognition. The experiments are compatible with this explanation, but elaboration was inferred rather than isolated as the only process.
    ru: >-
      Возможное объяснение состоит в том, что анализ значения слова связывает его с контекстом и имеющимися знаниями, формируя более различимое представление для последующего узнавания. Эксперименты согласуются с этим объяснением, но проработка была выведена косвенно и не выделена как единственный процесс.

  - claim_id: pmm:claim:rdoc-perception-computes-over-sensory-data
    en: >-
      RDoC uses “perception” for processes that turn sensory input into useful representations of the outside world. The visual-perception pilot examines only one small part of this broad function, so detecting a striped pattern is not treated as a complete model of seeing.
    ru: >-
      В RDoC «восприятие» — это процессы, которые преобразуют сенсорные сигналы в полезные представления о внешнем мире. Пилот зрительного восприятия рассматривает лишь небольшую часть этой широкой функции, поэтому обнаружение полосатого изображения не считается полной моделью зрения.

  - claim_id: pmm:claim:contrast-sensitivity-is-reciprocal-threshold
    en: >-
      Researchers gradually reduce a pattern’s contrast until it can only just be detected reliably. A lower required contrast means greater sensitivity, so sensitivity is calculated as one divided by that threshold. Repeating this at several stripe widths produces a contrast sensitivity function; the curve is a measurement, not perception itself.
    ru: >-
      Исследователи постепенно уменьшают контраст изображения до уровня, при котором человек ещё может надёжно его обнаружить. Чем меньше требуемый контраст, тем выше чувствительность, поэтому её рассчитывают как единицу, делённую на порог. Повторение измерения для полос разной ширины даёт функцию контрастной чувствительности; эта кривая является измерением, а не самим восприятием.

  - claim_id: pmm:claim:grating-properties-change-detection-threshold
    en: >-
      In the classic experiments, the researchers changed how wide the light and dark stripes were and measured how much contrast people needed to see them. The required contrast changed systematically with stripe spacing and waveform. This establishes an effect of the tested image properties on detection in that procedure, but it does not reveal one unique brain mechanism.
    ru: >-
      В классических экспериментах исследователи меняли ширину светлых и тёмных полос и измеряли, какой контраст нужен человеку, чтобы их увидеть. Требуемый контраст закономерно менялся в зависимости от частоты и формы полос. Это подтверждает влияние свойств изображения на обнаружение в данном протоколе, но не выявляет единственный механизм мозга.

  - claim_id: pmm:claim:divisive-normalization-may-shape-visual-gain
    en: >-
      A proposed neural explanation is that a visual neuron’s response is scaled down by the combined activity of a larger pool of neurons, preventing responses from growing without limit as contrast increases. This model explains many visual-cortex findings, especially in nonhuman physiology, but it has not been shown here to be the unique cause of the human contrast-sensitivity curve.
    ru: >-
      Одна из нейронных гипотез состоит в том, что ответ зрительного нейрона уменьшается с учётом суммарной активности более широкой группы нейронов. Это не даёт ответу безгранично расти при увеличении контраста. Модель объясняет многие результаты исследований зрительной коры, особенно у животных, но приведённые данные не доказывают, что именно она является единственной причиной функции контрастной чувствительности человека.

  - claim_id: pmm:claim:deductive-reasoning-evaluates-necessary-conclusions
    en: >-
      Deductive reasoning asks whether a conclusion must follow if the stated premises are accepted. This defines a kind of reasoning; it does not say that one syllogism score measures all reasoning or identifies how the mind reaches the answer.
    ru: >-
      Дедуктивное рассуждение проверяет, должен ли вывод следовать из принятых посылок. Это определение вида рассуждения; оно не означает, что один результат задания измеряет всё мышление или показывает, каким именно способом человек получил ответ.

  - claim_id: pmm:claim:conclusion-believability-changes-validity-judgments
    en: >-
      People were more likely to accept a conclusion when it sounded believable, even though they were asked to judge whether it followed logically from the premises. The effect was stronger for invalid arguments. This shows that content changed responses in those tasks, not that participants had no logical information.
    ru: >-
      Люди чаще принимали вывод, если он казался правдоподобным, хотя их просили оценивать только то, следует ли он логически из посылок. Эффект был сильнее для невалидных аргументов. Это показывает влияние содержания на ответы в данных заданиях, но не доказывает полное отсутствие логической обработки.

  - claim_id: pmm:claim:believability-does-not-unconditionally-reduce-discriminability
    en: >-
      A reanalysis of 22 studies separated two things that raw accuracy can mix: detecting which arguments are valid and being more willing to accept believable conclusions. Believability changed response tendencies, but it did not generally reduce validity discrimination across everyone and every item.
    ru: >-
      Повторный анализ 22 исследований разделил два компонента, которые смешивает обычная точность: способность отличать валидные аргументы и склонность чаще принимать правдоподобные выводы. Правдоподобие меняло склонность отвечать определённым образом, но не снижало различение валидности одинаково у всех людей и для всех заданий.

  - claim_id: pmm:claim:belief-and-logic-may-be-evaluated-in-parallel
    en: >-
      One proposed explanation is that the mind can begin evaluating both plausibility and logical structure at the same time. When they suggest different answers, processing may become slower, less confident, or more arousing. Recent experiments show that researchers cannot assume every formally invalid argument creates this subjective conflict, so the mechanism remains conditional and proposed.
    ru: >-
      Одна из гипотез состоит в том, что человек может одновременно начинать оценивать правдоподобие содержания и логическую структуру. Если они подсказывают разные ответы, решение может стать медленнее, менее уверенным или сопровождаться большим возбуждением. Новые эксперименты показывают, что формальная невалидность не всегда создаёт такой субъективный конфликт, поэтому механизм остаётся условной гипотезой.

  - claim_id: pmm:claim:language-comprehension-extracts-communicative-meaning
    en: >-
      Language comprehension is the broad ability to understand meaningful communication in speech, writing, or sign. Deciding whether one letter string is a word tests only a small part of this ability and should not be presented as a complete model of language.
    ru: >-
      Понимание языка — это широкая способность понимать осмысленное сообщение в речи, письме или жестовом языке. Решение о том, является ли одна последовательность букв словом, проверяет лишь небольшую часть этой способности и не является полной моделью языка.

  - claim_id: pmm:claim:semantic-relatedness-changes-lexical-decision-latency
    en: >-
      People usually classified a target word faster when a meaning-related word appeared before it or beside it than when the context word was unrelated or neutral. Because the researchers controlled the word relation, this supports a causal effect on response time in those tasks, but it does not reveal which internal process produced the advantage.
    ru: >-
      Люди обычно быстрее определяли, что последовательность букв является словом, если связанное по смыслу слово показывали перед ней или рядом с ней, а не использовали несвязанное или нейтральное слово. Поскольку исследователи сами задавали связь между словами, это подтверждает её влияние на время ответа в данных заданиях, но не показывает, какой внутренний процесс создал ускорение.

  - claim_id: pmm:claim:diffusion-model-decomposes-lexical-decisions
    en: >-
      The diffusion model describes a decision as noisy evidence accumulating until a word or nonword boundary is reached, while also estimating response caution and time spent outside the decision itself. These parameters can explain accuracy and response-time distributions together, but they are model estimates rather than directly observed mental components.
    ru: >-
      Диффузионная модель описывает решение как постепенное накопление неточной информации до границы ответа «слово» или «не слово» и отдельно оценивает осторожность ответа и время процессов вне самого решения. Эти параметры помогают совместно объяснить точность и распределение времени ответа, но являются оценками модели, а не непосредственно наблюдаемыми частями психики.

  - claim_id: pmm:claim:automatic-preactivation-may-contribute-to-priming
    en: >-
      One hypothesis is that seeing a word rapidly makes related word information easier to process before a deliberate strategy is possible. Short or weakly visible primes are compatible with this explanation, but a faster response alone cannot show that automatic spreading activation occurred.
    ru: >-
      Одна из гипотез состоит в том, что увиденное слово быстро облегчает обработку связанных с ним слов ещё до осознанной стратегии. Результаты с коротко показанными или плохо различимыми праймами согласуются с этим объяснением, но одно лишь ускорение ответа не доказывает автоматическое распространение активации.

  - claim_id: pmm:claim:strategic-matching-may-contribute-to-priming
    en: >-
      When the prime is visible long enough, a person may predict likely next words or notice after recognizing the target that the two words are related and use that relation to answer “word.” This can also speed responses, so it competes with a purely automatic explanation.
    ru: >-
      Если предыдущее слово видно достаточно долго, человек может ожидать вероятные следующие слова или уже после распознавания заметить смысловую связь между словами и использовать её для ответа «слово». Это тоже способно ускорить ответ, поэтому такое объяснение конкурирует с чисто автоматическим механизмом.

  - claim_id: pmm:claim:big-five-is-dimensional-taxonomy
    en: >-
      The Big Five describes people along five broad continua rather than placing each person into one of five types. The dimensions summarize patterns in trait descriptions; they do not by themselves explain why a person behaves as they do or identify five mechanisms in the brain.
    ru: >-
      Большая пятёрка описывает человека по пяти широким непрерывным измерениям, а не относит его к одному из пяти типов. Эти измерения обобщают совместные различия черт, но сами по себе не объясняют причины поведения и не являются пятью механизмами мозга.

  - claim_id: pmm:claim:bfi2-supports-five-domain-fifteen-facet-profile
    en: >-
      The BFI-2 uses 60 questionnaire items to estimate five broad domains and 15 narrower facets. Its validation studies supported this hierarchy, but the resulting scores and factor loadings are measurement estimates that depend on the questionnaire, language, sample, and model.
    ru: >-
      BFI-2 использует 60 пунктов опросника для оценки пяти широких измерений и 15 более узких граней. Исследования поддержали такую иерархию, но полученные баллы и факторные нагрузки являются оценками измерительной модели и зависят от опросника, языка, выборки и модели.

  - claim_id: pmm:claim:conscientiousness-associated-with-academic-performance
    en: >-
      Students with higher measured Conscientiousness tended to have better academic performance across the studies in the meta-analysis. This does not show that raising a questionnaire score will improve grades or that one score can determine an individual student's outcome.
    ru: >-
      В исследованиях метаанализа учащиеся с более высоким измеренным уровнем добросовестности в среднем показывали более высокую успеваемость. Это не доказывает, что повышение балла опросника улучшит оценки или что по одному баллу можно определить результат конкретного ученика.

  - claim_id: pmm:claim:attachment-system-organizes-safety-seeking
    en: >-
      Attachment theory describes what can happen when safety through a particular close person becomes important: threat may increase monitoring, contact, or support seeking, and an available person can become a safe haven or secure base. This is a relationship process, not a permanent personality label.
    ru: >-
      Теория привязанности описывает, что может происходить, когда безопасность связывается с конкретным близким человеком: угроза может усиливать поиск контакта или поддержки, а доступный близкий может служить источником успокоения и опорой для исследования мира. Это процесс в отношениях, а не постоянный тип личности.
  - claim_id: pmm:claim:adult-attachment-measures-are-not-interchangeable
    en: >-
      A questionnaire about anxiety and avoidance in romantic relationships, an interview about the coherence of attachment memories, and observation of a child during reunion do not measure the same thing. Their results should not be merged into one universal attachment type.
    ru: >-
      Опросник тревоги и избегания в романтических отношениях, интервью о связности рассказа человека и наблюдение за ребёнком при воссоединении измеряют не одно и то же. Их результаты нельзя объединять в один универсальный «тип привязанности».
  - claim_id: pmm:claim:caregiver-sensitivity-associated-with-child-security
    en: >-
      In the reviewed studies, caregivers of children classified as securely attached tended to respond more sensitively. The relation was meaningful but observational: sensitivity is an important candidate influence, not the sole cause of a child's attachment pattern.
    ru: >-
      В рассмотренных исследованиях опекуны детей с безопасной привязанностью в среднем реагировали более чутко. Связь была заметной, но наблюдательной: чувствительность является важным возможным фактором, а не единственной причиной паттерна привязанности ребёнка.
  - claim_id: pmm:claim:attachment-security-shows-moderate-not-deterministic-stability
    en: >-
      Attachment assessments were related across time on average, but the relation weakened over long intervals and varied by method and context. Early attachment can matter without fixing adult relationships permanently.
    ru: >-
      Результаты оценки привязанности в среднем были связаны во времени, но связь ослабевала при больших интервалах и зависела от методики и контекста. Ранний опыт может иметь значение, не определяя взрослые отношения навсегда.
  - claim_id: pmm:claim:attachment-regulation-loop-is-integrative-hypothesis
    en: >-
      A useful working hypothesis is that threat triggers a search for safety, the other person's response changes current distress, and repeated experiences can update expectations about relationships. The whole sequence has not been established as one universal causal mechanism and must be tested against simpler social-support and learning explanations.
    ru: >-
      Полезная рабочая гипотеза состоит в том, что угроза запускает поиск безопасности, ответ другого человека меняет текущий дистресс, а повторяющийся опыт может обновлять ожидания от отношений. Вся последовательность не установлена как единый универсальный причинный механизм и должна сравниваться с более простыми объяснениями через поддержку и научение.

  - claim_id: pmm:claim:cbt-model-links-interpretation-and-response
    en: >-
      Two people can react differently to the same event because they assign it different meanings. In CBT, interpretation is examined together with emotion, bodily response, behavior, and context. The interpretation may be automatic or partly outside awareness; the model does not say that every feeling follows a conscious sentence in the mind.
    ru: >-
      Два человека могут по-разному реагировать на одно событие, потому что придают ему разный смысл. В КПТ интерпретацию рассматривают вместе с эмоцией, телесной реакцией, поведением и контекстом. Интерпретация может быть автоматической или частично неосознанной; модель не утверждает, что каждому чувству предшествует осознанная фраза в голове.
  - claim_id: pmm:claim:cbt-cycle-is-person-specific-mechanism-hypothesis
    en: >-
      A person's difficulty may be maintained by a loop rather than one cause: an interpretation changes distress, distress and physiology influence action, the action produces short-term relief or another consequence, and that consequence shapes later expectations. Which link matters most must be measured for that person and context.
    ru: >-
      Трудность человека может поддерживаться петлёй, а не одной причиной: интерпретация меняет дистресс, дистресс и физиология влияют на действие, действие приносит краткое облегчение или другое последствие, а оно формирует последующие ожидания. Какое звено важнее, нужно измерять для конкретного человека и контекста.
  - claim_id: pmm:claim:cbt-reduces-depression-versus-controls
    en: >-
      Across hundreds of randomized depression trials, people assigned to CBT had lower symptoms on average than people in control conditions. The size of benefit depended on the comparison, protocol, and study quality, and the result does not mean CBT is best for every person or superior to every other psychotherapy.
    ru: >-
      В сотнях рандомизированных исследований депрессии симптомы у получавших КПТ в среднем были ниже, чем в контрольных условиях. Размер пользы зависел от сравнения, протокола и качества исследования; результат не означает, что КПТ лучше для каждого человека или превосходит любую другую психотерапию.
  - claim_id: pmm:claim:cognitive-change-statistically-mediates-some-prevention-effects
    en: >-
      Some prevention studies found that improvement in measured negative thinking occurred alongside and statistically accounted for part of later symptom improvement. Because timing, measures, and interventions differed, this is evidence for a candidate pathway, not proof that changing thoughts was the sole cause.
    ru: >-
      В части исследований профилактики улучшение измеряемого негативного мышления сопровождало последующее уменьшение симптомов и статистически объясняло часть эффекта. Из-за различий во времени измерений, методиках и вмешательствах это данные в пользу возможного пути, а не доказательство того, что изменение мыслей было единственной причиной.
  - claim_id: pmm:claim:cbt-efficacy-does-not-validate-unique-mechanism
    en: >-
      A treatment package can work even when researchers do not know which component produced the benefit. To establish a mechanism, studies must separately change or measure the proposed process and show that it explains the outcome better than alternatives.
    ru: >-
      Пакет лечения может работать, даже если неизвестно, какой компонент создал пользу. Чтобы установить механизм, исследование должно отдельно изменить или измерить предполагаемый процесс и показать, что он объясняет результат лучше альтернатив.

  - claim_id: pmm:claim:observational-learning-is-not-identical-to-imitation
    en: >-
      Learning from others is broader than copying their exact movement. Observation can direct attention, teach that an outcome is possible, change expectations, or make an already available response more likely. A matching action is therefore one possible result, not a direct readout of one learning mechanism.
    ru: >-
      Научение через других шире, чем точное копирование движения. Наблюдение может направить внимание, показать возможный результат, изменить ожидания или повысить вероятность уже доступной реакции. Поэтому похожее действие — лишь один возможный результат, а не прямой показатель единственного механизма научения.

  - claim_id: pmm:claim:aggressive-model-exposure-increases-matching-aggression
    en: >-
      In one small 1961 laboratory experiment, preschool children who watched an adult perform specific aggressive acts later copied more of those acts with the same toy than children in comparison groups. This supports a short-term effect of that demonstration in that setting; it does not show that media exposure creates a stable aggressive personality or predicts ordinary life.
    ru: >-
      В небольшом лабораторном эксперименте 1961 года дошкольники, наблюдавшие конкретные агрессивные действия взрослого, затем чаще повторяли их с той же игрушкой, чем дети в группах сравнения. Это подтверждает кратковременный эффект данной демонстрации в данных условиях, но не доказывает формирование устойчивой агрессивной личности и не предсказывает обычную жизнь.

  - claim_id: pmm:claim:observed-model-consequence-changes-spontaneous-imitation
    en: >-
      Children spontaneously copied fewer modeled aggressive acts after seeing the model punished than after seeing reward or no consequence. The observed consequence changed immediate performance, but this first test could not tell whether the children had learned different amounts.
    ru: >-
      Дети без дополнительного вознаграждения повторяли меньше показанных агрессивных действий после наказания модели, чем после награды или отсутствия последствий. Наблюдаемое последствие изменило немедленное выполнение, но по этой первой проверке нельзя определить, различалось ли само усвоение.

  - claim_id: pmm:claim:direct-incentive-removes-model-consequence-performance-gap
    en: >-
      When the same children were then rewarded for showing everything they remembered, reproduction increased and the earlier differences between groups disappeared. This suggests that low spontaneous performance did not mean the modeled actions were unavailable, although the rewarded test is still an imperfect measure of learning.
    ru: >-
      Когда тех же детей затем вознаграждали за показ всего запомненного, воспроизведение усилилось, а прежние различия между группами исчезли. Это означает, что низкое самопроизвольное выполнение не обязательно свидетельствовало об отсутствии усвоенного действия, хотя проверка с наградой всё равно не является идеальным измерением научения.

  - claim_id: pmm:claim:observation-performance-selection-is-integrative-hypothesis
    en: >-
      A useful working hypothesis is that observation can make action-relevant information available, while consequences, current incentives, skill, and context determine whether it is performed. The studies do not establish one universal sequence of attention, memory, motivation, and imitation, so those links must be measured separately.
    ru: >-
      Полезная рабочая гипотеза состоит в том, что наблюдение делает информацию о действии доступной, а последствия, текущие стимулы, навык и контекст определяют, будет ли действие выполнено. Исследования не устанавливают универсальную цепочку внимания, памяти, мотивации и подражания, поэтому эти звенья нужно измерять раздельно.

  - claim_id: pmm:claim:emotion-episode-is-multicomponent-process
    en: >-
      An emotion is not only a word such as “fear” or one intensity score. For practical analysis, separate what happened, what it meant to the person, what they felt, what changed in the body, what they were inclined to do, what they actually did, and what followed. This does not assume that every component appears or changes together.
    ru: >-
      Эмоция — это не только слово вроде «страх» и не один балл интенсивности. Для практического анализа отдельно опишите, что произошло, какой смысл это имело для человека, что он переживал, что изменилось в теле, к какому действию его побуждало, что он действительно сделал и что произошло затем. Не предполагается, что все компоненты обязательно появляются или меняются вместе.

  - claim_id: pmm:claim:emotion-measures-are-not-interchangeable
    en: >-
      A person can report less distress while heart rate, skin conductance, facial expression, or behavior changes differently. Therefore decide in advance what outcome matters and measure that channel directly; do not use a calm face as proof of a calm feeling or one bodily signal as the emotion itself.
    ru: >-
      Человек может сообщать о меньшем дистрессе, тогда как частота сердцебиения, кожная проводимость, выражение лица или поведение меняются иначе. Поэтому заранее определите важный результат и измеряйте именно его: спокойное лицо не доказывает спокойного переживания, а один телесный показатель не является самой эмоцией.

  - claim_id: pmm:claim:appraisal-patterns-associated-with-emotion-reports
    en: >-
      How people evaluate relevance, control, certainty, responsibility, effort, and pleasantness is systematically related to what emotions they report. The profiles overlap and much evidence is correlational, so an appraisal is a useful hypothesis to check, not a hidden cause that can be read from the emotion label.
    ru: >-
      То, как человек оценивает значимость, контроль, определённость, ответственность, необходимые усилия и приятность события, систематически связано с называемыми им эмоциями. Профили пересекаются, а многие данные корреляционные, поэтому оценка ситуации — полезная гипотеза для проверки, но не скрытая причина, которую можно вывести из названия эмоции.

  - claim_id: pmm:claim:appraisal-guided-coordination-is-mechanism-hypothesis
    en: >-
      One working model says that changing evaluation of an event can reorganize action readiness, bodily response, expression, feeling, and later action over time. The whole loop is not yet one established mechanism. In practice, change one candidate link and check whether the predicted channel changes before accepting the explanation.
    ru: >-
      Согласно одной рабочей модели, изменение оценки события может со временем перестраивать готовность к действию, телесную реакцию, выражение, переживание и последующее действие. Вся петля пока не является единым установленным механизмом. На практике изменяйте одно предполагаемое звено и проверяйте, изменился ли ожидаемый показатель, прежде чем принимать объяснение.
