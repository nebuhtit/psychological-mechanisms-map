metadata:
  title: Primary evidence pack for visual perception and contrast sensitivity
  description: Separates visual perception, spatial contrast sensitivity, grating manipulation, detection behavior, threshold measurement, and a divisive-normalization mechanism hypothesis.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.1.0
    created_at: '2026-08-26T18:30:00+03:00'
    modified_at: '2026-08-26T18:30:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
