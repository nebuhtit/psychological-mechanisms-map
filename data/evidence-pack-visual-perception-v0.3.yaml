claims:
  - id: pmm:claim:rdoc-perception-computes-over-sensory-data
    claim_type: definition
    statement: RDoC defines Perception as processes that compute over sensory data to construct and transform representations of the external environment, acquire information, make predictions, and guide action.
    epistemic_status: supported
    confidence:
      level: high
      rationale: This is the current official RDoC parent-construct definition; it is used for terminology alignment rather than as a complete theory of vision.
    scope:
      population: Research framework spanning normal-to-abnormal human functioning.
      species: [human]
      context_ids: [pmm:context:sine-wave-grating-detection-task]
      temporal_scope: Current NIMH RDoC framework as accessed on 2026-08-26.
    defined_object_id: pmm:construct:visual-perception
    source_ids: [pmm:source:nimh-rdoc-perception-2026, pmm:source:nimh-rdoc-visual-perception-2026]
    evidence_ids: []
    limitations:
      - The visual-perception matrix lists many paradigms and units of analysis; no single paradigm or signal is equivalent to the construct.
    provenance: *provenance

  - id: pmm:claim:contrast-sensitivity-is-reciprocal-threshold
    claim_type: definition
    statement: In contrast psychophysics, sensitivity is the reciprocal of the contrast threshold, and a contrast sensitivity function records that quantity across spatial frequencies.
    epistemic_status: supported
    confidence:
      level: high
      rationale: The measurement definition is explicit in a peer-reviewed methods review and is standard for grating contrast psychophysics.
    scope:
      population: Observers completing protocol-defined contrast detection or identification tasks.
      species: [human]
      context_ids: [pmm:context:sine-wave-grating-detection-task]
      temporal_scope: Threshold estimation across trials at prespecified spatial frequencies.
      boundary_conditions:
        - Contrast definition, threshold criterion, spatial frequency, stimulus, and viewing conditions must be stated.
    defined_object_id: pmm:measurement:contrast-sensitivity-function
    source_ids: [pmm:source:pelli-bex-2013-contrast-sensitivity]
    evidence_ids: []
    limitations:
      - Reciprocal threshold is an operational measurement and does not identify a unique sensory or neural mechanism.
    provenance: *provenance

  - id: pmm:claim:grating-properties-change-detection-threshold
    claim_type: causal_effect
    statement: In the Campbell and Robson experiments, controlled changes in grating spatial frequency and waveform produced systematic differences in contrast-detection thresholds.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: The source reports repeated controlled psychophysical comparisons across frequencies and waveforms, but it is a historical study with limited modern reporting and protocol-specific generalizability.
    scope:
      population: Human observers tested in the Campbell and Robson 1968 grating experiments.
      species: [human]
      context_ids: [pmm:context:sine-wave-grating-detection-task]
      temporal_scope: Stimulus presentation through the observer's detection response and threshold estimate.
      boundary_conditions:
        - Periodic gratings, the reported spatial-frequency range, waveform comparisons, adaptation, luminance, viewing geometry, and threshold procedure.
    exposure_id: pmm:intervention:grating-spatial-frequency-and-contrast-manipulation
    outcome_id: pmm:outcome:contrast-detection-threshold
    causal_estimand: Within-protocol change in contrast-detection threshold produced by changing grating spatial frequency or waveform while following the reported psychophysical procedure.
    identification_strategy: controlled_contingency
    temporal_ordering: The experimenter set grating properties before each detection response and threshold estimate.
    causal_assumptions:
      consistency: Each condition follows the reported grating generation, viewing, and threshold procedure.
      exchangeability: Repeated controlled stimulus comparisons reduce stable observer confounding, while order and historical implementation details remain source-specific.
      positivity: The tested observers contributed responses across the compared grating conditions.
      interference: One observer's responses are assumed not to alter another observer's visual thresholds.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:campbell-robson-1968-grating-thresholds]
    limitations:
      - The experiment identifies effects of stimulus properties on task thresholds, not a unique neural channel, normalization process, or complete account of visual perception.
    provenance: *provenance

  - id: pmm:claim:divisive-normalization-may-shape-visual-gain
    claim_type: mechanism_hypothesis
    statement: Divisive normalization may shape visual response gain and thereby contribute to contrast-dependent neural and behavioral sensitivity.
    epistemic_status: proposed
    confidence:
      level: moderate
      rationale: The model explains a broad set of visual-cortex response properties and is supported by physiological literature, but the cited evidence does not uniquely identify its biological implementation or directly establish the human psychophysical pathway.
    scope:
      population: Visual systems studied with contrast-varying stimuli, including cat visual cortex and human psychophysics.
      species: [human, other, mixed]
      context_ids: [pmm:context:sine-wave-grating-detection-task]
      temporal_scope: Stimulus-driven neural response through contrast-dependent behavioral detection.
      boundary_conditions:
        - A specified normalization pool and model must predict contrast-response or threshold data beyond simpler alternatives.
    mechanism_id: pmm:mechanism:divisive-visual-normalization
    exposure_id: pmm:intervention:grating-spatial-frequency-and-contrast-manipulation
    outcome_id: pmm:outcome:contrast-detection-threshold
    temporal_ordering: Visual stimulation precedes pooled gain regulation, neural response, and any later behavioral threshold estimate.
    falsifiable_boundary: The account is weakened if preregistered comparisons show that normalization models fail to predict held-out neural and psychophysical contrast responses better than plausible non-normalizing alternatives.
    evidence_ids: [pmm:evidence:heeger-1992-normalization-model, pmm:evidence:carandini-heeger-2012-normalization-review]
    limitations:
      - Model fit is not proof of a unique causal circuit, and nonhuman cortical physiology is indirect evidence for human contrast-detection behavior.
    provenance: *provenance

evidence:
  - id: pmm:evidence:campbell-robson-1968-grating-thresholds
    claim_ids: [pmm:claim:grating-properties-change-detection-threshold]
    source_id: pmm:source:campbell-robson-1968-gratings
    extraction_locator: Abstract points 1-5 and full report of contrast thresholds across spatial frequencies and sine, square, rectangular, and saw-tooth gratings.
    evidence_kind: controlled_experiment
    design: Human psychophysical experiments varying grating spatial frequency, waveform, and contrast while estimating detection and discrimination thresholds.
    population: Human observers in the reported laboratory experiments; a pooled participant count was not extracted from the article.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect:
      metric: contrast-detection threshold across grating conditions
      value_status: qualitative_only
      direction: mixed
      notes: Thresholds varied systematically with spatial frequency, and near threshold the fundamental Fourier component accounted for visibility across tested waveforms.
    domains:
      directness: direct
      risk_of_bias: some_concerns
      consistency: mostly_consistent
      precision: not_reported
      replication: conceptual_replication
    summary: Controlled changes to spatial frequency and waveform changed the contrast required for human observers to detect gratings.
    limitations:
      - Historical methods and reporting do not meet current preregistration and open-data standards, and the result is tied to the tested stimuli and viewing conditions.
    provenance: *provenance

  - id: pmm:evidence:heeger-1992-normalization-model
    claim_ids: [pmm:claim:divisive-normalization-may-shape-visual-gain]
    source_id: pmm:source:heeger-1992-cat-normalization
    extraction_locator: PubMed abstract describing the modified linear-energy model and its account of published cat striate-cortex response properties.
    evidence_kind: computational_model
    design: Computational normalization model evaluated against a reviewed body of physiological measurements from cat striate cortex.
    population: Neurons and physiological datasets from cat striate cortex reviewed and modeled in the article.
    species: [other]
    inference_support: mechanism
    support_direction: supports
    causal_support: indirect
    effect:
      metric: breadth of striate-cell response properties explained by the modified model
      value_status: qualitative_only
      direction: positive
      notes: Adding mutual inhibition or response normalization explained more physiological findings than the unnormalized linear-energy account.
    domains:
      directness: indirect
      risk_of_bias: not_assessed
      consistency: mostly_consistent
      precision: not_reported
      replication: conceptual_replication
    summary: A normalization model accounted for a broader set of cat visual-cortex response properties than an unnormalized linear-energy model.
    limitations:
      - This is model-based nonhuman neural evidence, not a randomized perturbation of normalization and not direct evidence about human detection thresholds.
    provenance: *provenance

  - id: pmm:evidence:carandini-heeger-2012-normalization-review
    claim_ids: [pmm:claim:divisive-normalization-may-shape-visual-gain]
    source_id: pmm:source:carandini-heeger-2012-normalization
    extraction_locator: Abstract and Box 1 defining the normalization equation, its normalization pool, fitted parameters, and applications across visual and other neural systems.
    evidence_kind: narrative_review
    design: Narrative synthesis of computational and physiological normalization findings across neural systems and species.
    population: Neural systems and experimental preparations across multiple species, with emphasis on visual-system evidence.
    species: [mixed]
    inference_support: mechanism
    support_direction: supports
    causal_support: indirect
    effect:
      metric: cross-system explanatory applicability of normalization models
      value_status: qualitative_only
      direction: positive
      notes: The review presents normalization as a promising canonical computation while noting multiple model variants and unresolved biological implementations.
    domains:
      directness: partially_indirect
      risk_of_bias: not_assessed
      consistency: mostly_consistent
      precision: not_reported
      replication: conceptual_replication
    summary: A cross-system review supports normalization as a widely useful candidate neural computation, not as one uniquely established circuit.
    limitations:
      - Narrative synthesis and broad cross-system fit do not establish one implementation or a direct causal path to the human contrast sensitivity function.
    provenance: *provenance

