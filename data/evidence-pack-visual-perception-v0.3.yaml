  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:construct:visual-perception
    type: Construct
    label: Visual perception
    definition: Processes that compute over visual sensory data to construct and transform representations of the external environment and use them to acquire information, predict, and guide action.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Visual perception is broader than detecting one grating or estimating one contrast threshold.
      - A visual stimulus, a detection response, a psychophysical score, and a neural model are not the visual-perception construct itself.
    external_mappings:
      - system: RDoC
        external_iri: https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/constructs/visual-perception
        external_label: Visual Perception
        mapping_relation: exact_match
        mapping_status: identifier_verified
        rationale: PMM uses the official RDoC visual-perception subconstruct and its parent Perception definition while keeping individual paradigms and measures separate.
        accessed_at: '2026-08-26'
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/concept/id/trm_4a3fd79d0b4b5/
        external_label: visual perception
        mapping_relation: close_match
        mapping_status: provisional
        rationale: The labels overlap, but the Cognitive Atlas record is marked Unreviewed and PMM does not import its asserted hierarchy as settled.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:construct:spatial-contrast-sensitivity
    type: Construct
    label: Spatial contrast sensitivity
    definition: Capacity to detect luminance variation in a visual pattern as a function of the pattern's spatial frequency under specified viewing conditions.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Spatial contrast sensitivity is one restricted aspect of visual functioning, not a complete model of visual perception.
      - The capacity is operationalized by threshold measurements; it is not identical to one observed threshold or fitted curve.
    provenance: *provenance

  - id: pmm:context:sine-wave-grating-detection-task
    type: Context
    label: Sine-wave grating detection task
    definition: Psychophysical task in which an observer reports the presence or location of a luminance grating while contrast and spatial frequency are controlled.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      modality: visual
      stimulus: periodic luminance grating
      manipulated_dimensions: contrast and spatial frequency
      response: detection or forced-choice localization
      viewing_conditions: protocol-specific luminance, distance, field size, duration, and adaptation
    scope: Human laboratory measurements of grating visibility under declared viewing and response conditions.
    boundary_notes:
      - This task operationalizes a narrow detection problem; it is not visual perception itself.
      - Detection threshold depends on the stimulus, display, adaptation, task rule, and response criterion.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/task/id/trm_502be67697201/
        external_label: contrast detection task
        mapping_relation: narrow_match
        mapping_status: provisional
        rationale: PMM specifies the grating implementation more narrowly; the external task record is marked Unreviewed.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:intervention:grating-spatial-frequency-and-contrast-manipulation
    type: Intervention
    label: Grating spatial-frequency and contrast manipulation
    definition: Experimental variation of the spacing and luminance contrast of a periodic visual pattern across trials or conditions.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:behavior:grating-detection-response
      - pmm:outcome:contrast-detection-threshold
    delivery: Present protocol-defined gratings at multiple spatial frequencies and adjust contrast to estimate reliable detection thresholds.
    intended_direction: test
    provenance: *provenance

  - id: pmm:behavior:grating-detection-response
    type: Behavior
    label: Grating detection response
    definition: Observable report indicating whether or where the protocol-defined grating was detected.
    ontological_level: type
    curation_status: accepted
    behavior_kind: action
    observability: direct
    actor_scope: person
    response_topography: Protocol-defined verbal, keypress, or forced-choice response on each presentation.
    function_note: The response contributes to threshold estimation but is not itself contrast sensitivity or visual perception.
    provenance: *provenance

  - id: pmm:outcome:contrast-detection-threshold
    type: Outcome
    label: Contrast detection threshold
    definition: Lowest protocol-defined target contrast that supports a prespecified level of reliable detection at a given spatial frequency.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    boundary_notes:
      - A threshold is conditional on the task, psychometric criterion, stimulus, observer, and viewing conditions.
    provenance: *provenance

  - id: pmm:measurement:contrast-sensitivity-function
    type: Measurement
    label: Contrast sensitivity function
    definition: Psychophysical measurement that expresses sensitivity, the reciprocal of contrast threshold, across spatial frequencies.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids:
      - pmm:construct:spatial-contrast-sensitivity
      - pmm:behavior:grating-detection-response
      - pmm:outcome:contrast-detection-threshold
    method: Estimate a detection threshold at each prespecified spatial frequency, convert each threshold to reciprocal sensitivity, and describe or fit sensitivity as a function of spatial frequency.
    unit_of_analysis: behavior
    result_type: continuous
    boundary_notes:
      - The contrast sensitivity function is a measurement profile, not visual perception as a whole.
      - Different stimuli, threshold procedures, response alternatives, and viewing conditions can yield different profiles.
    provenance: *provenance

  - id: pmm:mechanism:divisive-visual-normalization
    type: Mechanism
    label: Divisive visual normalization
    definition: Candidate neural computation in which a neuron's stimulus-driven response is divided by a factor that includes pooled activity from other neurons, regulating response gain and saturation.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: physiological
    role_bindings:
      - {role: visual stimulus manipulation, object_id: pmm:intervention:grating-spatial-frequency-and-contrast-manipulation}
      - {role: measured visibility profile, object_id: pmm:measurement:contrast-sensitivity-function}
      - {role: behavioral threshold, object_id: pmm:outcome:contrast-detection-threshold}
    realization_conditions:
      - The relevant neural population receives stimulus drive and pooled suppressive input.
      - The normalization equation and its parameters predict held-out neural or behavioral responses better than declared alternatives.
    boundary_notes:
      - Divisive normalization is a computational description with multiple possible biological implementations.
      - Evidence that the model explains cat visual-cortex responses does not by itself establish that it causes human contrast thresholds.
    provenance: *provenance

