objects:
  - id: pmm:context:hpa-regulation
    type: Context
    label: HPA-axis regulatory context
    definition: Physiological context covering basal or stimulated hypothalamic-pituitary-adrenal activity and glucocorticoid feedback.
    ontological_level: type
    curation_status: accepted
    context_kind: physical
    dimensions: {system: hypothalamic-pituitary-adrenal axis, regime: basal or experimentally perturbed}
    scope: Mammalian physiology with timing, receptor, tissue, and stress regime declared by each claim.
    provenance: *provenance

  - id: pmm:state:circulating-cortisol-level
    type: State
    label: Circulating cortisol level
    definition: Time-indexed concentration of cortisol in a specified biological matrix.
    ontological_level: type
    curation_status: accepted
    state_kind: physiological
    bearer_scope: organism
    temporal_scale: episode
    provenance: *provenance

  - id: pmm:state:acth-secretory-drive
    type: State
    label: ACTH secretory drive
    definition: Time-indexed basal, continuous, or pulsatile secretion of adrenocorticotropic hormone.
    ontological_level: type
    curation_status: accepted
    state_kind: physiological
    bearer_scope: organism
    temporal_scale: episode
    boundary_notes: [Observed plasma ACTH concentration is an indicator, not the secretory process itself.]
    provenance: *provenance

  - id: pmm:mechanism:glucocorticoid-negative-feedback
    type: Mechanism
    label: Glucocorticoid negative feedback on HPA activity
    definition: Receptor-linked physiological processes through which glucocorticoid signaling limits or reshapes later HPA secretory activity.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: physiological
    role_bindings:
      - {role: feedback signal, object_id: pmm:state:circulating-cortisol-level}
      - {role: regulated activity, object_id: pmm:state:acth-secretory-drive}
    realization_conditions:
      - Relevant glucocorticoid or mineralocorticoid receptor signaling is available.
      - Tissue location and temporal regime are specified.
    boundary_notes: [Pituitary, hypothalamic, receptor-genomic, rapid, and intra-adrenal contributions must not be collapsed without evidence.]
    provenance: *provenance

  - id: pmm:intervention:metyrapone-cortisol-synthesis-blockade
    type: Intervention
    label: Metyrapone cortisol-synthesis blockade
    definition: Pharmacological inhibition of cortisol synthesis used to reduce endogenous feedback input.
    ontological_level: type
    curation_status: accepted
    intervention_kind: pharmacological
    target_ids: [pmm:state:circulating-cortisol-level, pmm:mechanism:glucocorticoid-negative-feedback]
    delivery: Source-specific oral metyrapone protocol followed by frequent endocrine sampling.
    intended_direction: decrease
    provenance: *provenance

  - id: pmm:intervention:cortisol-replacement-infusion
    type: Intervention
    label: Cortisol replacement infusion
    definition: Controlled exogenous cortisol administration after endogenous synthesis blockade.
    ontological_level: type
    curation_status: accepted
    intervention_kind: pharmacological
    target_ids: [pmm:state:circulating-cortisol-level]
    delivery: Protocol-defined intravenous cortisol input following metyrapone pretreatment.
    intended_direction: increase
    provenance: *provenance

  - id: pmm:intervention:dexamethasone-challenge
    type: Intervention
    label: Dexamethasone challenge
    definition: Synthetic glucocorticoid administration used as a probe of downstream endocrine suppression under a specified protocol.
    ontological_level: type
    curation_status: provisional
    intervention_kind: pharmacological
    target_ids: [pmm:mechanism:glucocorticoid-negative-feedback, pmm:state:acth-secretory-drive]
    delivery: Timed dexamethasone dose followed by protocol-defined ACTH or cortisol sampling.
    intended_direction: test
    boundary_notes: [A suppression-test result is an operational response, not a direct observation of the complete feedback mechanism.]
    provenance: *provenance

  - id: pmm:measurement:serial-cortisol-assay
    type: Measurement
    label: Serial cortisol assay
    definition: Repeated cortisol concentration measurements used to characterize hormone input or trajectory.
    ontological_level: type
    curation_status: accepted
    measurement_kind: physiology
    target_ids: [pmm:state:circulating-cortisol-level]
    method: Assay time-stamped plasma or serum samples under a declared protocol.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:serial-acth-assay
    type: Measurement
    label: Serial ACTH assay
    definition: Repeated plasma ACTH measurements used directly or in deconvolution analysis of secretory dynamics.
    ontological_level: type
    curation_status: accepted
    measurement_kind: physiology
    target_ids: [pmm:state:acth-secretory-drive]
    method: Assay frequent time-stamped plasma samples and apply declared concentration or secretion-model analysis.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

