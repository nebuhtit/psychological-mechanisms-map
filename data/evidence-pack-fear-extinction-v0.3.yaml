claims:
  - id: pmm:claim:context-shift-causes-renewal
    claim_type: causal_effect
    statement: Testing outside the extinction context can increase previously extinguished conditioned responding in human laboratory paradigms.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: Controlled context manipulations support a narrow causal effect, with convergence across startle, skin conductance, and ratings but limited generalization beyond laboratory samples.
    scope:
      population: Healthy adults in differential aversive-conditioning experiments.
      species: [human]
      context_ids:
        - pmm:context:extinction-training
        - pmm:context:return-of-fear-test
      temporal_scope: Immediate or delayed testing after successful within-session extinction.
      boundary_conditions:
        - Effect magnitude depends on context contrast, timing, and measurement channel.
        - Laboratory renewal is not identical to clinical relapse.
    exposure_id: pmm:context:return-of-fear-test
    outcome_id: pmm:behavior:return-of-conditioned-response
    causal_estimand: Difference in conditioned responding when testing occurs outside versus inside the extinction context.
    identification_strategy: randomized_intervention
    temporal_ordering: Acquisition and extinction precede randomized or counterbalanced test-context exposure.
    causal_assumptions:
      consistency: Test contexts instantiate the study-specific physical or virtual context manipulation.
      exchangeability: Supported by randomized group assignment or counterbalanced within-participant context order.
      positivity: Included participants could be observed in the relevant test-context conditions.
      interference: Participants completed conditioning independently.
      assessment: partly_tested
    evidence_ids:
      - pmm:evidence:alvarez-2007-aba-renewal
      - pmm:evidence:huff-2009-context-renewal
    limitations:
      - Context manipulations differ substantially between studies.
    provenance: *provenance

  - id: pmm:claim:time-allows-spontaneous-recovery
    claim_type: causal_effect
    statement: Under the tested timing arrangements, conditioned responding can recover after successful within-session extinction.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: Human experiments demonstrate recovery after a delay, while its magnitude and sensitivity to acquisition-to-extinction timing vary.
    scope:
      population: Healthy adults in laboratory threat-conditioning paradigms.
      species: [human]
      context_ids: [pmm:context:return-of-fear-test]
      temporal_scope: Approximately 24 hours after extinction.
      boundary_conditions:
        - Recovery depends on procedural timing and the selected response measure.
    exposure_id: pmm:context:return-of-fear-test
    outcome_id: pmm:behavior:return-of-conditioned-response
    causal_estimand: Change from late extinction to delayed test in differential conditioned responding.
    identification_strategy: randomized_intervention
    temporal_ordering: Extinction response reduction precedes the delayed recovery test.
    causal_assumptions:
      consistency: Delayed tests follow the study-specific protocol.
      exchangeability: Timing and extinction conditions are experimentally assigned in the included studies.
      positivity: Relevant timing conditions are represented in each experimental design.
      interference: Participants complete procedures independently.
      assessment: partly_tested
    evidence_ids:
      - pmm:evidence:huff-2009-spontaneous-recovery
      - pmm:evidence:coelho-2015-deepened-extinction
    limitations:
      - A time contrast cannot uniquely identify decay, temporal-context change, or memory competition.
    provenance: *provenance

  - id: pmm:claim:extinction-memory-mechanism-hypothesis
    claim_type: mechanism_hypothesis
    statement: Extinction commonly adds context-sensitive learning that competes with conditioned responding rather than completely erasing the original cue-outcome learning.
    epistemic_status: proposed
    confidence:
      level: moderate
      rationale: Renewal and spontaneous recovery are difficult to reconcile with complete erasure, but behavioral return-of-fear effects do not uniquely identify the internal representation or neural mechanism.
    scope:
      population: Humans in laboratory Pavlovian threat-conditioning paradigms.
      species: [human]
      context_ids:
        - pmm:context:extinction-training
        - pmm:context:return-of-fear-test
      temporal_scope: Extinction acquisition and later retrieval.
      boundary_conditions:
        - Some procedures may also modify original learning.
        - The hypothesis does not require a single unitary inhibitory trace.
    mechanism_id: pmm:mechanism:extinction-memory-formation
    exposure_id: pmm:event:aversive-outcome-omission-during-extinction
    outcome_id: pmm:state:conditioned-defensive-response
    temporal_ordering: Outcome omission occurs during extinction before later retrieval or return-of-fear testing.
    falsifiable_boundary: The broad account would be weakened by reliable, general, measurement-independent elimination of conditioned responding across context, time, and reinstatement tests after ordinary cue-only extinction.
    evidence_ids:
      - pmm:evidence:alvarez-2007-aba-renewal
      - pmm:evidence:huff-2009-context-renewal
      - pmm:evidence:huff-2009-spontaneous-recovery
      - pmm:evidence:coelho-2015-deepened-extinction
    limitations:
      - Evidence is indirect with respect to latent memory contents.
    provenance: *provenance

  - id: pmm:claim:reactivation-extinction-prevents-return
    claim_type: causal_effect
    statement: Reactivation followed by extinction within ten minutes does not currently show a robust advantage over ordinary extinction for preventing later fear recovery in humans.
    epistemic_status: unsupported
    confidence:
      level: moderate
      rationale: A high-powered registered direct replication found no benefit, and reanalysis found weak support for the original between-group claim.
    scope:
      population: Healthy adults meeting conditioning and extinction inclusion criteria.
      species: [human]
      context_ids:
        - pmm:context:extinction-training
        - pmm:context:return-of-fear-test
      temporal_scope: Reminder approximately ten minutes before extinction and recovery testing one day later.
      boundary_conditions:
        - This does not rule out every reconsolidation-based protocol or boundary condition.
    exposure_id: pmm:intervention:reactivation-extinction-procedure
    outcome_id: pmm:behavior:return-of-conditioned-response
    causal_estimand: Between-group difference in later conditioned-response recovery for reactivation-extinction versus standard extinction.
    identification_strategy: randomized_intervention
    temporal_ordering: Randomized reminder timing precedes extinction and delayed recovery testing.
    causal_assumptions:
      consistency: The replication closely followed the critical original protocol.
      exchangeability: Supported by randomized experimental assignment.
      positivity: Participants were assigned across reactivation and standard-extinction conditions.
      interference: Participants completed the experiment independently.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:chalkia-2020-registered-replication]
    limitations:
      - Null advantage in one protocol is not proof that memory updating is impossible.
    provenance: *provenance

evidence:
  - id: pmm:evidence:alvarez-2007-aba-renewal
    claim_ids:
      - pmm:claim:context-shift-causes-renewal
      - pmm:claim:extinction-memory-mechanism-hypothesis
    source_id: pmm:source:alvarez-johnson-grillon-2007
    extraction_locator: Abstract; Results; Discussion.
    evidence_kind: controlled_experiment
    design: Within-participant ABA renewal test in distinct virtual-reality contexts after short-delay extinction.
    population: Healthy human volunteers completing differential aversive conditioning and extinction.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect:
      metric: renewal contrast across acquisition and extinction test contexts
      value_status: qualitative_only
      direction: positive
      notes: Renewal was observed in fear-potentiated startle, skin conductance, and fear ratings.
    domains:
      directness: direct
      risk_of_bias: some_concerns
      consistency: single_source
      precision: not_reported
      replication: conceptual_replication
    summary: Conditioned responding returned when testing moved from the extinction context, despite short-delay extinction.
    limitations:
      - Exact standardized effects were not extracted in this pilot.
    provenance: *provenance

  - id: pmm:evidence:huff-2009-context-renewal
    claim_ids:
      - pmm:claim:context-shift-causes-renewal
      - pmm:claim:extinction-memory-mechanism-hypothesis
    source_id: pmm:source:huff-hernandez-blanding-labar-2009
    extraction_locator: Participants; Fear renewal test; Results, Figure 3.
    evidence_kind: randomized_experiment
    design: Fully crossed context-shift and acquisition-to-extinction-delay experiment with next-day testing in the acquisition context.
    population: Sixty-six recruited healthy young adults; complete-case counts varied by analysis.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect:
      metric: context specificity of differential skin-conductance fear return
      value_status: reported
      value: 4.94
      direction: positive
      notes: Fear return was more selective to CS+ in context-shift than same-context groups, F(1,61)=4.94, p=.03.
    domains:
      directness: direct
      risk_of_bias: some_concerns
      consistency: single_source
      precision: limited
      replication: conceptual_replication
    summary: Returning to the acquisition context produced selective renewal relative to remaining in the extinction context.
    limitations:
      - Differential attrition and responder availability reduced some phase-specific samples.
    provenance: *provenance

  - id: pmm:evidence:huff-2009-spontaneous-recovery
    claim_ids:
      - pmm:claim:time-allows-spontaneous-recovery
      - pmm:claim:extinction-memory-mechanism-hypothesis
    source_id: pmm:source:huff-hernandez-blanding-labar-2009
    extraction_locator: Results, fear renewal test; Discussion.
    evidence_kind: randomized_experiment
    design: Immediate versus 24-hour delayed extinction crossed with same versus shifted physical context.
    population: Sixty-six recruited healthy young adults; complete-case counts varied by analysis.
    species: [human]
    inference_support: causal_effect
    support_direction: mixed
    causal_support: direct
    effect:
      metric: main effect of acquisition-to-extinction interval on fear-relapse difference score
      value_status: reported
      value: 6.93
      direction: mixed
      notes: F(1,61)=6.93, p<.01; spontaneous recovery appeared after immediate but not delayed extinction, while delayed context-shift renewal was transient.
    domains:
      directness: direct
      risk_of_bias: some_concerns
      consistency: single_source
      precision: limited
      replication: unreplicated
    summary: Delayed testing revealed return of responding, but its form depended on acquisition-to-extinction timing and physical context.
    limitations:
      - Timing manipulation changes more than one possible memory process.
    provenance: *provenance

  - id: pmm:evidence:coelho-2015-deepened-extinction
    claim_ids:
      - pmm:claim:time-allows-spontaneous-recovery
      - pmm:claim:extinction-memory-mechanism-hypothesis
    source_id: pmm:source:coelho-dunsmoor-phelps-2015
    extraction_locator: Abstract; Participants; Results, spontaneous recovery.
    evidence_kind: randomized_experiment
    design: Standard cue-only extinction versus compound deepened extinction with 24-hour spontaneous-recovery test.
    population: Healthy adult volunteers; 51 participants contributed to the reported expectancy comparison after exclusions.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect:
      metric: between-group spontaneous-recovery contrast
      value_status: qualitative_only
      direction: negative
      notes: Deepened extinction reduced recovery of skin conductance and was associated with lower shock expectancy than standard extinction.
    domains:
      directness: direct
      risk_of_bias: some_concerns
      consistency: single_source
      precision: limited
      replication: unreplicated
    summary: Changing the extinction procedure altered next-day return of responding, consistent with extinction being modifiable learning rather than mere fatigue.
    limitations:
      - The study does not directly observe an inhibitory memory trace.
      - Exclusions based on acquisition and extinction performance can affect generalizability.
    provenance: *provenance

  - id: pmm:evidence:chalkia-2020-registered-replication
    claim_ids: [pmm:claim:reactivation-extinction-prevents-return]
    source_id: pmm:source:chalkia-2020-registered-replication
    extraction_locator: Abstract; Methods; Results; Discussion.
    evidence_kind: randomized_experiment
    design: High-powered preregistered direct replication of the critical reactivation-extinction conditions from Schiller et al. 2010 Experiment 1.
    population: Healthy adults in a three-day differential fear-conditioning experiment.
    species: [human]
    inference_support: causal_effect
    support_direction: challenges
    causal_support: direct
    effect:
      metric: reactivation-extinction versus standard-extinction difference in fear recovery
      value_status: qualitative_only
      direction: 'null'
      notes: The registered replication found no evidence that reactivation-extinction persistently attenuated fear recovery.
    domains:
      directness: direct
      risk_of_bias: low
      consistency: mixed
      precision: adequate
      replication: independent_replication
    summary: The preregistered direct replication did not reproduce the claimed advantage of the ten-minute reactivation-extinction procedure.
    limitations:
      - Results delimit this protocol and do not test every reconsolidation boundary condition.
    provenance: *provenance

