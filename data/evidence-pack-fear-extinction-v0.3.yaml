pmm_version: 0.3.0
document_type: pmm_dataset
dataset_id: pmm:dataset:fear-extinction-primary-evidence-v0-3
metadata:
  title: Primary evidence pack for fear extinction and return of fear
  description: >-
    Human experimental records separating extinction procedure, within-session
    response reduction, extinction-memory retrieval, and later return of fear.
    The pack treats inhibitory learning as an explanatory hypothesis rather
    than an observed synonym for response reduction.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.3.0
    created_at: '2026-08-26T00:00:00+03:00'
    modified_at: '2026-08-26T00:00:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmc: https://pmc.ncbi.nlm.nih.gov/articles/

objects:
  - id: pmm:context:differential-threat-conditioning
    type: Context
    label: Differential threat-conditioning context
    definition: >-
      Human laboratory context in which one cue predicts an aversive outcome
      more often than a comparison cue.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      paradigm: Pavlovian differential conditioning
      conditioned_cues: CS+ and CS-
      aversive_outcome: electric shock or loud noise
    scope: Healthy-adult laboratory paradigms represented in this pilot.
    external_mappings:
      - system: RDoC
        external_iri: https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/constructs/acute-threat-fear
        external_label: Acute Threat (Fear)
        mapping_relation: related_match
        mapping_status: label_verified
        rationale: The paradigms operationalize defensive responses within the RDoC Acute Threat domain but are not identical to the construct.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:context:extinction-training
    type: Context
    label: Extinction-training context
    definition: Repeated presentation of a previously reinforced cue without the aversive outcome.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      cue: previously reinforced CS+
      outcome: omitted
      repetitions: multiple
    scope: Laboratory extinction procedures; this record does not imply a particular learning mechanism.
    provenance: *provenance

  - id: pmm:context:return-of-fear-test
    type: Context
    label: Return-of-fear test context
    definition: Test after extinction in which context, time, or unsignaled aversive outcomes permit renewed conditioned responding to be assessed.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      tests: renewal, spontaneous recovery, or reinstatement
      comparison: late extinction or control condition
    scope: Human laboratory tests; return of a measured response is not equivalent to clinical relapse.
    provenance: *provenance

  - id: pmm:state:conditioned-defensive-response
    type: State
    label: Conditioned defensive-response state
    definition: Time-indexed defensive responding elicited by a cue with an aversive learning history.
    ontological_level: type
    curation_status: accepted
    state_kind: physiological
    bearer_scope: person
    temporal_scale: episode
    boundary_notes:
      - Skin conductance, startle, expectancy, and self-report are noninterchangeable indicators.
      - The state should not be identified with a single measurement channel.
    provenance: *provenance

  - id: pmm:event:aversive-outcome-omission-during-extinction
    type: Event
    label: Aversive-outcome omission during extinction
    definition: Non-occurrence of the previously expected aversive outcome after presentation of the conditioned cue.
    ontological_level: type
    curation_status: accepted
    event_kind: consequence_omission
    participant_ids: [pmm:state:conditioned-defensive-response]
    temporal_scale: seconds
    provenance: *provenance

  - id: pmm:behavior:within-session-response-decrement
    type: Behavior
    label: Within-session conditioned-response decrement
    definition: Observable reduction in a conditioned response across nonreinforced cue presentations within an extinction session.
    ontological_level: type
    curation_status: accepted
    behavior_kind: response_pattern
    observability: operationally_inferred
    actor_scope: person
    function_note: This performance pattern does not by itself identify erasure, inhibition, habituation, or durable extinction retention.
    provenance: *provenance

  - id: pmm:behavior:return-of-conditioned-response
    type: Behavior
    label: Return of conditioned responding
    definition: Increase in conditioned responding after prior within-session extinction, relative to the relevant late-extinction or control contrast.
    ontological_level: type
    curation_status: accepted
    behavior_kind: response_pattern
    observability: operationally_inferred
    actor_scope: person
    function_note: Renewal, spontaneous recovery, and reinstatement require distinct test arrangements.
    provenance: *provenance

  - id: pmm:intervention:cue-only-extinction-procedure
    type: Intervention
    label: Cue-only extinction procedure
    definition: Experimental delivery of repeated conditioned-cue presentations without the aversive outcome.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:state:conditioned-defensive-response
      - pmm:behavior:within-session-response-decrement
    delivery: Repeated unreinforced CS presentations after differential threat conditioning.
    intended_direction: decrease
    provenance: *provenance

  - id: pmm:intervention:reactivation-extinction-procedure
    type: Intervention
    label: Reactivation-extinction procedure
    definition: A reminder presentation followed by extinction training within a proposed reconsolidation window.
    ontological_level: type
    curation_status: provisional
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:state:conditioned-defensive-response
      - pmm:behavior:return-of-conditioned-response
    delivery: Single CS reminder followed approximately ten minutes later by extinction training.
    intended_direction: decrease
    boundary_notes:
      - A timing protocol is not evidence that reconsolidation was engaged.
    provenance: *provenance

  - id: pmm:mechanism:extinction-memory-formation
    type: Mechanism
    label: Extinction-memory formation and retrieval
    definition: >-
      Proposed learning process in which aversive-outcome omission supports a
      new memory that reduces conditioned responding when later retrieved.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: learning
    role_bindings:
      - role: omission experience
        object_id: pmm:event:aversive-outcome-omission-during-extinction
      - role: conditioned response
        object_id: pmm:state:conditioned-defensive-response
      - role: performance change
        object_id: pmm:behavior:within-session-response-decrement
    realization_conditions:
      - The conditioned cue is presented without the expected aversive outcome.
      - Later performance depends on retrieval conditions including physical and temporal context.
    boundary_notes:
      - This integrative mechanism is compatible with several formal learning models.
      - Return-of-fear effects argue against complete erasure but do not uniquely prove one inhibitory representation.
    provenance: *provenance

  - id: pmm:measurement:skin-conductance-differential
    type: Measurement
    label: Differential skin-conductance response
    definition: Electrodermal response contrast between conditioned and comparison cues.
    ontological_level: type
    curation_status: accepted
    measurement_kind: physiology
    target_ids:
      - pmm:state:conditioned-defensive-response
      - pmm:behavior:return-of-conditioned-response
    method: Compare event-related skin-conductance amplitudes for CS+ and CS- or across test phases.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:fear-potentiated-startle
    type: Measurement
    label: Fear-potentiated startle
    definition: Increase in the startle reflex during a threat-associated cue relative to an appropriate baseline or safety cue.
    ontological_level: type
    curation_status: accepted
    measurement_kind: physiology
    target_ids:
      - pmm:state:conditioned-defensive-response
      - pmm:behavior:return-of-conditioned-response
    method: Record blink electromyography after acoustic startle probes during conditioned cues and contexts.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

