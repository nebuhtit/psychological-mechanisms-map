pmm_version: 0.3.4
document_type: pmm_dataset
dataset_id: pmm:dataset:temperament-evidence-v0-3
metadata:
  title: Evidence pack for dimensional temperament and development
  description: Separates temperament dimensions, momentary reactivity, effortful control, observed behavior, informant response, scale score, longitudinal stability, later personality, and proposed developmental processes.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.1.0
    created_at: '2026-08-26T23:55:00+03:00'
    modified_at: '2026-08-26T23:55:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:construct:developmental-temperament-dimensions
    type: Construct
    label: Developmental temperament dimensions
    definition: Relatively enduring individual differences in emotional, motor, and attentional reactivity and in processes that regulate those reactions, studied as dimensions across development.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Modern temperament models use multiple continuous dimensions rather than assigning every person to one of four classical types.
      - Relatively enduring does not mean fixed, context-free, purely biological, or immune to development.
      - Temperament overlaps with but is not identical to adult personality, current emotion, symptoms, diagnosis, or moral character.
    provenance: *provenance

  - id: pmm:construct:temperamental-negative-affectivity
    type: Construct
    label: Temperamental negative affectivity
    definition: Broad dimensional tendency toward more frequent or intense fear, frustration, sadness, discomfort, or difficulty recovering, as operationalized by a declared temperament model and measure.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - A negative-affectivity score is not a current negative emotion, diagnosis, or proof of future psychopathology.
    provenance: *provenance

  - id: pmm:construct:temperamental-surgency
    type: Construct
    label: Temperamental surgency and approach
    definition: Broad dimensional tendency involving activity, positive anticipation, high-intensity pleasure, sociability, or approach toward novelty and reward, as defined by a declared model and measure.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Surgency is not identical to adult Extraversion, impulsivity, or observed activity in one situation.
    provenance: *provenance

  - id: pmm:construct:temperamental-effortful-control
    type: Construct
    label: Temperamental effortful control
    definition: Dimensional capacity to direct attention and inhibit a dominant response or activate a subdominant response when doing so serves a current goal.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Effortful control is not a direct observation, one executive-function score, obedience, willpower, or moral worth.
      - Age, task demands, motivation, fatigue, instruction, opportunity, and environment can alter observed performance.
    provenance: *provenance

  - id: pmm:state:context-specific-temperamental-reactivity
    type: State
    label: Context-specific reactive state
    definition: Time-indexed emotional, motor, orienting, or attentional response occurring when a person encounters a declared stimulus or situation.
    ontological_level: type
    curation_status: accepted
    state_kind: affective
    bearer_scope: person
    temporal_scale: episode
    boundary_notes:
      - One reactive episode is evidence about behavior in that context, not the temperament dimension itself.
    provenance: *provenance

  - id: pmm:behavior:observed-temperament-relevant-response
    type: Behavior
    label: Observed temperament-relevant response
    definition: Observable approach, withdrawal, vocalization, motor activity, gaze, delay, inhibition, or attentional shift coded in a declared temperament-eliciting situation.
    ontological_level: type
    curation_status: accepted
    behavior_kind: response_pattern
    observability: direct
    actor_scope: person
    response_topography: Protocol-defined emotional, motor, or attentional response coded during a structured or naturalistic observation.
    function_note: Similar behavior can reflect temperament, learning, skill, current state, relationship, task understanding, or situational demand.
    provenance: *provenance

  - id: pmm:context:cbq-caregiver-report-assessment
    type: Context
    label: CBQ caregiver-report assessment
    definition: Questionnaire context in which a caregiver rates a child's recent behavior in specified everyday situations using a version of the Children's Behavior Questionnaire.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      target_age: 3 to 8 years in the Putnam and Rothbart short-form study
      respondent: parent or caregiver
      forms: standard, short, or very short
      reference: frequency or typicality of described behavior
    scope: CBQ administration and scoring within populations, languages, ages, and forms for which measurement properties have been evaluated.
    boundary_notes:
      - A caregiver report integrates observations across settings but also depends on memory, interpretation, expectations, reference group, and response style.
    provenance: *provenance

  - id: pmm:behavior:caregiver-temperament-item-rating
    type: Behavior
    label: Caregiver temperament item rating
    definition: Observable selection of a questionnaire response describing how often or how typically a child showed a specified behavior in a specified class of situations.
    ontological_level: type
    curation_status: accepted
    behavior_kind: verbal_behavior
    observability: direct
    actor_scope: group
    response_topography: Selection of one protocol-defined response option for a CBQ item.
    function_note: The rating is the informant's response and is not the child's temperament dimension itself.
    provenance: *provenance

  - id: pmm:measurement:cbq-temperament-profile
    type: Measurement
    label: CBQ temperament dimension profile
    definition: Scored profile derived from caregiver item ratings, estimating fine-grained scales or broad factors such as Negative Affectivity, Surgency or Extraversion, and Effortful Control under a declared CBQ form.
    ontological_level: type
    curation_status: accepted
    measurement_kind: psychometric_scale
    target_ids: [pmm:construct:developmental-temperament-dimensions, pmm:construct:temperamental-negative-affectivity, pmm:construct:temperamental-surgency, pmm:construct:temperamental-effortful-control]
    method: Use the selected CBQ form, scoring key, language, age range, missing-data rules, and informant identity; report scale-level reliability and validity for the relevant population.
    unit_of_analysis: self_report
    result_type: continuous
    boundary_notes:
      - Scores depend on form, items, informant, age, language, population, and scoring model.
      - The very short form trades detail for burden and showed only marginal fit to a three-factor model in the cited development study.
    provenance: *provenance

  - id: pmm:measurement:structured-temperament-observation
    type: Measurement
    label: Structured temperament observation
    definition: Protocol-based coding or task score derived from directly observed responses in situations selected to elicit temperament-relevant variation.
    ontological_level: type
    curation_status: accepted
    measurement_kind: observation
    target_ids: [pmm:state:context-specific-temperamental-reactivity, pmm:behavior:observed-temperament-relevant-response]
    method: Record declared stimuli, setting, coder training, response windows, reliability, and aggregation across tasks and occasions.
    unit_of_analysis: behavior
    result_type: continuous
    boundary_notes:
      - Observation samples fewer situations than caregiver report and the two methods should not be assumed interchangeable.
    provenance: *provenance

  - id: pmm:context:longitudinal-temperament-personality-assessment
    type: Context
    label: Longitudinal temperament-personality assessment
    definition: Repeated assessment context in which comparable temperament or personality dimensions are measured across multiple ages to estimate continuity and change.
    ontological_level: type
    curation_status: accepted
    context_kind: developmental
    dimensions:
      waves: two or more
      measures: age-appropriate temperament or personality scales
      outcomes: rank-order stability, mean-level change, or cross-domain continuity
    scope: Longitudinal designs represented by the included meta-analyses and cohort study.
    provenance: *provenance

  - id: pmm:outcome:later-personality-trait-standing
    type: Outcome
    label: Later personality trait standing
    definition: A person's estimated relative position on a later age-appropriate personality dimension in a declared longitudinal analysis.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    boundary_notes:
      - Relative standing is sample- and measure-dependent and is not a fixed identity or causal endpoint.
    provenance: *provenance

  - id: pmm:measurement:longitudinal-trait-stability-estimate
    type: Measurement
    label: Longitudinal trait stability estimate
    definition: Statistical estimate of rank-order continuity or cross-age association between declared temperament or personality measurements.
    ontological_level: type
    curation_status: accepted
    measurement_kind: computational_parameter
    target_ids: [pmm:construct:developmental-temperament-dimensions, pmm:outcome:later-personality-trait-standing]
    method: Estimate age-, interval-, measure-, and sample-specific longitudinal associations while reporting attrition, measurement comparability, and uncertainty.
    unit_of_analysis: paradigm
    result_type: model_parameter
    boundary_notes:
      - Rank-order stability does not mean no individual changes or that the group mean is unchanged.
      - A longitudinal association does not by itself identify genetic, maturational, relational, or environmental causes.
    provenance: *provenance

  - id: pmm:mechanism:developmental-temperament-transaction
    type: Mechanism
    label: Developmental temperament transaction
    definition: Proposed process in which biologically influenced reactivity and regulation repeatedly interact with maturation, relationships, learning, roles, and environments, producing both continuity and change in later personality-relevant behavior.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: developmental
    role_bindings:
      - {role: initial individual differences, object_id: pmm:construct:developmental-temperament-dimensions}
      - {role: current response, object_id: pmm:state:context-specific-temperamental-reactivity}
      - {role: regulatory capacity, object_id: pmm:construct:temperamental-effortful-control}
      - {role: repeated developmental context, object_id: pmm:context:longitudinal-temperament-personality-assessment}
      - {role: later measured profile, object_id: pmm:outcome:later-personality-trait-standing}
    realization_conditions:
      - Temperament-relevant responses and environments are measured repeatedly rather than reconstructed from one adult report.
      - Measurement invariance and age-appropriate construct continuity are evaluated.
      - Genetic, maturational, learning, relationship, and broader environmental alternatives are compared rather than collapsed.
    boundary_notes:
      - Statistical genetic or environmental variance components do not identify a concrete developmental mechanism.
      - The model permits reciprocal and nonlinear change and does not imply that early temperament determines adult personality.
    provenance: *provenance

relations:
  - {id: pmm:relation:caregiver-rating-occurs-in-cbq-context, subject_id: pmm:behavior:caregiver-temperament-item-rating, predicate: occurs_in_context, object_id: pmm:context:cbq-caregiver-report-assessment, provenance: *provenance}
