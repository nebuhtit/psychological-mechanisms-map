claims:
  - id: pmm:claim:temperament-is-dimensional-and-developmental
    claim_type: definition
    statement: Contemporary temperament research describes multiple continuous dimensions of reactivity and self-regulation that show relative continuity while developing through biological and contextual influences; it is not a validated four-type classification of people.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'Major integrative reviews converge on dimensional reactivity and regulation, while theories differ in included dimensions, biological emphasis, age coverage, and boundaries with personality.'}
    scope:
      population: Humans studied from infancy through adulthood with age-appropriate temperament measures.
      species: [human]
      context_ids: [pmm:context:cbq-caregiver-report-assessment, pmm:context:longitudinal-temperament-personality-assessment]
      temporal_scope: Repeated tendencies and regulation across situations and development rather than one isolated episode.
    defined_object_id: pmm:construct:developmental-temperament-dimensions
    source_ids: [pmm:source:shiner-2012-what-is-temperament, pmm:source:gartstein-ramirez-2025-infant-temperament]
    evidence_ids: []
    limitations:
      - The definition does not establish one universally correct taxonomy, instrument, biological basis, or causal pathway.
    provenance: *provenance

  - id: pmm:claim:cbq-short-forms-estimate-dimensional-profile
    claim_type: association
    statement: Putnam and Rothbart's CBQ short and very short forms showed useful internal consistency, criterion validity, longitudinal stability, and cross-informant agreement in the reported samples, with weaker properties for some scales and populations and only marginal three-factor fit for the very short form.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'The forms were developed with 468 parent reports and evaluated with 1,189 participants, but performance varied by scale and population and the very short model fit was marginal.'}
    scope:
      population: Children aged 3 to 8 years represented in the CBQ short-form development and evaluation samples, predominantly mid- or high-income and White with additional African American and low-income samples.
      species: [human]
      context_ids: [pmm:context:cbq-caregiver-report-assessment]
      temporal_scope: Caregiver questionnaire administration and psychometric evaluation in the reported samples.
      boundary_conditions:
        - The reported English-language CBQ forms, age range, caregiver respondents, samples, scoring, and psychometric analyses.
    exposure_id: pmm:behavior:caregiver-temperament-item-rating
    outcome_id: pmm:measurement:cbq-temperament-profile
    estimate: {metric: 'reliability, criterion validity, stability, agreement, and factor-model performance', value_status: qualitative_only, direction: mixed, notes: 'Most properties were satisfactory in mid- or high-income and White samples; some internal consistencies were lower in African American and low-income samples, and very short three-factor fit was marginal.'}
    confounding_note: Informant expectations, shared method, item selection, language, culture, socioeconomic conditions, age, missingness, and sample composition can influence the observed measurement properties.
    evidence_ids: [pmm:evidence:putnam-rothbart-2006-cbq-forms]
    limitations:
      - Questionnaire reliability and validity do not make the score a direct observation of temperament or prove the proposed three broad factors are universal.
    provenance: *provenance

  - id: pmm:claim:trait-rank-order-stability-increases-with-age
    claim_type: association
    statement: In Roberts and DelVecchio's meta-analysis, rank-order consistency of measured personality and temperament traits was moderate rather than perfect, increased from childhood into adulthood, and decreased across longer retest intervals.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'The quantitative review compiled 3,217 coefficients from 152 longitudinal studies, but heterogeneous traits, instruments, cohorts, and historical studies limit a single estimate for modern temperament dimensions.'}
    scope:
      population: Participants from childhood through older adulthood represented in 152 longitudinal personality and temperament studies.
      species: [human]
      context_ids: [pmm:context:longitudinal-temperament-personality-assessment]
      temporal_scope: Longitudinal retest intervals analyzed across the lifespan, standardized in reported age comparisons to 6.7 years.
      boundary_conditions:
        - The personality and temperament constructs, measures, ages, intervals, and cohorts included in the meta-analysis.
    exposure_id: pmm:measurement:cbq-temperament-profile
    outcome_id: pmm:outcome:later-personality-trait-standing
    estimate: {metric: meta-analytic rank-order test-retest correlation at a 6.7-year interval, value_status: reported, direction: positive, notes: 'Mean estimates increased from .31 in childhood to .54 in college years, .64 around age 30, and about .74 between ages 50 and 70; temperament dimensions were less consistent than adult personality traits.'}
    confounding_note: Measurement reliability and comparability, age, retest interval, attrition, cohort, construct breadth, informant, and sample restriction affect rank-order estimates.
    evidence_ids: [pmm:evidence:roberts-delvecchio-2000-rank-order-meta]
    limitations:
      - Group-level rank-order consistency does not imply that an individual cannot change, that mean levels are stable, or that childhood measures determine adulthood.
    provenance: *provenance

  - id: pmm:claim:adolescent-temperament-associated-with-adult-personality
    claim_type: association
    statement: In one longitudinal cohort of 674 Mexican-origin youth, measured temperament from ages 10 to 16 showed continuity with conceptually related Big Five personality dimensions through age 26 while also showing mean-level developmental change.
    epistemic_status: supported
    confidence: {level: low, rationale: 'Repeated overlapping assessments provide unusually direct cross-age evidence, but one cultural cohort, measurement models, attrition, and observational design limit generalization and causal interpretation.'}
    scope:
      population: 674 Mexican-origin youth in the reported longitudinal cohort.
      species: [human]
      context_ids: [pmm:context:longitudinal-temperament-personality-assessment]
      temporal_scope: Temperament assessments at ages 10 to 16 and Big Five personality assessments at ages 14 to 26.
      boundary_conditions:
        - The cohort, measures, overlapping ages, latent growth models, retention, and historical context represented in Ringwald et al.
    exposure_id: pmm:measurement:cbq-temperament-profile
    outcome_id: pmm:outcome:later-personality-trait-standing
    estimate: {metric: longitudinal continuity between conceptually related temperament and Big Five dimensions, value_status: qualitative_only, direction: positive, notes: 'The strongest relations occurred between conceptually similar traits; joint traits showed rank-order stability alongside mean-level changes.'}
    confounding_note: Shared reporter or method, socioeconomic and cultural context, stable environments, measurement overlap, genetic influences, and unmeasured developmental experiences can contribute to continuity.
    evidence_ids: [pmm:evidence:ringwald-2026-temperament-personality-continuity]
    limitations:
      - The cohort does not establish universal pathways, immutable traits, or that effortful control causes broad personality maturation.
    provenance: *provenance

  - id: pmm:claim:temperament-developmental-transaction-is-hypothesis
    claim_type: mechanism_hypothesis
    statement: Continuity and change in temperament and personality may emerge through repeated transactions among biologically influenced reactivity, developing regulation, relationships, learning, and increasingly stable environments.
    epistemic_status: proposed
    confidence: {level: low, rationale: 'Behavior-genetic meta-analysis partitions sources of longitudinal covariance and reviews support transactional models, but variance decomposition does not identify concrete causal processes or their direction.'}
    scope:
      population: Humans represented in longitudinal temperament, personality, and behavioral-genetic studies.
      species: [human]
      context_ids: [pmm:context:longitudinal-temperament-personality-assessment]
      temporal_scope: Repeated development from infancy through adulthood.
      boundary_conditions:
        - Longitudinal designs with age-appropriate repeated measures and explicit genetic, environmental, maturational, relational, or learning variables.
    mechanism_id: pmm:mechanism:developmental-temperament-transaction
    exposure_id: pmm:construct:developmental-temperament-dimensions
    outcome_id: pmm:outcome:later-personality-trait-standing
    temporal_ordering: Earlier measured dispositions and environments precede later measurements, but reciprocal influence and stable confounding remain possible.
    falsifiable_boundary: The proposed account is weakened when repeated, independently measured person-environment processes add no explanatory or predictive value beyond measurement stability and when experimentally changed candidate processes do not alter prespecified later behavior.
    evidence_ids: [pmm:evidence:briley-tucker-drob-2014-genetic-environmental-continuity]
    limitations:
      - Heritability, genetic stability, or environmental variance are population statistics and must not be treated as fixed causes within an individual.
    provenance: *provenance

evidence:
  - id: pmm:evidence:putnam-rothbart-2006-cbq-forms
    claim_ids: [pmm:claim:cbq-short-forms-estimate-dimensional-profile]
    source_id: pmm:source:putnam-rothbart-2006-cbq-short
    extraction_locator: PubMed abstract reporting form development, sample sizes, age range, internal consistency, criterion validity, stability, cross-informant agreement, population differences, and factor fit.
    evidence_kind: longitudinal_observational
    design: Multi-sample questionnaire development and evaluation using item analysis, internal consistency, criterion validity, longitudinal stability, cross-informant agreement, and confirmatory factor analysis.
    population: 468 parents in form development and 1,189 participants in subsequent evaluation of children aged 3 to 8 years.
    species: [human]
    inference_support: association
    support_direction: mixed
    causal_support: none
    effect: {metric: psychometric performance of CBQ short and very short forms, value_status: qualitative_only, direction: mixed, notes: 'Broadly satisfactory properties with lower internal consistency for some scales and populations and marginal three-factor fit for the very short form.'}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: mixed, precision: adequate, replication: conceptual_replication}
    summary: The CBQ short forms reduced burden while retaining useful measurement properties in the reported samples, with explicit scale, model-fit, and population limitations.
    limitations:
      - The instrument-development data do not establish cross-cultural invariance, equivalence to direct observation, or one universal temperament taxonomy.
    provenance: *provenance

  - id: pmm:evidence:roberts-delvecchio-2000-rank-order-meta
    claim_ids: [pmm:claim:trait-rank-order-stability-increases-with-age]
    source_id: pmm:source:roberts-delvecchio-2000-stability
    extraction_locator: PubMed abstract reporting 152 studies, 3,217 coefficients, age-standardized rank-order correlations, interval moderation, and lower consistency for temperament than adult personality traits.
    evidence_kind: meta_analysis
    design: Quantitative review of longitudinal test-retest rank-order consistency across childhood, adulthood, and old age.
    population: Participants in 152 longitudinal personality and temperament studies across the lifespan.
    species: [human]
    inference_support: association
    support_direction: supports
    causal_support: none
    effect: {metric: rank-order test-retest correlation standardized to 6.7 years, value_status: reported, direction: positive, notes: 'Estimated consistency rose from .31 in childhood toward .74 at ages 50 to 70 and declined with longer intervals.'}
    domains: {directness: partially_indirect, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: adequate, replication: independent_replication}
    summary: Trait rank ordering showed increasing but imperfect longitudinal consistency, contradicting both complete instability and immutable childhood typing.
    limitations:
      - Historical measures and heterogeneous constructs make the pooled estimates an indirect benchmark for any one contemporary temperament instrument.
    provenance: *provenance

  - id: pmm:evidence:ringwald-2026-temperament-personality-continuity
    claim_ids: [pmm:claim:adolescent-temperament-associated-with-adult-personality]
    source_id: pmm:source:ringwald-2026-temperament-personality
    extraction_locator: PubMed abstract reporting cohort size, ages, repeated overlapping temperament and Big Five measures, latent growth modeling, continuity, stability, and mean-level change.
    evidence_kind: longitudinal_observational
    design: Longitudinal cohort study with Rothbart-model temperament assessments from ages 10 to 16 and Big Five assessments from ages 14 to 26, including overlapping measures and joint latent growth models.
    population: 674 Mexican-origin youth followed from late childhood or adolescence into adulthood.
    species: [human]
    inference_support: association
    support_direction: supports
    causal_support: none
    effect: {metric: longitudinal continuity of conceptually related temperament and personality traits, value_status: qualitative_only, direction: positive, notes: 'Conceptually similar dimensions showed the strongest continuity while joint dimensions also changed in mean level.'}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: single_source, precision: adequate, replication: unreplicated}
    summary: Repeated overlapping measurement supported continuity between adolescent temperament and adult personality without eliminating developmental change.
    limitations:
      - One cohort and observational latent models cannot establish universal construct identity or causal maturation pathways.
    provenance: *provenance

  - id: pmm:evidence:briley-tucker-drob-2014-genetic-environmental-continuity
    claim_ids: [pmm:claim:temperament-developmental-transaction-is-hypothesis]
    source_id: pmm:source:briley-tucker-drob-2014-continuity
    extraction_locator: PubMed abstract reporting 24 longitudinal behavioral-genetic studies, 21,057 sibling pairs, and age trends in genetic and environmental contributions to personality stability.
    evidence_kind: meta_analysis
    design: Meta-analysis of longitudinal sibling and twin designs decomposing phenotypic personality stability into genetic and environmental covariance components across age.
    population: 21,057 sibling pairs from six relationship types spanning infancy to old age in 24 longitudinal studies.
    species: [human]
    inference_support: mechanism
    support_direction: mixed
    causal_support: indirect
    domains: {directness: indirect, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: adequate, replication: independent_replication}
    summary: Both genetic and environmental influences became more stable with age, while increasing environmental continuity contributed substantially to increasing phenotypic stability.
    limitations:
      - Variance decomposition depends on behavioral-genetic assumptions and labels broad sources rather than measuring specific relationships, learning histories, roles, or environments.
    provenance: *provenance

