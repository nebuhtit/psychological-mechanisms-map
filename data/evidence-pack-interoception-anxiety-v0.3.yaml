    provenance: *provenance

claims:
  - id: pmm:claim:interoceptive-dimensions-are-dissociable
    claim_type: association
    statement: In the studied normative sample, heartbeat-task accuracy, self-evaluated interoceptive sensibility, and confidence-accuracy correspondence were empirically distinct and only partly corresponded.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'The study measured all three operational dimensions, but evidence is cross-sectional and task-specific.'}
    scope:
      population: Normative adult sample of 80 participants.
      species: [human]
      context_ids: [pmm:context:cardiac-interoception-assessment]
      temporal_scope: Cross-sectional laboratory assessment.
      boundary_conditions: [The result does not establish that each score is a unitary natural kind.]
    exposure_id: pmm:measurement:heartbeat-task-performance
    outcome_id: pmm:measurement:interoception-self-report
    estimate: {metric: cross-dimensional correspondence, value_status: qualitative_only, direction: mixed, notes: Dimensions were dissociable and correspondence was partial.}
    confounding_note: Task reliability, physiological detectability, confidence scale use, and questionnaire interpretation may influence correspondence.
    evidence_ids: [pmm:evidence:garfinkel-2015-dimensions]
    provenance: *provenance

  - id: pmm:claim:cardiac-accuracy-not-generally-associated-with-anxiety
    claim_type: association
    statement: A preregistered meta-analysis found no overall association between state or trait anxiety and objectively measured cardiac interoceptive accuracy.
    epistemic_status: supported
    confidence: {level: high, rationale: 'The synthesis included 55 studies and examined prespecified moderators, while remaining limited to cardiac tasks and included-study quality.'}
    scope:
      population: Participants represented across 55 cardiac-interoception studies.
      species: [human]
      context_ids: [pmm:context:cardiac-interoception-assessment]
      temporal_scope: Aggregate cross-sectional association across included studies.
      boundary_conditions: [Does not address every interoceptive modality or subjective belief about bodily signals.]
    exposure_id: pmm:measurement:heartbeat-task-performance
    outcome_id: pmm:outcome:anxiety-intensity
    estimate: {metric: meta-analytic association, value_status: qualitative_only, direction: 'null', notes: The indexed abstract reports no evidence of an overall association or examined moderation.}
    confounding_note: Included tasks, anxiety measures, sampling, and measurement validity varied across studies.
    evidence_ids: [pmm:evidence:adams-2022-meta-analysis]
    provenance: *provenance

  - id: pmm:claim:isoproterenol-increases-anxiety-in-lesion-case-study
    claim_type: causal_effect
    statement: Under the reported challenge protocol, isoproterenol rather than saline increased anxiety in two participants with bilateral amygdala lesions, with panic in one participant.
    epistemic_status: supported
    confidence: {level: low, rationale: 'Pharmacological perturbation supports temporal causal interpretation within cases, but the lesion sample contains only two people.'}
    scope:
      population: Two monozygotic twins with focal bilateral amygdala lesions under the reported protocol.
      species: [human]
      context_ids: [pmm:context:isoproterenol-challenge]
      temporal_scope: Acute response following bolus infusion.
      boundary_conditions: [No population-level generalization is warranted from two lesion cases.]
    exposure_id: pmm:intervention:isoproterenol-infusion
    outcome_id: pmm:outcome:anxiety-intensity
    causal_estimand: Within-case acute anxiety response under isoproterenol versus saline in the reported protocol.
    identification_strategy: controlled_contingency
    temporal_ordering: Infusion preceded physiological, sensory, and anxiety ratings.
    causal_assumptions:
      consistency: Infusion and saline conditions followed the reported protocol.
      exchangeability: Within-case comparator reduces but does not eliminate order and expectancy effects.
      positivity: Both active and saline conditions were administered.
      interference: No interference between participants is expected; carryover remains possible.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:khalsa-2016-challenge]
    limitations: [Single-blind case design and exceptional lesion anatomy sharply limit generalization.]
    provenance: *provenance

  - id: pmm:claim:appraisal-may-link-bodily-signals-to-anxiety
    claim_type: mechanism_hypothesis
    statement: Appraisal of perceived cardiorespiratory change may contribute to anxiety, without requiring that objective heartbeat-task accuracy be globally elevated in anxious people.
    epistemic_status: proposed
    confidence: {level: low, rationale: 'The synthesis is compatible with dissociable measurement dimensions and experimental symptom induction, but appraisal was not uniquely manipulated or measured.'}
    scope:
      population: Integrative interpretation across normative measurement research, meta-analysis, and a rare lesion challenge.
      species: [human]
      context_ids: [pmm:context:cardiac-interoception-assessment, pmm:context:isoproterenol-challenge]
      temporal_scope: Acute bodily-signal evaluation and cross-sectional individual differences.
      boundary_conditions: [Does not specify a unique neural or computational implementation.]
    mechanism_id: pmm:mechanism:cardiorespiratory-appraisal
    exposure_id: pmm:state:cardiorespiratory-activation
    outcome_id: pmm:outcome:anxiety-intensity
    temporal_ordering: Physiological change and perceived sensation precede or accompany anxiety appraisal.
    falsifiable_boundary: Direct manipulation of appraisal with matched bodily perturbation should alter anxiety if appraisal is causally involved.
    evidence_ids: [pmm:evidence:khalsa-2016-appraisal-interpretation]
    limitations: [This is an integrative proposal, not a source-level demonstrated mediation claim.]
    provenance: *provenance

evidence:
  - id: pmm:evidence:garfinkel-2015-dimensions
    claim_ids: [pmm:claim:interoceptive-dimensions-are-dissociable]
    source_id: pmm:source:garfinkel-2015-knowing-heart
    extraction_locator: PubMed abstract, dimensional dissociation results.
    evidence_kind: cross_sectional_observational
    design: Joint assessment of objective heartbeat detection, self-evaluated sensibility, and confidence-accuracy correspondence.
    population: Normative adults.
    species: [human]
    sample_size: 80
    inference_support: association
    support_direction: mixed
    causal_support: none
    effect: {metric: correspondence among operational dimensions, value_status: qualitative_only, direction: mixed, notes: The dimensions were distinct and only partly corresponding.}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: single_source, precision: not_reported, replication: unreplicated}
    summary: Objective performance, subjective sensibility, and metacognitive correspondence should not be collapsed into one score.
    limitations: [Task-specific operationalization and normative sample.]
    provenance: *provenance

  - id: pmm:evidence:adams-2022-meta-analysis
    claim_ids: [pmm:claim:cardiac-accuracy-not-generally-associated-with-anxiety]
    source_id: pmm:source:adams-2022-anxiety-accuracy
    extraction_locator: PubMed abstract, overall and moderator conclusions.
    evidence_kind: meta_analysis
    design: Preregistered systematic review and meta-analysis of heartbeat counting and discrimination studies.
    population: Participants across 55 included studies.
    species: [human]
    inference_support: association
    support_direction: mixed
    causal_support: none
    effect: {metric: anxiety-cardiac-accuracy association, value_status: qualitative_only, direction: 'null', notes: No overall association or examined moderator effect was reported in the abstract.}
    domains: {directness: direct, risk_of_bias: low, consistency: consistent, precision: adequate, replication: independent_replication}
    summary: Objective cardiac accuracy is not supported as a general correlate of state or trait anxiety.
    limitations: [Conclusions inherit heterogeneity and validity limits of included heartbeat tasks.]
    provenance: *provenance

  - id: pmm:evidence:khalsa-2016-challenge
    claim_ids: [pmm:claim:isoproterenol-increases-anxiety-in-lesion-case-study]
    source_id: pmm:source:khalsa-2016-panic-lesions
    extraction_locator: PubMed abstract and Figure 2 caption.
    evidence_kind: controlled_experiment
    design: Single-blind isoproterenol-versus-saline cardiorespiratory challenge in two bilateral-amygdala-lesion cases with comparison participants.
    population: Two lesion cases; comparison sample described in the report.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect: {metric: acute anxiety response, value_status: qualitative_only, direction: positive, notes: Anxiety increased in both lesion cases and one met panic criteria.}
    domains: {directness: direct, risk_of_bias: high, consistency: single_source, precision: very_limited, replication: unreplicated}
    summary: Peripheral cardiorespiratory perturbation produced acute anxiety within the two exceptional lesion cases.
    limitations: [Two-case lesion evidence cannot estimate a general population effect.]
    provenance: *provenance

  - id: pmm:evidence:khalsa-2016-appraisal-interpretation
    claim_ids: [pmm:claim:appraisal-may-link-bodily-signals-to-anxiety]
    source_id: pmm:source:khalsa-2016-panic-lesions
    extraction_locator: PubMed abstract, sensory-awareness differences and anxiety response.
    evidence_kind: controlled_experiment
    design: Mechanistic interpretation of cardiorespiratory ratings and anxiety during isoproterenol challenge in two lesion cases.
    population: Two participants with bilateral amygdala lesions.
    species: [human]
    sample_size: 2
    inference_support: mechanism
    support_direction: supports
    causal_support: indirect
    effect: {metric: compatibility with sensation-appraisal pathway, value_status: qualitative_only, direction: positive, notes: Sensory and anxiety responses varied across the two cases; appraisal itself was not manipulated.}
    domains: {directness: indirect, risk_of_bias: high, consistency: single_source, precision: very_limited, replication: unreplicated}
    summary: The challenge is compatible with a role for conscious cardiorespiratory sensation but does not identify appraisal as a mediator.
    limitations: [Post hoc mechanistic interpretation of two exceptional cases.]
    provenance: *provenance

