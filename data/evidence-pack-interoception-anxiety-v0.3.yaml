    source_snapshot_date: '2026-08-26'

namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:context:cardiac-interoception-assessment
    type: Context
    label: Cardiac interoception assessment
    definition: Experimental assessment in which cardiac signals, judgments, confidence, or self-reports are recorded.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions: {signal_domain: cardiac, setting: laboratory}
    scope: Heartbeat detection, discrimination, tracking, confidence, and questionnaire procedures.
    provenance: *provenance

  - id: pmm:context:isoproterenol-challenge
    type: Context
    label: Isoproterenol cardiorespiratory challenge
    definition: Pharmacological challenge comparing peripheral beta-adrenergic stimulation with saline while bodily sensation and anxiety are assessed.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions: {agent: isoproterenol, comparator: saline}
    scope: Dose-dependent cardiorespiratory perturbation under the study protocol.
    provenance: *provenance

  - id: pmm:construct:cardiac-interoceptive-accuracy
    type: Construct
    label: Cardiac interoceptive accuracy
    definition: Ability construct inferred from performance on a specified objective cardiac perception task.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Scores from different heartbeat tasks are not assumed to be interchangeable.
      - The construct is not a physiological state or a self-evaluated belief.
    provenance: *provenance

  - id: pmm:construct:interoceptive-sensibility
    type: Construct
    label: Interoceptive sensibility
    definition: Self-evaluated tendency or belief concerning perception of internal bodily signals.
    ontological_level: type
    curation_status: accepted
    construct_kind: psychological
    provenance: *provenance

  - id: pmm:construct:interoceptive-awareness
    type: Construct
    label: Interoceptive metacognitive awareness
    definition: Correspondence between confidence judgments and objective interoceptive task performance.
    ontological_level: type
    curation_status: accepted
    construct_kind: psychological
    boundary_notes:
      - This metacognitive definition is narrower than everyday uses of bodily awareness.
    provenance: *provenance

  - id: pmm:state:cardiorespiratory-activation
    type: State
    label: Cardiorespiratory activation
    definition: Time-indexed physiological change involving cardiac and respiratory activity.
    ontological_level: type
    curation_status: accepted
    state_kind: physiological
    bearer_scope: person
    temporal_scale: episode
    provenance: *provenance

  - id: pmm:state:perceived-cardiorespiratory-sensation
    type: State
    label: Perceived cardiorespiratory sensation
    definition: Momentary conscious experience of heartbeat, breathing, palpitations, or dyspnea.
    ontological_level: type
    curation_status: accepted
    state_kind: cognitive
    bearer_scope: person
    temporal_scale: momentary
    provenance: *provenance

  - id: pmm:outcome:anxiety-intensity
    type: Outcome
    label: Anxiety intensity
    definition: Reported intensity of anxiety or panic symptoms during or across an assessment.
    ontological_level: type
    curation_status: accepted
    outcome_kind: symptom
    valence: aversive
    provenance: *provenance

  - id: pmm:intervention:isoproterenol-infusion
    type: Intervention
    label: Isoproterenol infusion
    definition: Peripheral beta-adrenergic agonist administration used to perturb cardiorespiratory physiology.
    ontological_level: type
    curation_status: accepted
    intervention_kind: pharmacological
    target_ids: [pmm:state:cardiorespiratory-activation]
    delivery: Intravenous bolus infusion at protocol-defined doses compared with saline.
    intended_direction: increase
    provenance: *provenance

  - id: pmm:measurement:heartbeat-task-performance
    type: Measurement
    label: Heartbeat task performance
    definition: Behavioral score from a specified heartbeat detection, discrimination, or tracking procedure.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids: [pmm:construct:cardiac-interoceptive-accuracy]
    method: Score responses against task-specific cardiac timing or counting criteria.
    unit_of_analysis: behavior
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:interoception-self-report
    type: Measurement
    label: Interoception self-report
    definition: Questionnaire or interview score concerning perceived interoceptive ability or tendency.
    ontological_level: type
    curation_status: accepted
    measurement_kind: self_report
    target_ids: [pmm:construct:interoceptive-sensibility]
    method: Aggregate responses according to the named instrument and scoring rule.
    unit_of_analysis: self_report
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:confidence-accuracy-correspondence
    type: Measurement
    label: Confidence-accuracy correspondence
    definition: Metacognitive score relating trial-level or participant-level confidence to objective task performance.
    ontological_level: type
    curation_status: accepted
    measurement_kind: computational_parameter
    target_ids: [pmm:construct:interoceptive-awareness]
    method: Estimate correspondence between confidence judgments and heartbeat-task correctness.
    unit_of_analysis: person
    result_type: model_parameter
    provenance: *provenance

  - id: pmm:mechanism:cardiorespiratory-appraisal
    type: Mechanism
    label: Appraisal of cardiorespiratory sensation
    definition: Proposed process by which perceived cardiorespiratory changes are evaluated in a way that can contribute to anxiety experience.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: integrative
    role_bindings:
      - {role: physiological input, object_id: pmm:state:cardiorespiratory-activation}
      - {role: perceived signal, object_id: pmm:state:perceived-cardiorespiratory-sensation}
      - {role: affective outcome, object_id: pmm:outcome:anxiety-intensity}
    realization_conditions:
      - Cardiorespiratory change is consciously detected or otherwise influences evaluation.
      - The perceived change is evaluated in its current context.
    boundary_notes:
      - The present sources do not identify one unique appraisal computation.
    provenance: *provenance

