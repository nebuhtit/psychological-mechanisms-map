metadata:
  title: Primary evidence pack for interoception and anxiety
  description: Separates bodily physiology, task performance, self-evaluation, metacognition, anxiety outcomes, and proposed appraisal mechanisms.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.1.0
    created_at: '2026-08-26T10:30:00+03:00'
    modified_at: '2026-08-26T10:30:00+03:00'
