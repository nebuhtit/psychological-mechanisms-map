claims:
  - id: pmm:claim:naloxone-blocks-expectation-placebo-analgesia
    claim_type: causal_effect
    statement: In the Amanzio and Benedetti ischemic-pain experiment, naloxone administration eliminated placebo analgesia induced by expectation cues.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'Pharmacological perturbation directly tests opioid-receptor involvement, but allocation details and a standardized effect were not extracted.'}
    scope:
      population: Participants in the Amanzio and Benedetti human experimental ischemic arm-pain study.
      species: [human]
      context_ids: [pmm:context:placebo-analgesia-protocol]
      temporal_scope: Placebo test following expectation induction.
      boundary_conditions: [Does not establish that every placebo analgesic response is opioid-mediated.]
    exposure_id: pmm:intervention:naloxone-challenge
    outcome_id: pmm:state:pain-experience
    causal_estimand: Effect of naloxone versus control treatment on expectation-induced placebo analgesia in the study protocol.
    identification_strategy: other
    temporal_ordering: Expectation induction and naloxone administration preceded pain assessment.
    causal_assumptions:
      consistency: Naloxone and comparison conditions follow the reported protocol.
      exchangeability: Depends on the source allocation and blinding procedures.
      positivity: Relevant protocol groups received antagonist and comparison conditions.
      interference: Cross-participant interference is assumed absent.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:amanzio-1999-naloxone]
    limitations: [Antagonist blockade identifies receptor involvement more directly than a full psychological or neural mechanism.]
    provenance: *provenance

  - id: pmm:claim:dopamine-modulation-null-effect
    claim_type: causal_effect
    statement: In Kunkel et al., randomized sulpiride or L-dopa did not detectably alter formation of positive treatment expectation or placebo analgesia one day later relative to placebo medication.
    epistemic_status: supported
    confidence: {level: high, rationale: 'A double-blind randomized placebo-controlled experiment used opposing pharmacological manipulations and combined frequentist and Bayesian analyses.'}
    scope:
      population: 168 healthy volunteers in the registered experiment.
      species: [human]
      context_ids: [pmm:context:placebo-analgesia-protocol]
      temporal_scope: Expectation formation during conditioning and placebo analgesia one day later.
      boundary_conditions: [A null protocol effect does not prove dopamine is irrelevant to every placebo process or population.]
    exposure_id: pmm:intervention:dopamine-tone-modulation
    outcome_id: pmm:state:pain-experience
    causal_estimand: Between-group effect of sulpiride or L-dopa versus placebo on later placebo analgesia.
    identification_strategy: randomized_intervention
    temporal_ordering: Medication preceded conditioning; pain outcomes were assessed one day later.
    causal_assumptions:
      consistency: Medication groups received the reported pharmacological protocols.
      exchangeability: Supported by randomized double-blind assignment.
      positivity: Participants were allocated across all medication groups.
      interference: Cross-participant interference is assumed absent.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:kunkel-2024-dopamine-null]
    limitations: [The result constrains a direct causal role under the tested dose, timing, task, and population.]
    provenance: *provenance

  - id: pmm:claim:conditioning-neural-statistical-mediation
    claim_type: mediation
    mediation_inference: statistical
    statement: Across the Placebo Imaging Consortium dataset, greater analgesia from conditioning plus suggestion versus suggestion alone was statistically mediated by changes in specified cortical, striatal, sensory-nociceptive, and cerebellar activity.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'Individual-participant meta-analysis increases precision, but statistical mediation of fMRI measures does not identify causal neural mediation.'}
    scope:
      population: 409 participants from 16 within-participant placebo neuroimaging studies.
      species: [human]
      context_ids: [pmm:context:placebo-analgesia-protocol]
      temporal_scope: Pain-period activity and analgesic response in suggestion-only and conditioning-plus-suggestion conditions.
      boundary_conditions: [The mediator set and indirect effects are model-dependent and do not establish necessity or sufficiency.]
    exposure_id: pmm:context:placebo-analgesia-protocol
    mediator_id: pmm:measurement:neurologic-pain-signature
    outcome_id: pmm:state:pain-experience
    indirect_effect: {metric: meta-analytic statistical indirect effect, value_status: qualitative_only, direction: negative, notes: The abstract reports mediation through multiple increased and decreased regional activity measures.}
    temporal_ordering: Protocol induction preceded pain-period imaging and pain-response estimation; within-trial mediator-outcome ordering remains limited.
    evidence_ids: [pmm:evidence:spisak-2026-mediation]
    limitations: [The NPS is one measured component of a broader reported mediator set and is not the mechanism itself.]
    provenance: *provenance

  - id: pmm:claim:expectation-opioid-mechanism-hypothesis
    claim_type: mechanism_hypothesis
    statement: Positive treatment expectation may recruit endogenous opioid signaling that contributes to reduced pain responding in some placebo protocols.
    epistemic_status: proposed
    confidence: {level: moderate, rationale: 'Controlled antagonist studies and a 12-study meta-analysis support opioid involvement, while protocol heterogeneity, responder selection, and nonopioid conditioned effects argue against a universal pathway.'}
    scope:
      population: Humans in experimental and postoperative placebo analgesia paradigms represented by the included antagonist studies and meta-analysis.
      species: [human]
      context_ids: [pmm:context:placebo-analgesia-protocol]
      temporal_scope: Expectation induction through subsequent experimental pain assessment.
      boundary_conditions: [Conditioning with nonopioid drugs can produce naloxone-insensitive placebo responses., Open-label and deceptive placebo procedures need not recruit identical processes in every participant.]
    mechanism_id: pmm:mechanism:endogenous-opioid-modulation
    exposure_id: pmm:construct:positive-treatment-expectation
    outcome_id: pmm:state:pain-experience
    temporal_ordering: Positive treatment expectation is induced before the pain outcome.
    falsifiable_boundary: The hypothesis is weakened if adequately powered receptor blockade repeatedly leaves expectation-induced placebo analgesia unchanged under matched protocols.
    evidence_ids: [pmm:evidence:amanzio-1999-mechanism, pmm:evidence:sauro-2005-opioid-meta-analysis, pmm:evidence:benedetti-2023-open-label-blockade]
    limitations: [This integrative mechanism claim is narrower than saying that expectation is sufficient or that all placebo analgesia is opioid-mediated.]
    provenance: *provenance

