  - id: pmm:evidence:amanzio-1999-naloxone
    claim_ids: [pmm:claim:naloxone-blocks-expectation-placebo-analgesia]
    source_id: pmm:source:amanzio-1999-neuropharmacological-dissection
    extraction_locator: PubMed abstract, expectation-cue and naloxone result.
    evidence_kind: controlled_experiment
    design: Human ischemic arm-pain experiment crossing expectation or drug-conditioning procedures with naloxone challenge.
    population: Participants in a human experimental ischemic arm-pain protocol; sample size not extracted from the abstract.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect: {metric: antagonist effect on placebo analgesia, value_status: qualitative_only, direction: negative, notes: Expectation-cue placebo responses were reported as completely blocked by naloxone.}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: single_source, precision: limited, replication: unreplicated}
    summary: Opioid-receptor antagonism removed the expectation-cue placebo response in this protocol.
    limitations: [Sample size, allocation details, and numerical effect were not extracted from the abstract.]
    provenance: *provenance

  - id: pmm:evidence:amanzio-1999-mechanism
    claim_ids: [pmm:claim:expectation-opioid-mechanism-hypothesis]
    source_id: pmm:source:amanzio-1999-neuropharmacological-dissection
    extraction_locator: PubMed abstract, opioid-versus-nonopioid conditioning contrasts.
    evidence_kind: controlled_experiment
    design: Pharmacological dissociation across expectation, morphine conditioning, and ketorolac conditioning procedures.
    population: Participants in the human experimental ischemic arm-pain study.
    species: [human]
    inference_support: mechanism
    support_direction: supports
    causal_support: indirect
    effect: {metric: naloxone sensitivity by induction procedure, value_status: qualitative_only, direction: mixed, notes: Responses ranged from reversible to partially reversible to insensitive depending on procedure.}
    domains: {directness: indirect, risk_of_bias: some_concerns, consistency: single_source, precision: limited, replication: unreplicated}
    summary: Differential naloxone sensitivity supports multiple protocol-dependent implementations rather than one universal placebo mechanism.
    limitations: [Pharmacological dissociation does not by itself identify the complete intervening pathway.]
    provenance: *provenance

  - id: pmm:evidence:kunkel-2024-dopamine-null
    claim_ids: [pmm:claim:dopamine-modulation-null-effect]
    source_id: pmm:source:kunkel-2024-dopamine
    extraction_locator: PubMed abstract, randomized medication contrast and day-1 outcome.
    evidence_kind: randomized_experiment
    design: Registered double-blind randomized placebo-controlled between-subject trial of sulpiride, L-dopa, and placebo.
    population: 168 healthy volunteers.
    species: [human]
    sample_size: 168
    inference_support: causal_effect
    support_direction: challenges
    causal_support: direct
    effect: {metric: medication-group effect on expectation and placebo analgesia, value_status: qualitative_only, direction: 'null', notes: Frequentist and Bayesian analyses supported no direct effect under the tested protocol.}
    domains: {directness: direct, risk_of_bias: low, consistency: single_source, precision: adequate, replication: unreplicated}
    summary: Opposing dopamine manipulations did not alter treatment-expectation formation or next-day placebo analgesia.
    limitations: [Dose, timing, healthy sample, and protocol constrain generalization.]
    provenance: *provenance

  - id: pmm:evidence:spisak-2026-mediation
    claim_ids: [pmm:claim:conditioning-neural-statistical-mediation]
    source_id: pmm:source:spisak-2026-neural-correlates
    extraction_locator: PubMed abstract, individual-participant meta-analysis and mediation result.
    evidence_kind: meta_analysis
    design: Individual-participant meta-analysis of 16 within-participant placebo fMRI studies comparing suggestion alone with suggestion plus conditioning.
    population: 409 participants.
    species: [human]
    sample_size: 409
    inference_support: mediation
    support_direction: supports
    causal_support: indirect
    effect: {metric: statistical indirect effects through brain-activity measures, value_status: qualitative_only, direction: mixed, notes: Increased prefrontal and striatal and decreased sensory-nociceptive and cerebellar activity were reported.}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: adequate, replication: conceptual_replication}
    summary: Conditioning added analgesia and distinct neural associations, with reported statistical mediation across pooled participant data.
    limitations: [Study heterogeneity and mediator-outcome causal assumptions remain.]
    provenance: *provenance

  - id: pmm:evidence:sauro-2005-opioid-meta-analysis
    claim_ids: [pmm:claim:expectation-opioid-mechanism-hypothesis]
    source_id: pmm:source:sauro-2005-endogenous-opiates
    extraction_locator: PubMed abstract, methods and naloxone synthesis result.
    evidence_kind: meta_analysis
    design: Meta-analysis of placebo and naloxone effects on self-reported pain across 12 studies.
    population: 1183 participants contributing 45 effect sizes across experimental and postoperative or clinical pain studies.
    species: [human]
    sample_size: 1183
    inference_support: mechanism
    support_direction: supports
    causal_support: indirect
    effect: {metric: pooled reversal of placebo-induced analgesia by hidden or blind naloxone, value_status: qualitative_only, direction: negative, notes: The abstract reports reversal but does not provide the pooled numerical estimate.}
    domains: {directness: partially_indirect, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: not_reported, replication: conceptual_replication}
    summary: Across 12 studies, hidden or blind naloxone administration reversed placebo-associated pain reduction on average.
    limitations: [The review predates current reporting standards, pooled heterogeneous pain settings, and provides no abstract-level risk-of-bias assessment or numerical pooled estimate.]
    provenance: *provenance

  - id: pmm:evidence:benedetti-2023-open-label-blockade
    claim_ids: [pmm:claim:expectation-opioid-mechanism-hypothesis]
    source_id: pmm:source:benedetti-2023-open-label-naloxone
    extraction_locator: PubMed abstract, responder definition and hidden naloxone-versus-saline comparison.
    evidence_kind: controlled_experiment
    design: Experimental ischemic arm-pain study with open-label placebo, natural-history controls, and hidden naloxone-versus-saline challenge among placebo responders.
    population: Human experimental-pain participants; 40.6% met the study responder criterion, while total sample size was not extracted from the abstract.
    species: [human]
    inference_support: mechanism
    support_direction: supports
    causal_support: indirect
    effect: {metric: hidden naloxone-versus-saline effect on open-label placebo analgesia among responders, value_status: qualitative_only, direction: negative, notes: Ten milligrams naloxone reversed analgesia; two control groups indicated that naloxone was not independently hyperalgesic.}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: single_source, precision: limited, replication: unreplicated}
    summary: Hidden naloxone reversed open-label placebo analgesia in the selected responder subgroup relative to hidden saline.
    limitations: [Responder selection was based on post-placebo pain and the abstract does not provide total sample size, allocation details, or a standardized effect.]
    provenance: *provenance

