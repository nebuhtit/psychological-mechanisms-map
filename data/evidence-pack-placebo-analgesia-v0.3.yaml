    ontological_level: type
    curation_status: accepted
    intervention_kind: pharmacological
    target_ids: [pmm:construct:positive-treatment-expectation]
    delivery: Between-subject administration before conditioning.
    intended_direction: test
    provenance: *provenance

  - id: pmm:mechanism:endogenous-opioid-modulation
    type: Mechanism
    label: Endogenous opioid pain modulation
    definition: Proposed process in which treatment expectation recruits endogenous opioid signaling that changes pain responding.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: physiological
    role_bindings:
      - {role: antecedent expectation, object_id: pmm:construct:positive-treatment-expectation}
      - {role: perturbation, object_id: pmm:intervention:naloxone-challenge}
      - {role: outcome, object_id: pmm:state:pain-experience}
    realization_conditions: [A placebo protocol induces a positive treatment expectation before pain assessment.]
    boundary_notes: [Naloxone sensitivity supports opioid involvement but does not by itself establish complete mediation or one neural pathway.]
    provenance: *provenance

