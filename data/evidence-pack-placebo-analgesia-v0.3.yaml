    type: Context
    label: Placebo analgesia protocol
    definition: Experimental pain context in which an inert treatment cue is paired with verbal suggestion, conditioning, or both.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions: {treatment_content: inert, induction: suggestion or conditioning, outcome_domain: pain}
    scope: Human experimental-pain protocols represented by the included studies.
    provenance: *provenance

  - id: pmm:construct:positive-treatment-expectation
    type: Construct
    label: Positive treatment expectation
    definition: Anticipated reduction in pain attributed to a treatment or treatment cue.
    ontological_level: type
    curation_status: accepted
    construct_kind: psychological
    boundary_notes: [Expectation is not identical to conditioning history or reported pain or analgesia.]
    provenance: *provenance

  - id: pmm:state:pain-experience
