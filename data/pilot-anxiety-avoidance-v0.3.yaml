claims:
  - id: pmm:claim:rdoc-potential-threat-definition
    claim_type: definition
    statement: RDoC Potential Threat (Anxiety) concerns responses when harm may occur but is distant, ambiguous, or uncertain in probability.
    epistemic_status: not_assessed
    confidence:
      level: not_applicable
      rationale: This is terminology provenance from the current official RDoC definition, not an empirical effect estimate.
    scope:
      population: RDoC dimensional research across normal-to-abnormal human functioning.
      species: [human]
      context_ids: [pmm:context:uncertain-threat]
      temporal_scope: Potential rather than acute imminent threat.
    defined_object_id: pmm:construct:rdoc-potential-threat-anxiety
    source_ids: [pmm:source:rdoc-definitions]
    evidence_ids: []
    provenance:
      record_version: 0.3.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:active-avoidance-contingency-definition
    claim_type: definition
    statement: In an active-avoidance contingency, a specified response changes the programmed aversive consequence relative to a comparator.
    epistemic_status: not_assessed
    confidence:
      level: not_applicable
      rationale: This defines the experimental contingency and does not assert that learning or later response increase occurred.
    scope:
      population: Human and non-human experimental subjects.
      species: [mixed]
      context_ids: [pmm:context:controlled-instrumental-avoidance]
      temporal_scope: Within-trial response-consequence interval.
    defined_object_id: pmm:contingency:avoidance-response-outcome
    source_ids: [pmm:source:punishment-mechanisms-review]
    evidence_ids: []
    provenance:
      record_version: 0.3.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:anxiety-avoidance-association
    claim_type: association
    statement: Anxiety-related responding and avoidance are positively associated on average, with substantial heterogeneity across tasks, people, and contexts.
    epistemic_status: supported
    confidence:
      level: low
      rationale: Multiple reviews support the broad association, but no pooled comparable estimate has been extracted and constructs vary.
    scope:
      population: Human nonclinical and anxiety-related clinical samples.
      species: [human]
      context_ids: [pmm:context:uncertain-threat]
      temporal_scope: Concurrent or short-lag association.
      boundary_conditions:
        - Anxiety may occur without avoidance and avoidance may occur without reported anxiety.
    exposure_id: pmm:state:anxiety-response
    outcome_id: pmm:behavior:avoidance-response
    estimate:
      metric: qualitative direction across reviews
      value_status: qualitative_only
      direction: positive
      notes: No pooled magnitude is asserted.
    confounding_note: Threat severity, controllability, expected value, learning history, goals, social constraints, and measurement method can influence both variables.
    evidence_ids:
      - pmm:evidence:hofmann-hay-anxiety-avoidance
      - pmm:evidence:ball-gunaydin-maladaptive-avoidance
    limitations:
      - The association does not establish a universal anxiety-to-avoidance causal path.
    provenance:
      record_version: 0.3.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:assigned-loss-probability-changes-choice
    claim_type: causal_effect
    statement: In the Kim et al. instrumental choice task, assigning one action a lower probability of monetary loss increased preference for that action across trials.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: Controlled within-task probabilities and counterbalancing support a scoped causal interpretation; the sample was small and the claim does not identify the neural or psychological reinforcer.
    scope:
      population: Sixteen healthy adult participants in the specified monetary instrumental task.
      species: [human]
      context_ids: [pmm:context:controlled-instrumental-avoidance]
      temporal_scope: Across two sessions of repeated instrumental choices.
      boundary_conditions:
        - Restricted to probabilistic monetary-loss avoidance in the cited task.
    exposure_id: pmm:contingency:avoidance-response-outcome
    outcome_id: pmm:behavior:avoidance-response
    causal_estimand: Difference in probability of selecting the action assigned lower versus higher monetary-loss probability under counterbalanced task assignments.
    identification_strategy: controlled_contingency
    temporal_ordering: Outcome probabilities were assigned to actions and preference developed over repeated trials.
    causal_assumptions:
      consistency: Response options and monetary feedback followed the programmed probabilities.
      exchangeability: Stimulus assignments were counterbalanced; within-person alternatives shared the task context.
      positivity: Every participant encountered both action options and probabilistic outcomes.
      interference: Participants completed individual tasks without cross-participant contingencies.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:kim-2006-avoidance-choice]
    limitations:
      - This effect does not prove that subjective relief or medial OFC activity caused learning.
      - Sixteen healthy adults provide limited population generalizability.
    provenance:
      record_version: 0.3.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:negative-reinforcement-mechanism-hypothesis
    claim_type: mechanism_hypothesis
    statement: Response-contingent aversive-outcome omission contributes to increased later avoidance through negative reinforcement learning, while safety signaling and habit may also control performance.
    epistemic_status: proposed
    confidence:
      level: moderate
      rationale: Instrumental learning is established, but the precise controlling representation differs across paradigms and stages of training.
    scope:
      population: Human and non-human active-avoidance learners.
      species: [mixed]
      context_ids: [pmm:context:controlled-instrumental-avoidance]
      temporal_scope: Across acquisition and maintenance trials.
    mechanism_id: pmm:mechanism:negative-reinforcement
    exposure_id: pmm:contingency:avoidance-response-outcome
    outcome_id: pmm:behavior:avoidance-response
    temporal_ordering: Response-contingent consequence change follows current responding and precedes measured later response selection.
    falsifiable_boundary: The hypothesis is weakened where contingency manipulation does not alter later responding or where devaluation identifies a different controlling outcome.
    evidence_ids:
      - pmm:evidence:krypotos-avoidance-learning-review
      - pmm:evidence:punishment-review-active-avoidance
    limitations:
      - A mechanism hypothesis is not promoted to a universal causal effect.
    provenance:
      record_version: 0.3.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:claim:clinical-maintenance-loop-hypothesis
    claim_type: causal_hypothesis
    statement: In some anxiety contexts, avoidance followed by short-term aversive reduction increases later avoidance and reduces opportunities for corrective learning, contributing to persistence.
    epistemic_status: proposed
    confidence:
      level: low
      rationale: Components are plausible, but the complete longitudinal human pathway is not directly identified across disorders and contexts.
    scope:
      population: Humans with persistent maladaptive anxiety-related avoidance.
      species: [human]
      context_ids: [pmm:context:uncertain-threat]
      temporal_scope: Repeated episodes over days to years.
      boundary_conditions:
        - Does not apply when avoidance is adaptive or mainly controlled by other consequences.
    exposure_id: pmm:contingency:avoidance-response-outcome
    outcome_id: pmm:behavior:avoidance-response
    causal_estimand: Longitudinal change in context-matched avoidance attributable to response-contingent short-term aversive reduction.
    temporal_ordering: Avoidance precedes consequence change, which precedes later context-matched avoidance.
    causal_assumptions:
      consistency: Avoidance, objective outcome change, subjective relief, and later behavior are measured separately over time.
      exchangeability: Threat severity, goals, social constraints, treatment, and learning history require control or manipulation.
      positivity: Comparable opportunities for avoidance and approach exist in the target context.
      interference: Social reinforcement and shared environments may violate no-interference assumptions.
      assessment: unverified
    falsifiable_boundary: The pathway is weakened when measured contingent consequence change does not predict later avoidance or when contingency manipulation leaves persistence unchanged.
    evidence_ids:
      - pmm:evidence:hofmann-hay-anxiety-avoidance
      - pmm:evidence:brown-uncertainty-anxiety
    limitations:
      - This is not a statistical mediation claim.
      - RDoC and HiTOP alignment do not validate the causal pathway.
    provenance:
      record_version: 0.3.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

evidence:
  - id: pmm:evidence:kim-2006-avoidance-choice
    claim_ids: [pmm:claim:assigned-loss-probability-changes-choice]
    source_id: pmm:source:kim-2006-avoidance
    extraction_locator: Materials and Methods, Stimuli and task; Results, Behavioral Results.
    evidence_kind: controlled_experiment
    design: Within-participant probabilistic instrumental choice task with counterbalanced fractal assignments and reward, avoidance, and neutral conditions.
    population: Sixteen healthy right-handed adults without reported neurological or psychiatric history.
    species: [human]
    sample_size: 16
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect:
      metric: preference for action associated with lower aversive-outcome probability
      value_status: reported
      direction: positive
      notes: Reported t(15)=1.9, one-tailed p<0.05; no confidence interval reported.
    domains:
      directness: direct
      risk_of_bias: some_concerns
      consistency: single_source
      precision: limited
      replication: unreplicated
    summary: Participants preferentially selected the action assigned a lower probability of monetary loss over repeated trials.
    limitations:
      - Small sample and one-tailed test.
      - Neural activity does not establish that the measured region causally reinforced behavior.
    provenance:
      record_version: 0.3.0
      created_at: '2026-08-26T00:00:00+03:00'
      modified_at: '2026-08-26T00:00:00+03:00'
      created_by: [OpenAI Codex]
      review_status: machine_validated

  - id: pmm:evidence:hofmann-hay-anxiety-avoidance
    claim_ids:
      - pmm:claim:anxiety-avoidance-association
      - pmm:claim:clinical-maintenance-loop-hypothesis
    source_id: pmm:source:hofmann-hay-2018
