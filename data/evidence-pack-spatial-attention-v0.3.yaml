pmm_version: 0.3.4
document_type: pmm_dataset
dataset_id: pmm:dataset:spatial-attention-primary-evidence-v0-3
metadata:
  title: Primary evidence pack for spatial attention and visuospatial cueing
  description: Separates the attention construct, cueing task, cue-validity manipulation, target response, performance measurements, and sensory versus decisional mechanism hypotheses.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.1.0
    created_at: '2026-08-26T16:30:00+03:00'
    modified_at: '2026-08-26T16:30:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:construct:spatial-selective-attention
    type: Construct
    label: Spatial selective attention
    definition: Selective prioritization of information from one or more spatial locations relative to competing locations.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Attention is not identical to visual perception, target detection, response speed, or a score from one cueing task.
      - Spatial attention is narrower than the broad RDoC Attention construct.
    external_mappings:
      - system: RDoC
        external_iri: https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/definitions-of-the-rdoc-domains-and-constructs
        external_label: Attention
        mapping_relation: narrow_match
        mapping_status: label_verified
        rationale: PMM spatial selective attention is one narrower form of the broader RDoC construct regulating access to capacity-limited systems.
        accessed_at: '2026-08-26'
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/concept/id/trm_557b4abe521af/
        external_label: spatial selective attention
        mapping_relation: close_match
        mapping_status: provisional
        rationale: The labels and boundaries are close, but the Cognitive Atlas record is marked Unreviewed and PMM does not import its hierarchy as authoritative.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:context:predictive-visuospatial-cueing-task
    type: Context
    label: Predictive visuospatial cueing task
    definition: Experimental task in which a spatial cue precedes a visual target and target location is more or less consistent with the cued location.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      modality: visual
      cue_type: endogenous or expectancy-inducing spatial cue
      conditions: valid, invalid, and sometimes neutral cue-target relations
      response: target detection, discrimination, or localization
    scope: Human laboratory cueing tasks with fixation control, declared cue validity, target timing, and response rules.
    boundary_notes:
      - The task operationalizes attention under a protocol; it is not the attention construct itself.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/task/id/tsk_4a57abb949ee9/
        external_label: visuospatial cueing task
        mapping_relation: close_match
        mapping_status: provisional
        rationale: The external task describes the same broad cue-target paradigm, but it is marked Unreviewed and does not fix one implementation.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:intervention:spatial-cue-validity-manipulation
    type: Intervention
    label: Spatial cue-validity manipulation
    definition: Experimental variation of whether a cue correctly or incorrectly indicates the later target location or interval.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:construct:spatial-selective-attention
      - pmm:behavior:visual-target-response
    delivery: Present protocol-defined predictive cues before targets and compare valid, invalid, or neutral cue-target conditions.
    intended_direction: test
    provenance: *provenance

  - id: pmm:behavior:visual-target-response
    type: Behavior
    label: Visual target response
    definition: Observable button press or equivalent response indicating target detection, discrimination, localization, or absence.
    ontological_level: type
    curation_status: accepted
    behavior_kind: action
    observability: direct
    actor_scope: person
    response_topography: Protocol-defined manual response while gaze remains within the fixation criterion.
    provenance: *provenance

  - id: pmm:outcome:visual-target-response-latency
    type: Outcome
    label: Visual target response latency
    definition: Time between target onset and a protocol-valid visual target response.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    provenance: *provenance

  - id: pmm:outcome:visual-target-discrimination-accuracy
    type: Outcome
    label: Visual target discrimination accuracy
    definition: Probability or proportion of correct target detection, discrimination, or localization responses under a declared condition.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    provenance: *provenance

  - id: pmm:measurement:cueing-response-latency
    type: Measurement
    label: Cueing-task response-latency measurement
    definition: Trial-level response time and prespecified valid-minus-invalid or invalid-minus-valid latency contrast.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids:
      - pmm:outcome:visual-target-response-latency
      - pmm:behavior:visual-target-response
      - pmm:construct:spatial-selective-attention
    method: Record target-locked response time, apply declared exclusion rules, and compare cue-target conditions.
    unit_of_analysis: behavior
    result_type: continuous
    boundary_notes:
      - A latency contrast is not a direct observation of a unique attention mechanism.
    provenance: *provenance

  - id: pmm:measurement:cueing-accuracy-and-sdt
    type: Measurement
    label: Cueing-task accuracy and signal-detection measurement
    definition: Condition-specific accuracy plus model-based sensitivity and choice-bias estimates when the task design supports their separation.
    ontological_level: type
    curation_status: provisional
    measurement_kind: behavioral_task
    target_ids:
      - pmm:outcome:visual-target-discrimination-accuracy
      - pmm:construct:spatial-selective-attention
      - pmm:mechanism:sensory-evidence-enhancement
      - pmm:mechanism:spatial-decision-weighting
    method: Estimate accuracy and, when identified by the response contingency table, perceptual sensitivity and choice criterion or bias.
    unit_of_analysis: behavior
    result_type: continuous
    boundary_notes:
      - Raw accuracy alone does not distinguish sensitivity from response bias.
      - Model-based separation depends on task design and model assumptions.
    provenance: *provenance

  - id: pmm:mechanism:sensory-evidence-enhancement
    type: Mechanism
    label: Sensory evidence enhancement at an attended location
    definition: Proposed process in which allocating attention increases the quality or discriminability of sensory evidence at the attended location.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - {role: attentional allocation, object_id: pmm:construct:spatial-selective-attention}
      - {role: measured sensory discriminability, object_id: pmm:measurement:cueing-accuracy-and-sdt}
      - {role: target response, object_id: pmm:behavior:visual-target-response}
    realization_conditions:
      - The task and analysis can distinguish perceptual sensitivity from choice bias.
      - Cue timing and stimulus properties permit attentional modulation before the response.
    boundary_notes:
      - A valid-cue performance benefit alone does not establish sensory enhancement.
    provenance: *provenance

  - id: pmm:mechanism:spatial-decision-weighting
    type: Mechanism
    label: Spatial weighting of evidence for decision
    definition: Proposed process in which cue information changes the relative decision weight or criterion assigned to evidence from different locations or intervals.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - {role: predictive cue information, object_id: pmm:intervention:spatial-cue-validity-manipulation}
      - {role: measured choice bias, object_id: pmm:measurement:cueing-accuracy-and-sdt}
      - {role: target response, object_id: pmm:behavior:visual-target-response}
    realization_conditions:
      - Cue information is available before the response decision.
      - The task permits evidence or response options from multiple locations or intervals.
    boundary_notes:
      - Decision weighting does not imply that sensory encoding is unchanged in every task.
    provenance: *provenance

