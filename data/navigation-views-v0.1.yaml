      ontological_note:
        en: Current records cover a caregiver-buffering experiment and a broader but still provisional attachment-system model; they do not represent all support, intimacy, or group processes.
        ru: Текущие записи охватывают эксперимент с поддержкой взрослого и более широкую, но пока предварительную модель системы привязанности; они не представляют все процессы поддержки, близости или группового взаимодействия.
