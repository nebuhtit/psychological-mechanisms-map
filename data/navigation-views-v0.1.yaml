      parent_id: gp:mind
      kind: domain
      label: {en: Development across the lifespan, ru: Развитие в течение жизни}
      description:
        en: Change and continuity in psychological functions, regulation, relationships, and individual differences across age and experience.
        ru: Изменение и устойчивость психических функций, регуляции, отношений и индивидуальных различий с возрастом и опытом.
