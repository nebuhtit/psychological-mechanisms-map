    - id: gp:language
      parent_id: gp:cognitive-processes
      kind: topic
      label: {en: Language, ru: Язык и речь}
      description:
        en: Processes supporting comprehension, production, and meaningful symbolic communication.
        ru: Процессы понимания, порождения и осмысленного символического общения.
      ontological_note:
        en: PMM currently covers only a narrow visual-word pilot. Broad comprehension, visual lexical access, the lexical-decision task, prime manipulation, observable response, latency, model parameters, and competing automatic and strategic explanations remain distinct; production, syntax, discourse, pragmatics, and sign language remain unmapped.
        ru: Сейчас PMM охватывает только узкий пилот распознавания письменных слов. Широкое понимание языка, зрительный доступ к словарю, задание лексического решения, изменение прайма, наблюдаемый ответ, время реакции, параметры модели и конкурирующие автоматические и стратегические объяснения разделены; порождение речи, синтаксис, дискурс, прагматика и жестовые языки пока не представлены.
