claims:
  - id: pmm:claim:rdoc-declarative-memory-covers-facts-and-events
    claim_type: definition
    statement: RDoC Declarative Memory covers encoding, storage, consolidation, and retrieval of representations of facts and events.
    epistemic_status: supported
    confidence: {level: high, rationale: 'This is the current official RDoC construct definition, used for alignment rather than as a complete theory of all memory systems.'}
    scope:
      population: Research framework spanning normal-to-abnormal human functioning.
      species: [human]
      context_ids: [pmm:context:incidental-word-encoding-recognition, pmm:context:developmental-amnesia-assessment]
      temporal_scope: Current NIMH RDoC framework as accessed on 2026-08-26.
    defined_object_id: pmm:construct:declarative-memory
    source_ids: [pmm:source:nimh-rdoc-declarative-memory-2026]
    evidence_ids: []
    limitations: [RDoC is an evolving research framework and does not make every memory task or neural signal equivalent to the construct.]
    provenance: *provenance

  - id: pmm:claim:semantic-encoding-questions-improve-later-word-recognition
    claim_type: causal_effect
    statement: In the reported incidental-learning experiments, meaning-based encoding questions increased later word recognition relative to structural or phonemic questions.
    epistemic_status: supported
    confidence: {level: moderate, rationale: 'Ten controlled experiments supported a robust within-protocol encoding effect, while historical reporting and task specificity limit quantitative generalization.'}
    scope:
      population: Undergraduate participants in ten experiments reported by Craik and Tulving in 1975.
      species: [human]
      context_ids: [pmm:context:incidental-word-encoding-recognition]
      temporal_scope: Encoding questions followed by an unexpected recognition test within the reported sessions.
      boundary_conditions:
        - Words, incidental orienting questions, later recognition, and the specific structural, phonemic, and semantic comparisons reported in the source.
    exposure_id: pmm:intervention:encoding-question-depth-manipulation
    outcome_id: pmm:outcome:later-word-recognition-accuracy
    causal_estimand: Within-protocol difference in later recognition performance after meaning-based versus structural or phonemic encoding questions.
    identification_strategy: controlled_contingency
    temporal_ordering: The assigned orienting question preceded word encoding and the later recognition response.
    causal_assumptions:
      consistency: Each encoding condition follows the reported orienting-question procedure.
      exchangeability: Controlled condition assignment and counterbalancing reduce stable participant and item confounding, subject to source-specific implementation details.
      positivity: Participants or counterbalanced items were represented across the compared encoding conditions.
      interference: Cross-participant interference is assumed absent.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:craik-tulving-1975-encoding-effect]
    limitations: [The effect establishes an encoding-condition difference but does not uniquely identify one memory mechanism or guarantee transfer to other materials and retrieval tests.]
    provenance: *provenance

  - id: pmm:claim:developmental-amnesia-dissociates-episodic-and-semantic-memory
    claim_type: association
    statement: In three reported developmental-amnesia cases with early hippocampal pathology, severe episodic-memory impairment coexisted with substantially better semantic knowledge and academic attainment.
    epistemic_status: supported
    confidence: {level: low, rationale: 'The cases show a striking within-person dissociation, but the sample is three, lesion extent is not experimentally assigned, and population generalization is limited.'}
    scope:
      population: Three individuals with early-onset bilateral hippocampal pathology described by Vargha-Khadem and colleagues in 1997.
      species: [human]
      context_ids: [pmm:context:developmental-amnesia-assessment]
      temporal_scope: Childhood injury followed by assessment in adolescence or early adulthood.
      boundary_conditions: [Clinical case series with early pathology and extensive neuropsychological characterization.]
    exposure_id: pmm:context:developmental-amnesia-assessment
    outcome_id: pmm:measurement:episodic-semantic-profile
    estimate: {metric: within-case episodic versus semantic profile, value_status: qualitative_only, direction: mixed, notes: 'Pronounced episodic amnesia coexisted with speech, literacy, and factual knowledge in the low-average to average range.'}
    confounding_note: Developmental plasticity, lesion extent beyond the hippocampus, premorbid differences, education, and measurement choice can influence the observed profile.
    evidence_ids: [pmm:evidence:vargha-khadem-1997-dissociation]
    limitations: [The result supports separability of measured memory functions but does not prove that the hippocampus is unnecessary for all semantic learning.]
    provenance: *provenance

  - id: pmm:claim:elaborative-semantic-encoding-may-support-retention
    claim_type: mechanism_hypothesis
    statement: Meaning-based encoding may improve later episodic recognition by producing a more elaborated and distinctive representation of the studied item.
    epistemic_status: proposed
    confidence: {level: moderate, rationale: 'Controlled encoding effects are consistent with elaboration and distinctiveness, but the experiments did not isolate one unique latent process.'}
    scope:
      population: Humans performing incidental word-encoding tasks followed by recognition.
      species: [human]
      context_ids: [pmm:context:incidental-word-encoding-recognition]
      temporal_scope: Meaning analysis during encoding through later recognition.
      boundary_conditions: [The task must induce meaningful analysis and later test memory for the studied items.]
    mechanism_id: pmm:mechanism:elaborative-semantic-encoding
    exposure_id: pmm:intervention:encoding-question-depth-manipulation
    outcome_id: pmm:outcome:later-word-recognition-accuracy
    temporal_ordering: Meaning-based analysis occurs during study before formation and later retrieval of the tested representation.
    falsifiable_boundary: The account is weakened if preregistered manipulations equating elaboration and distinctiveness eliminate their contribution while a semantic-versus-shallow recognition advantage remains reliably attributable to another process.
    evidence_ids: [pmm:evidence:craik-tulving-1975-elaboration-account]
    limitations:
      - Semantic processing, semantic memory, elaboration, distinctiveness, and retrieval match must not be collapsed into one construct.
    provenance: *provenance

evidence:
  - id: pmm:evidence:craik-tulving-1975-encoding-effect
    claim_ids: [pmm:claim:semantic-encoding-questions-improve-later-word-recognition]
    source_id: pmm:source:craik-tulving-1975-depth-processing
    extraction_locator: Article summary and experiments I-X comparing structural, phonemic, and semantic orienting questions followed by unexpected retention tests.
    evidence_kind: controlled_experiment
    design: Ten experiments manipulating word-encoding questions and measuring later recognition or retention.
    population: Undergraduate participants in the reported experiments; total sample size was not extracted as one pooled number.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect: {metric: recognition after semantic versus phonemic or structural encoding, value_status: qualitative_only, direction: positive, notes: Meaning-based questions generally produced higher later retention; processing time alone did not account for the pattern in follow-up experiments.}
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: not_reported, replication: conceptual_replication}
    summary: Controlled meaning-based encoding conditions produced better later word memory than shallower structural or sound-based conditions.
    limitations: [Historical multi-experiment report without a pooled modern effect estimate or preregistration.]
    provenance: *provenance

  - id: pmm:evidence:vargha-khadem-1997-dissociation
    claim_ids: [pmm:claim:developmental-amnesia-dissociates-episodic-and-semantic-memory]
    source_id: pmm:source:vargha-khadem-1997-developmental-amnesia
    extraction_locator: PubMed abstract describing three cases, early injury, episodic amnesia, schooling, language, literacy, and factual knowledge.
    evidence_kind: cross_sectional_observational
    design: Neuropsychological and neuroanatomical case series of three people with early-onset amnesia.
    population: Three individuals with injury at birth, by age four, or at age nine.
    species: [human]
    sample_size: 3
    inference_support: association
    support_direction: supports
    causal_support: none
    effect: {metric: episodic-to-semantic functional dissociation, value_status: qualitative_only, direction: mixed, notes: 'Severe everyday episodic amnesia occurred alongside low-average to average speech, literacy, and factual knowledge.'}
    domains: {directness: direct, risk_of_bias: high, consistency: single_source, precision: very_limited, replication: unreplicated}
    summary: Three developmental-amnesia cases showed much greater impairment of episodic remembering than of acquired semantic knowledge.
    limitations: [Very small selected case series; pathology and developmental adaptation were not experimentally controlled.]
    provenance: *provenance

  - id: pmm:evidence:craik-tulving-1975-elaboration-account
    claim_ids: [pmm:claim:elaborative-semantic-encoding-may-support-retention]
    source_id: pmm:source:craik-tulving-1975-depth-processing
    extraction_locator: Article summary and experiments V-X addressing processing duration, decision type, congruity, and qualitative encoding differences.
    evidence_kind: controlled_experiment
    design: Follow-up encoding experiments testing alternatives to a simple processing-time explanation of later retention.
    population: Undergraduate participants in the reported experiments.
    species: [human]
    inference_support: mechanism
    support_direction: supports
    causal_support: indirect
    effect: {metric: retention pattern after qualitative encoding manipulations, value_status: qualitative_only, direction: positive, notes: Results were consistent with qualitative semantic elaboration and congruity rather than processing duration alone.}
    domains: {directness: partially_indirect, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: not_reported, replication: conceptual_replication}
    summary: Follow-up experiments supported qualitative meaning-based encoding over a simple longer-processing-time explanation.
    limitations: [The proposed internal representation was inferred from task contrasts rather than directly measured or uniquely manipulated.]
    provenance: *provenance

