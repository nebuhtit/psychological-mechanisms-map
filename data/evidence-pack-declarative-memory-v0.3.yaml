pmm_version: 0.3.4
document_type: pmm_dataset
dataset_id: pmm:dataset:declarative-memory-primary-evidence-v0-3
metadata:
  title: Primary evidence pack for declarative, episodic, and semantic memory
  description: Separates memory constructs, encoding manipulation, recognition behavior, performance measurement, neuropsychological dissociation, and an elaborative-encoding mechanism hypothesis.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.1.0
    created_at: '2026-08-26T17:30:00+03:00'
    modified_at: '2026-08-26T17:30:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:construct:declarative-memory
    type: Construct
    label: Declarative memory
    definition: Acquisition, storage, consolidation, and retrieval of representations of facts and events that can support flexible use of relational information.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Declarative memory is broader than episodic memory and semantic memory considered separately.
      - The construct is not identical to a recognition score or to one neural structure.
    external_mappings:
      - system: RDoC
        external_iri: https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/constructs/declarative-memory
        external_label: Declarative Memory
        mapping_relation: exact_match
        mapping_status: identifier_verified
        rationale: The PMM label and definition follow the current official RDoC construct page while preserving narrower child constructs separately.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:construct:episodic-memory
    type: Construct
    label: Episodic memory
    definition: Memory for events together with spatial, temporal, or other contextual relations that locate what happened within a particular episode.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Episodic memory is not equivalent to all long-term memory or to recognition performance alone.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/concept/id/trm_4a3fd79d0a1f4/
        external_label: episodic memory
        mapping_relation: close_match
        mapping_status: provisional
        rationale: The external concept is marked Unreviewed; PMM therefore preserves the alignment without importing its asserted hierarchy as settled.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:construct:semantic-memory
    type: Construct
    label: Semantic memory
    definition: Organized knowledge of concepts, word meanings, and facts that is not tied to remembering one specific learning episode.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Semantic memory as stored knowledge is not the same object as semantic processing performed during an encoding task.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/concept/id/trm_4a3fd79d0b083/
        external_label: semantic memory
        mapping_relation: close_match
        mapping_status: provisional
        rationale: The labels are close, but the Cognitive Atlas record is marked Unreviewed and contains task assertions that PMM does not treat as validated automatically.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:context:incidental-word-encoding-recognition
    type: Context
    label: Incidental word-encoding and recognition task
    definition: Laboratory task in which participants answer questions about words without initially expecting a later old-new memory test.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      material: words
      encoding: structural, phonemic, or semantic orienting questions
      retrieval: unexpected later recognition
    scope: Human laboratory studies using incidental encoding questions followed by a recognition test.
    boundary_notes:
      - This task samples particular encoding and recognition operations; it is not declarative memory itself.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/task/id/tsk_4a57abb949d40/
        external_label: recognition memory test
        mapping_relation: narrow_match
        mapping_status: provisional
        rationale: The PMM task is one narrower incidental-encoding implementation of the broader unreviewed recognition-memory task record.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:context:developmental-amnesia-assessment
    type: Context
    label: Developmental-amnesia neuropsychological assessment
    definition: Clinical assessment context comparing episodic remembering and acquired factual knowledge after early bilateral hippocampal pathology.
    ontological_level: type
    curation_status: provisional
    context_kind: developmental
    dimensions:
      onset: birth to nine years in the indexed case series
      pathology: bilateral hippocampal damage or marked volume reduction
      comparison: episodic-memory impairment versus semantic-knowledge attainment
    scope: The three developmental-amnesia cases described by Vargha-Khadem and colleagues in 1997.
    boundary_notes:
      - A small lesion case series can demonstrate a dissociation pattern but cannot estimate a population-average causal effect.
    provenance: *provenance

  - id: pmm:intervention:encoding-question-depth-manipulation
    type: Intervention
    label: Encoding-question depth manipulation
    definition: Experimental assignment of structural, phonemic, or meaning-based questions about each study word before a later memory test.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:behavior:old-new-recognition-response
      - pmm:outcome:later-word-recognition-accuracy
    delivery: Present protocol-defined orienting questions about word appearance, sound, category, or sentence meaning during incidental encoding.
    intended_direction: test
    provenance: *provenance

  - id: pmm:behavior:old-new-recognition-response
    type: Behavior
    label: Old-new recognition response
    definition: Observable response indicating whether a test item was encountered during the earlier study phase.
    ontological_level: type
    curation_status: accepted
    behavior_kind: action
    observability: direct
    actor_scope: person
    response_topography: Protocol-defined old or new judgment for each test word.
    provenance: *provenance

  - id: pmm:outcome:later-word-recognition-accuracy
    type: Outcome
    label: Later word-recognition accuracy
    definition: Correct discrimination of previously studied words from unstudied words on the later recognition test.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    provenance: *provenance

  - id: pmm:measurement:old-new-recognition-performance
    type: Measurement
    label: Old-new recognition-memory measurement
    definition: Condition-specific hits, misses, false alarms, correct rejections, or a derived discrimination measure from an old-new test.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids:
      - pmm:construct:episodic-memory
      - pmm:behavior:old-new-recognition-response
      - pmm:outcome:later-word-recognition-accuracy
    method: Administer an old-new recognition test after encoding and compare prespecified response measures between encoding conditions.
    unit_of_analysis: behavior
    result_type: continuous
    boundary_notes:
      - Recognition accuracy reflects both memory discrimination and response policy unless the design and analysis separate them.
    provenance: *provenance

  - id: pmm:measurement:episodic-semantic-profile
    type: Measurement
    label: Episodic-semantic neuropsychological profile
    definition: A battery comparing memory for personally experienced events with language, literacy, and factual-knowledge attainment.
    ontological_level: type
    curation_status: provisional
    measurement_kind: clinical_rating
    target_ids:
      - pmm:construct:episodic-memory
      - pmm:construct:semantic-memory
    method: Integrate standardized neuropsychological tests and real-life memory characterization across episodic and semantic domains.
    unit_of_analysis: person
    result_type: continuous
    boundary_notes:
      - Relative preservation does not mean completely normal semantic memory, and test batteries do not make the constructs process-identical.
    provenance: *provenance

  - id: pmm:mechanism:elaborative-semantic-encoding
    type: Mechanism
    label: Elaborative semantic encoding
    definition: Proposed process in which a new item is analyzed for meaning and related to contextual or existing knowledge, producing a more discriminable later memory representation.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - {role: encoding operation, object_id: pmm:intervention:encoding-question-depth-manipulation}
      - {role: later recognition behavior, object_id: pmm:behavior:old-new-recognition-response}
      - {role: measured memory performance, object_id: pmm:measurement:old-new-recognition-performance}
    realization_conditions:
      - The encoding question requires meaningful analysis rather than only visual or phonological classification.
      - Later retrieval can use information made distinctive or relational during encoding.
    boundary_notes:
      - Superior memory after semantic questions does not uniquely identify elaboration, distinctiveness, congruity, or one neural implementation.
    provenance: *provenance

