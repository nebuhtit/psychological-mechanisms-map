pmm_version: 0.3.4
document_type: pmm_dataset
dataset_id: pmm:dataset:working-memory-control-primary-evidence-v0-3
metadata:
  title: Primary evidence pack for working-memory control and N-back validity
  description: >-
    Human behavioral, latent-variable, and computational evidence separating
    working-memory constructs, N-back task performance, lure interference,
    familiarity control, and episodic-retrieval alternatives.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.3.4
    created_at: '2026-08-26T00:00:00+03:00'
    modified_at: '2026-08-26T00:00:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:context:n-back-task
    type: Context
    label: N-back task context
    definition: Sequential matching task in which each item is judged against the item presented n positions earlier.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      task_family: n-back
      typical_loads: 2-back and 3-back
      response: target or non-target judgment
    scope: Human laboratory N-back variants; stimulus domain, load, lure frequency, and scoring can differ.
    provenance: *provenance

  - id: pmm:context:working-memory-battery
    type: Context
    label: Multi-task working-memory battery
    definition: Assessment context containing multiple task variants used to estimate common and paradigm-specific latent variance.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      design: individual-differences battery
      task_families: n-back and backward recall
    scope: Human psychometric and latent-variable studies using multiple indicators per proposed construct.
    provenance: *provenance

  - id: pmm:construct:working-memory-capacity
    type: Construct
    label: Working-memory capacity
    definition: Limited ability to maintain accessible information while performing goal-directed processing.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Competing theories disagree about storage, attention, retrieval, and interference contributions.
      - A score from one task is not identical to the construct.
    provenance: *provenance

  - id: pmm:construct:n-back-specific-variance
    type: Construct
    label: N-back-specific performance variance
    definition: Shared individual-difference variance among N-back variants after separating variance common with other working-memory paradigms.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - This is a latent statistical construct, not an identified cognitive mechanism.
    provenance: *provenance

  - id: pmm:state:familiarity-signal
    type: State
    label: Familiarity signal during N-back judgment
    definition: Momentary graded familiarity elicited by a current item relative to recently encountered items.
    ontological_level: type
    curation_status: provisional
    state_kind: cognitive
    bearer_scope: person
    temporal_scale: momentary
    provenance: *provenance

  - id: pmm:behavior:n-back-response
    type: Behavior
    label: N-back target judgment
    definition: Observable response classifying the current item as matching or not matching the item n positions earlier.
    ontological_level: type
    curation_status: accepted
    behavior_kind: action
    observability: direct
    actor_scope: person
    response_topography: Button press or equivalent binary response.
    provenance: *provenance

  - id: pmm:outcome:lure-false-alarm-rate
    type: Outcome
    label: N-back lure false-alarm rate
    definition: Proportion of lure trials incorrectly classified as N-back targets.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    provenance: *provenance

  - id: pmm:intervention:n-back-lure-foil
    type: Intervention
    label: N-back lure-foil manipulation
    definition: Experimental presentation of non-target items matching a recently seen position other than the required n-back position.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:state:familiarity-signal
      - pmm:behavior:n-back-response
    delivery: Insert n-minus-one lure foils among matched control foils during 2-back and 3-back tasks.
    intended_direction: test
    provenance: *provenance

  - id: pmm:measurement:n-back-performance
    type: Measurement
    label: N-back performance measurement
    definition: Accuracy, false-alarm, miss, or latency scoring obtained from a specified N-back task variant.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids:
      - pmm:construct:working-memory-capacity
      - pmm:construct:n-back-specific-variance
      - pmm:behavior:n-back-response
      - pmm:outcome:lure-false-alarm-rate
    method: Score responses by trial type, load, and prespecified accuracy or latency rule.
    unit_of_analysis: behavior
    result_type: continuous
    boundary_notes:
      - Construct validity depends on the inferential use and comparison measures.
    provenance: *provenance

  - id: pmm:measurement:backward-recall-performance
    type: Measurement
    label: Backward-recall performance measurement
    definition: Accuracy or span score for recalling a presented sequence in reverse order.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids: [pmm:construct:working-memory-capacity]
    method: Present sequences and score correctly recalled items or spans in reverse order.
    unit_of_analysis: behavior
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:operation-span-performance
    type: Measurement
    label: Operation-span performance measurement
    definition: Complex-span score derived from remembering items while performing an interleaved processing task.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids: [pmm:construct:working-memory-capacity]
    method: Alternate processing judgments with memoranda and score recall using a prespecified span rule.
    unit_of_analysis: behavior
    result_type: continuous
    provenance: *provenance

  - id: pmm:mechanism:familiarity-control
    type: Mechanism
    label: Control over familiarity-based responding
    definition: Proposed process that uses task position information to override a familiar but currently incorrect target response.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - role: familiarity input
        object_id: pmm:state:familiarity-signal
      - role: controlled response
        object_id: pmm:behavior:n-back-response
      - role: error consequence
        object_id: pmm:outcome:lure-false-alarm-rate
    realization_conditions:
      - A lure item is familiar but does not match the required N-back position.
      - Positional information is available to guide the response.
    provenance: *provenance

  - id: pmm:mechanism:episodic-retrieval-n-back
    type: Mechanism
    label: Episodic retrieval supporting N-back performance
    definition: Proposed process in which retrieval from episodic memory supplies prior-item information used for the current N-back judgment.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - role: retrieval cue
        object_id: pmm:context:n-back-task
      - role: retrieved familiarity information
        object_id: pmm:state:familiarity-signal
      - role: response
        object_id: pmm:behavior:n-back-response
    realization_conditions:
      - Recently presented items remain retrievable from episodic memory.
      - The current item cues temporally diagnostic information.
    boundary_notes:
      - Computational sufficiency does not establish exclusive human implementation.
    provenance: *provenance

relations:
  - id: pmm:relation:working-memory-measured-by-n-back
    subject_id: pmm:construct:working-memory-capacity
    predicate: measured_by
    object_id: pmm:measurement:n-back-performance
    provenance: *provenance
