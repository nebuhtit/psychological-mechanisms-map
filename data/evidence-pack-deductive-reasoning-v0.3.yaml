  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:construct:deductive-reasoning
    type: Construct
    label: Deductive reasoning
    definition: Construction or evaluation of arguments in which a conclusion is assessed as following necessarily from stated premises or hypotheses.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Deductive reasoning is broader than performance on one syllogism task and narrower than thinking or intelligence in general.
      - Logical validity is a property of an argument; it is not a mental state, observed response, or mechanism.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/concept/id/trm_4a3fd79d0a072/
        external_label: deductive reasoning
        mapping_relation: close_match
        mapping_status: provisional
        rationale: The labels and scope are close, but the Cognitive Atlas concept is marked Unreviewed and PMM does not import its hierarchy as settled.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:context:syllogistic-validity-judgment-task
    type: Context
    label: Syllogistic validity-judgment task
    definition: Experimental task in which a participant decides whether a conclusion follows from stated premises while logical validity and conclusion believability can agree or conflict.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      argument_form: categorical or conditional syllogism
      logical_status: valid or invalid
      conclusion_believability: believable or unbelievable
      conflict: validity and believability support the same or different responses
      response_rule: judge logical validity rather than real-world truth
    scope: Human laboratory tasks presenting premises and a conclusion with a protocol-defined validity judgment.
    boundary_notes:
      - The task samples a restricted form of deductive evaluation; it is not deductive reasoning itself.
      - Experimenter-defined logical conflict does not guarantee that every participant represents or experiences the same conflict.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/task/id/trm_4c898b8c2d071/
        external_label: deductive reasoning task
        mapping_relation: narrow_match
        mapping_status: provisional
        rationale: The PMM context is one narrower syllogistic implementation of the broader unreviewed deductive-reasoning task record.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:intervention:syllogism-validity-believability-manipulation
    type: Intervention
    label: Syllogism validity-believability manipulation
    definition: Experimental crossing of whether a conclusion is logically entailed by its premises and whether it is believable from prior world knowledge.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:behavior:syllogism-validity-judgment
      - pmm:outcome:syllogistic-judgment-performance
    delivery: Present protocol-defined valid and invalid arguments with believable and unbelievable conclusions, including conflict and no-conflict combinations.
    intended_direction: test
    provenance: *provenance

  - id: pmm:behavior:syllogism-validity-judgment
    type: Behavior
    label: Syllogism validity judgment
    definition: Observable acceptance or rejection of a conclusion as following logically from the presented premises.
    ontological_level: type
    curation_status: accepted
    behavior_kind: action
    observability: direct
    actor_scope: person
    response_topography: Protocol-defined keypress, rating, or verbal response indicating that the conclusion follows or does not follow.
    function_note: An endorsement can reflect logical analysis, conclusion believability, response criterion, misunderstanding, or a mixture of processes.
    provenance: *provenance

  - id: pmm:outcome:syllogistic-judgment-performance
    type: Outcome
    label: Syllogistic judgment performance
    definition: Protocol-scored agreement between a participant's validity judgment and the formal validity classification of the argument.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    boundary_notes:
      - Accuracy depends on the selected normative logic, argument interpretation, item content, and response procedure.
    provenance: *provenance

  - id: pmm:measurement:condition-specific-syllogism-judgments
    type: Measurement
    label: Condition-specific syllogism judgments
    definition: Acceptance rates, rejection rates, accuracy, response time, confidence, or verbal protocols summarized separately by validity and believability condition.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids:
      - pmm:construct:deductive-reasoning
      - pmm:behavior:syllogism-validity-judgment
      - pmm:outcome:syllogistic-judgment-performance
    method: Record each validity judgment and prespecified process measures, then compare valid, invalid, believable, unbelievable, conflict, and no-conflict conditions.
    unit_of_analysis: behavior
    result_type: continuous
    boundary_notes:
      - Raw acceptance or accuracy does not by itself separate validity discrimination from a tendency to accept believable conclusions.
    provenance: *provenance

  - id: pmm:measurement:syllogistic-signal-detection-profile
    type: Measurement
    label: Syllogistic signal-detection profile
    definition: Model-based separation of sensitivity to argument validity from response criteria using endorsement and confidence distributions for valid and invalid syllogisms.
    ontological_level: type
    curation_status: provisional
    measurement_kind: computational_parameter
    target_ids:
      - pmm:construct:deductive-reasoning
      - pmm:behavior:syllogism-validity-judgment
      - pmm:outcome:syllogistic-judgment-performance
    method: Fit a declared signal-detection model to participant- and item-level endorsement or confidence data and estimate discriminability and response criteria by condition.
    unit_of_analysis: behavior
    result_type: model_parameter
    boundary_notes:
      - Discriminability and criterion are model-dependent estimates, not direct observations of reasoning mechanisms.
      - Aggregating heterogeneous people or items can distort receiver-operating-characteristic interpretations.
    provenance: *provenance

  - id: pmm:mechanism:parallel-belief-logic-evaluation
    type: Mechanism
    label: Parallel belief-logic evaluation
    definition: Proposed process in which content-based plausibility and argument-structure information are evaluated concurrently and can support compatible or competing responses.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - {role: manipulated argument properties, object_id: pmm:intervention:syllogism-validity-believability-manipulation}
      - {role: observable judgment, object_id: pmm:behavior:syllogism-validity-judgment}
      - {role: process-sensitive measurement, object_id: pmm:measurement:condition-specific-syllogism-judgments}
    realization_conditions:
      - The participant extracts enough content and structural information for both evaluations to influence processing.
      - Conflict measures distinguish subjective response competition from experimenter-assigned logical conflict.
    boundary_notes:
      - Parallel evaluation is a process hypothesis, not another name for a validity-by-believability interaction.
      - Slower responses, lower confidence, skin conductance, or mutual interference are indirect and non-unique indicators of conflict.
    provenance: *provenance

