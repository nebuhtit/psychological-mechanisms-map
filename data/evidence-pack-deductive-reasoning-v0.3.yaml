  title: Primary evidence pack for deductive reasoning and belief bias
  description: Separates deductive reasoning, syllogism tasks, validity-believability manipulation, judgments, accuracy, signal-detection measurement, and a parallel-evaluation mechanism hypothesis.
  status: pilot
  language: en
  license: CC-BY-4.0
