applications:
  - id: pmm:application:semantic-elaboration-for-word-retention
    family_id: declarative-memory
    title: {en: Process meaning to improve retention, ru: Обрабатывайте смысл для лучшего запоминания}
    practical_question:
      en: What can be changed during study to improve later memory for verbal material?
      ru: Что можно изменить во время учёбы, чтобы лучше запоминать словесный материал?
    action:
      en: Explain the meaning in your own words, connect it with prior knowledge, or answer a meaningful question about it instead of attending only to appearance or sound.
      ru: Объясните смысл своими словами, свяжите материал с уже известным или ответьте на содержательный вопрос о нём вместо внимания только к виду или звучанию.
    expected_change:
      en: Better later recognition of similar verbal material than after shallow visual or sound-based processing.
      ru: Более точное последующее узнавание сходного словесного материала по сравнению с поверхностной обработкой вида или звучания.
    evidence_basis:
      en: Controlled encoding experiments directly changed the questions asked about words and measured later recognition.
      ru: В контролируемых экспериментах исследователи изменяли вопросы о словах и затем измеряли их узнавание.
    applicability:
      en: Low-risk study design for verbal learning; closest to intentional semantic elaboration of concepts and terms.
      ru: Низкорисковый приём для изучения словесного материала, наиболее близкий к осмысленной проработке понятий и терминов.
    not_established:
      en: The mapped evidence does not guarantee long-term retention, transfer to every subject, or that elaboration is the only mechanism.
      ru: Представленные данные не гарантируют долговременное сохранение, перенос на любой предмет или то, что проработка является единственным механизмом.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [individual, educator]
    claim_ids: [pmm:claim:semantic-encoding-questions-improve-later-word-recognition, pmm:claim:elaborative-semantic-encoding-may-support-retention]
    source_ids: [pmm:source:craik-tulving-1975-depth-processing]
    provenance: *provenance

  - id: pmm:application:separate-validity-from-believability
    family_id: deductive-reasoning
    title: {en: Separate logical validity from plausibility, ru: Отделяйте логическую валидность от правдоподобия}
    practical_question:
      en: How might a person reduce the influence of a believable conclusion when checking an argument?
      ru: Как можно уменьшить влияние правдоподобного вывода при проверке аргумента?
    action:
      en: First ask whether the conclusion must follow if the premises are accepted; only afterward evaluate whether the premises and conclusion are realistic. Restating the structure with neutral symbols is a candidate aid.
      ru: Сначала спросите, обязан ли вывод следовать из принятых посылок, и только затем оценивайте реалистичность посылок и вывода. Перезапись структуры нейтральными символами может помочь, но пока это лишь кандидатный приём.
    expected_change:
      en: The intended change is less contamination of validity judgments by conclusion believability.
      ru: Предполагаемый результат — меньшее влияние правдоподобия вывода на оценку логической валидности.
    evidence_basis:
      en: Experiments show that manipulated believability changes validity judgments, but the mapped pack does not directly test this debiasing procedure.
      ru: Эксперименты показывают, что изменение правдоподобия влияет на оценку валидности, но представленный пакет напрямую не проверяет эту процедуру снижения ошибки.
    applicability:
      en: Candidate checklist for education, analysis, and review of short deductive arguments.
      ru: Кандидатный чек-лист для обучения, анализа и проверки коротких дедуктивных аргументов.
    not_established:
      en: It is not established here that the checklist reliably reduces bias, generalizes to real decisions, or changes an underlying reasoning mechanism.
      ru: Здесь не доказано, что чек-лист надёжно снижает ошибку, переносится на реальные решения или изменяет внутренний механизм рассуждения.
    actionability: interpretation_only
    confidence: low
    audience: [individual, educator, researcher]
    claim_ids: [pmm:claim:conclusion-believability-changes-validity-judgments, pmm:claim:believability-does-not-unconditionally-reduce-discriminability]
    source_ids: [pmm:source:evans-barston-pollard-1983, pmm:source:trippas-2018-belief-bias-meta-analysis]
    provenance: *provenance

  - id: pmm:application:semantic-context-for-immediate-word-recognition
    family_id: language-comprehension
    title: {en: Use semantic context to ease immediate word recognition, ru: Используйте смысловой контекст для облегчения распознавания слова}
    practical_question:
      en: Can related context make a word easier to process immediately?
      ru: Может ли связанный контекст облегчить немедленную обработку слова?
    action:
      en: Present an unfamiliar or important term near a short, meaning-related cue or sentence when immediate recognition matters.
      ru: Показывайте незнакомый или важный термин рядом с короткой смысловой подсказкой или предложением, если важно немедленное распознавание.
    expected_change:
      en: Faster immediate classification or recognition under conditions similar to semantic-priming tasks.
      ru: Более быстрое немедленное распознавание в условиях, близких к заданиям семантического прайминга.
    evidence_basis:
      en: Controlled experiments changed semantic relation and observed response-time differences; they tested immediate processing, not learning.
      ru: В контролируемых экспериментах изменяли смысловую связь и наблюдали различия времени ответа; проверялась немедленная обработка, а не обучение.
    applicability:
      en: Candidate design principle for labels, glossaries, instructions, and educational interfaces.
      ru: Кандидатный принцип для подписей, словарей, инструкций и образовательных интерфейсов.
    not_established:
      en: The evidence does not show durable vocabulary learning, comprehension of complex text, or that semantic context always helps.
      ru: Данные не показывают долговременное усвоение слов, понимание сложного текста или пользу смыслового контекста во всех случаях.
    actionability: transfer_uncertain
    confidence: low
    audience: [educator, designer, researcher]
    claim_ids: [pmm:claim:semantic-relatedness-changes-lexical-decision-latency]
    source_ids: [pmm:source:meyer-schvaneveldt-1971, pmm:source:neely-1976]
    provenance: *provenance

  - id: pmm:application:recognize-short-term-relief-avoidance-loop
    family_id: avoidance
    title: {en: Distinguish immediate relief from long-term improvement, ru: Отличайте немедленное облегчение от долгосрочного улучшения}
    practical_question:
      en: Why can an action that reduces anxiety now still maintain avoidance later?
      ru: Почему действие, которое сейчас уменьшает тревогу, может поддерживать избегание в будущем?
    action:
      en: When reviewing an avoidance episode, record the trigger, the action, the immediate relief or omitted harm, and whether the same action became more likely next time.
      ru: При разборе эпизода избегания отмечайте триггер, действие, немедленное облегчение или непроизошедший вред и стало ли такое действие вероятнее в следующий раз.
    expected_change:
      en: Better identification of a possible reinforcement loop; this is an observation aid rather than a demonstrated treatment.
      ru: Более ясное распознавание возможной петли подкрепления; это средство наблюдения, а не доказанное лечение.
    evidence_basis:
      en: Laboratory contingencies support response-dependent changes in later choice, while the clinical maintenance loop remains a scoped hypothesis.
      ru: Лабораторные зависимости поддерживают изменение последующего выбора в зависимости от ответа, но клиническая петля поддержания остаётся ограниченной гипотезой.
    applicability:
      en: Psychoeducation and structured self-observation; clinical interpretation should consider safety, context, and alternative functions of avoidance.
      ru: Психообразование и структурированное самонаблюдение; клиническая интерпретация должна учитывать безопасность, контекст и другие функции избегания.
    not_established:
      en: Repeated avoidance does not by itself prove negative reinforcement, and the map does not prescribe exposure or treatment decisions.
      ru: Повторяющееся избегание само по себе не доказывает отрицательное подкрепление, а карта не назначает экспозицию или лечение.
    safety_note:
      en: Do not deliberately confront danger or stop clinically indicated safety behavior based on this card; seek qualified help for severe anxiety or trauma.
      ru: Не подвергайте себя опасности и не прекращайте необходимое защитное поведение на основании этой карточки; при тяжёлой тревоге или травме обратитесь к квалифицированному специалисту.
    actionability: interpretation_only
    confidence: low
    audience: [individual, clinician, educator]
    claim_ids: [pmm:claim:assigned-loss-probability-changes-choice, pmm:claim:negative-reinforcement-mechanism-hypothesis, pmm:claim:clinical-maintenance-loop-hypothesis]
    source_ids: [pmm:source:kim-2006-avoidance, pmm:source:hofmann-hay-2018]
    provenance: *provenance

  - id: pmm:application:plan-extinction-for-context-and-time
    family_id: extinction
    title: {en: Plan for return outside the learning context, ru: Учитывайте возврат реакции вне контекста обучения}
    practical_question:
      en: How can new safety learning be made less dependent on one place and one session?
      ru: Как сделать новое безопасное научение менее зависимым от одного места и одного занятия?
    action:
      en: In a professionally appropriate and safe learning plan, rehearse the new response across more than one context and check it again after a delay rather than treating one successful session as erasure.
      ru: В профессионально составленном и безопасном плане повторяйте новую реакцию в нескольких контекстах и проверяйте её спустя время, а не считайте один успешный сеанс стиранием прежнего научения.
    expected_change:
      en: Better detection and possible reduction of context-specific or delayed return of conditioned responding.
      ru: Более раннее выявление и возможное уменьшение зависящего от контекста или отсроченного возврата условной реакции.
    evidence_basis:
      en: Controlled human laboratory studies found renewal after context change and recovery after delays; clinical transfer is not directly established by this pack.
      ru: В контролируемых лабораторных исследованиях у людей реакция возвращалась после смены контекста и задержки; клинический перенос этим пакетом напрямую не установлен.
    applicability:
      en: Design principle for exposure-based learning, relapse planning, and laboratory extinction protocols.
      ru: Принцип проектирования экспозиционного научения, планирования возможного возврата реакции и лабораторных протоколов угасания.
    not_established:
      en: Varying contexts is not guaranteed to prevent relapse, and the mapped evidence does not specify a universal clinical dose or sequence.
      ru: Изменение контекстов не гарантирует предотвращение возврата реакции, а представленные данные не задают универсальную клиническую дозу или последовательность.
    safety_note:
      en: Exposure involving severe anxiety, trauma, medical risk, or real danger should be planned with a qualified professional.
      ru: Экспозицию при тяжёлой тревоге, травме, медицинском риске или реальной опасности следует планировать с квалифицированным специалистом.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [clinician, researcher, individual]
    claim_ids: [pmm:claim:context-shift-causes-renewal, pmm:claim:time-allows-spontaneous-recovery, pmm:claim:extinction-memory-mechanism-hypothesis]
    source_ids: [pmm:source:alvarez-johnson-grillon-2007, pmm:source:huff-hernandez-blanding-labar-2009, pmm:source:coelho-dunsmoor-phelps-2015]
    provenance: *provenance

  - id: pmm:application:test-habit-by-changing-outcome-value
    family_id: habit
    title: {en: Test a habit instead of inferring it from repetition, ru: "Проверяйте привычку, а не выводите её из повторения"}
    practical_question:
      en: How can one distinguish repeated goal-directed action from outcome-insensitive responding?
      ru: Как отличить повторяющееся целенаправленное действие от реакции, нечувствительной к результату?
    action:
      en: Change the value, cost, or availability of the expected outcome and observe whether the action changes; combine this with context and self-report rather than relying on repetition alone.
      ru: Измените ценность, цену или доступность ожидаемого результата и посмотрите, меняется ли действие; учитывайте контекст и самоотчёт, а не полагайтесь только на повторяемость.
    expected_change:
      en: A more cautious classification of behavior as goal-directed, outcome-insensitive, or unresolved.
      ru: Более осторожная классификация поведения как целенаправленного, нечувствительного к результату или пока неопределённого.
    evidence_basis:
      en: Human devaluation results are mixed, and different habit tasks and questionnaires do not behave as interchangeable measures.
      ru: Результаты девальвации у людей смешанные, а разные задания и опросники привычек не являются взаимозаменяемыми измерениями.
    applicability:
      en: Behavioral assessment, intervention design, and research on repeated actions.
      ru: Поведенческая оценка, проектирование вмешательств и исследования повторяющихся действий.
    not_established:
      en: One failed devaluation test does not prove a stable habit, and extended repetition or acute stress does not reliably create habitual control in the mapped evidence.
      ru: Один неудачный тест девальвации не доказывает устойчивую привычку, а длительное повторение или острый стресс по представленным данным не создают привычный контроль надёжно.
    actionability: interpretation_only
    confidence: moderate
    audience: [individual, clinician, researcher]
    claim_ids: [pmm:claim:extended-training-causes-outcome-insensitivity, pmm:claim:habit-measures-converge, pmm:claim:habitual-control-mechanism-hypothesis]
    source_ids: [pmm:source:tricomi-balleine-odoherty-2009, pmm:source:pool-2022-multilaboratory, pmm:source:nebe-2024-characterizing-habits]
    provenance: *provenance

  - id: pmm:application:reappraise-meaning-for-subjective-distress
    family_id: reappraisal
    title: {en: Reinterpret meaning to change subjective emotion, ru: Переосмысливайте значение для изменения субъективной эмоции}
    practical_question:
      en: What can be changed when a situation triggers a strong negative emotional response?
      ru: Что можно изменить, когда ситуация вызывает сильную отрицательную эмоцию?
    action:
      en: Generate a plausible alternative interpretation of what the situation means, such as viewing an image as staged or an event as temporary, without denying relevant facts.
      ru: Сформулируйте правдоподобное альтернативное понимание смысла ситуации, например рассмотрите изображение как постановочное или событие как временное, не отрицая значимые факты.
    expected_change:
      en: Reduced self-reported negative emotion in the short term under conditions similar to brief reappraisal tasks.
      ru: Кратковременное уменьшение субъективно сообщаемой отрицательной эмоции в условиях, близких к коротким заданиям переоценки.
    evidence_basis:
      en: Randomized laboratory instructions repeatedly reduced subjective negative emotion, while autonomic effects were mixed.
      ru: Рандомизированные лабораторные инструкции неоднократно уменьшали субъективную отрицательную эмоцию, но физиологические эффекты были смешанными.
    applicability:
      en: Low-risk emotion-regulation practice for ordinary situations when a different truthful interpretation is available.
      ru: Низкорисковая практика регуляции эмоций в обычных ситуациях, когда возможно другое правдивое толкование.
    not_established:
      en: Reappraisal does not guarantee bodily calming, long-term benefit, superiority to acceptance, or suitability for every event and person.
      ru: Переоценка не гарантирует физиологическое успокоение, долгосрочную пользу, превосходство над принятием или пригодность для любой ситуации и человека.
    safety_note:
      en: Reinterpretation should not be used to dismiss real danger, abuse, medical symptoms, or the need for action.
      ru: Переосмысление нельзя использовать для отрицания реальной опасности, насилия, медицинских симптомов или необходимости действовать.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [individual, clinician, educator]
    claim_ids: [pmm:claim:reappraisal-reduces-reported-negative-emotion, pmm:claim:reappraisal-reduces-autonomic-reactivity, pmm:claim:meaning-reinterpretation-mechanism-hypothesis]
    source_ids: [pmm:source:gross-1998-emotion-regulation, pmm:source:wolgast-lundh-viborg-2011, pmm:source:hamza-2024-reappraisal-stress]
    provenance: *provenance

  - id: pmm:application:match-working-memory-measure-to-goal
    family_id: working-memory
    title: {en: Match the working-memory task to the actual goal, ru: Подбирайте задание рабочей памяти под реальную цель}
    practical_question:
      en: Can an N-back score be treated as a general measure or training target for working memory?
      ru: Можно ли считать результат N-back общей мерой или целью тренировки рабочей памяти?
    action:
      en: Define the target first, such as updating, resisting familiarity, backward recall, or complex-span performance, and use more than one task when making broad conclusions.
      ru: Сначала определите цель — обновление, подавление знакомости, обратное воспроизведение или выполнение complex span — и используйте несколько заданий для широких выводов.
    expected_change:
      en: More valid assessment and fewer false conclusions that improvement on one task means general working-memory improvement.
      ru: Более валидная оценка и меньше ошибочных выводов о том, что улучшение одного задания означает общее улучшение рабочей памяти.
    evidence_basis:
      en: N-back, operation span, and backward recall converge imperfectly, while lure trials show that familiarity control contributes to N-back performance.
      ru: N-back, operation span и обратное воспроизведение сходятся неполностью, а пробы-ловушки показывают вклад контроля знакомости в выполнение N-back.
    applicability:
      en: Cognitive assessment, educational testing, training studies, and interpretation of commercial brain-training claims.
      ru: Когнитивная оценка, образовательное тестирование, исследования тренировки и интерпретация обещаний коммерческих тренажёров мозга.
    not_established:
      en: The pack does not show that N-back training broadly improves memory, intelligence, study performance, or daily functioning.
      ru: Пакет не показывает, что тренировка N-back широко улучшает память, интеллект, учёбу или повседневное функционирование.
    actionability: interpretation_only
    confidence: moderate
    audience: [educator, clinician, researcher, individual]
    claim_ids: [pmm:claim:lures-increase-n-back-false-alarms, pmm:claim:n-back-weakly-converges-with-complex-span, pmm:claim:n-back-and-backward-recall-are-distinct-factors]
    source_ids: [pmm:source:kane-2007-n-back-validity, pmm:source:byrne-2024-n-back-factors]
    provenance: *provenance

  - id: pmm:application:separate-interoceptive-dimensions
    family_id: interoception
    title: {en: Measure bodily awareness as several dimensions, ru: Измеряйте телесное осознавание по нескольким измерениям}
    practical_question:
      en: What should be assessed when someone reports unusually strong or weak awareness of bodily signals?
      ru: Что следует оценивать, когда человек сообщает о необычно сильном или слабом ощущении сигналов тела?
    action:
      en: Separate objective task performance, subjective sensibility, and confidence calibration instead of summarizing them as one interoception score.
      ru: Разделяйте объективное выполнение задания, субъективную чувствительность и соответствие уверенности точности вместо объединения в один показатель интероцепции.
    expected_change:
      en: A clearer profile of whether the issue concerns detection performance, self-belief, metacognitive calibration, or their mismatch.
      ru: Более ясный профиль того, относится ли особенность к обнаружению сигнала, представлению о себе, метакогнитивной калибровке или их несовпадению.
    evidence_basis:
      en: These dimensions were empirically dissociable, and objective cardiac accuracy was not generally associated with anxiety in a preregistered meta-analysis.
      ru: Эти измерения эмпирически различались, а объективная сердечная точность в пререгистрированном метаанализе не была в целом связана с тревогой.
    applicability:
      en: Research and clinical assessment design; useful for avoiding overinterpretation of a heartbeat-task score or questionnaire.
      ru: Проектирование исследований и клинической оценки; помогает не переоценивать результат задания на сердцебиение или опросника.
    not_established:
      en: A high or low score on one dimension does not diagnose anxiety, prove abnormal bodily processing, or identify the causal mechanism of symptoms.
      ru: Высокий или низкий результат по одному измерению не диагностирует тревогу, не доказывает нарушение телесной обработки и не выявляет причину симптомов.
    safety_note:
      en: New or severe cardiorespiratory symptoms require medical assessment rather than interpretation through this map alone.
      ru: Новые или тяжёлые сердечно-дыхательные симптомы требуют медицинской оценки, а не только интерпретации по этой карте.
    actionability: interpretation_only
    confidence: moderate
    audience: [clinician, researcher, individual]
    claim_ids: [pmm:claim:interoceptive-dimensions-are-dissociable, pmm:claim:cardiac-accuracy-not-generally-associated-with-anxiety, pmm:claim:appraisal-may-link-bodily-signals-to-anxiety]
    source_ids: [pmm:source:garfinkel-2015-knowing-heart, pmm:source:adams-2022-anxiety-accuracy]
    provenance: *provenance

  - id: pmm:application:use-familiar-support-during-acute-stress
    family_id: social-buffering
    title: {en: Use familiar support during acute stress, ru: Используйте поддержку знакомого человека при остром стрессе}
    practical_question:
      en: Can the presence of a trusted person change a child's stress response?
      ru: Может ли присутствие близкого человека изменить стрессовую реакцию ребёнка?
    action:
      en: When appropriate, arrange calm support from a familiar caregiver before and during a predictable stressful event rather than assuming any available adult is equivalent.
      ru: Когда это уместно, организуйте спокойную поддержку знакомого взрослого до и во время предсказуемого стрессового события, не считая любого присутствующего взрослого равноценным.
    expected_change:
      en: A potentially different cortisol trajectory and subjective stress experience under conditions resembling the studied child stress tasks.
      ru: Возможное изменение динамики кортизола и субъективного стресса в условиях, близких к изученным детским стрессовым заданиям.
    evidence_basis:
      en: Randomized support conditions changed cortisol trajectories, but effects depended on developmental and care-history context.
      ru: Рандомизированные условия поддержки меняли динамику кортизола, однако эффект зависел от развития и истории ухода.
    applicability:
      en: Planning support around medical procedures, evaluations, transitions, or other predictable acute stressors in children.
      ru: Планирование поддержки при медицинских процедурах, оценивании, переходах и других предсказуемых острых стрессорах у детей.
    not_established:
      en: Familiar support is not guaranteed to reduce stress for every child and does not replace treatment, safeguarding, or changes to a harmful environment.
      ru: Знакомая поддержка не гарантирует уменьшение стресса у каждого ребёнка и не заменяет лечение, защиту или изменение вредной среды.
    actionability: transfer_uncertain
    confidence: low
    audience: [individual, clinician, educator]
    claim_ids: [pmm:claim:parent-buffer-changes-cortisol-trajectory, pmm:claim:care-history-moderates-parent-support-effect, pmm:claim:co-regulation-may-produce-buffering]
    source_ids: [pmm:source:donzella-2026-social-buffering, pmm:source:hostinar-2015-early-deprivation]
    provenance: *provenance

  - id: pmm:application:align-feedback-with-the-target-action
    family_id: reward-learning
    title: {en: Align feedback closely with the target action, ru: Связывайте обратную связь с целевым действием по времени}
    practical_question:
      en: What does prediction-error research suggest about the timing of learning feedback?
      ru: Что исследования ошибки предсказания говорят о времени обратной связи при обучении?
    action:
      en: Make the informative outcome or feedback clearly attributable to the target cue or action and deliver it at a consistent, interpretable time.
      ru: Делайте информативный результат или обратную связь однозначно связанными с целевым сигналом или действием и предъявляйте их в последовательный, понятный момент.
    expected_change:
      en: Clearer updating of expectations about which cue or action predicts an outcome.
      ru: Более ясное обновление ожиданий о том, какой сигнал или действие предсказывает результат.
    evidence_basis:
      en: Temporally precise dopamine-neuron stimulation changed later reward seeking in rats, and prediction-error models formalize value updating; direct human educational transfer is not tested here.
      ru: Точная по времени стимуляция дофаминовых нейронов меняла последующий поиск награды у крыс, а модели ошибки предсказания описывают обновление ценности; прямой перенос на обучение людей здесь не проверен.
    applicability:
      en: Candidate principle for feedback systems, behavioral training, and experimental task design.
      ru: Кандидатный принцип для систем обратной связи, поведенческого обучения и экспериментальных заданий.
    not_established:
      en: The evidence does not show that faster feedback is always better, that dopamine equals prediction error, or that the animal manipulation specifies a human learning recipe.
      ru: Данные не показывают, что более быстрая обратная связь всегда лучше, что дофамин равен ошибке предсказания или что эксперимент на животных задаёт готовый способ обучения людей.
    actionability: interpretation_only
    confidence: low
    audience: [educator, designer, researcher]
    claim_ids: [pmm:claim:rpe-is-model-defined-discrepancy, pmm:claim:timed-dopamine-stimulation-increases-learned-seeking, pmm:claim:rpe-may-drive-temporal-difference-updating]
    source_ids: [pmm:source:steinberg-2013-causal-link, pmm:source:gershman-2024-dopamine-beyond]
    provenance: *provenance

  - id: pmm:application:interpret-hpa-dynamics-with-serial-measures
    family_id: hpa-feedback
    title: {en: Interpret HPA feedback as a time course, ru: Интерпретируйте обратную связь ГГН-оси во времени}
    practical_question:
      en: Can one cortisol value reveal whether HPA negative feedback is functioning normally?
      ru: Может ли одно значение кортизола показать нормальность отрицательной обратной связи ГГН-оси?
    action:
      en: For research or qualified clinical assessment, use protocol-timed serial cortisol and ACTH measurements and document medication, circadian timing, and perturbation conditions.
      ru: В исследовании или квалифицированной клинической оценке используйте серийные измерения кортизола и ACTH по протоколу и фиксируйте лекарства, время суток и условия воздействия.
    expected_change:
      en: Better separation of hormone level, delayed feedback, continuous secretion, and pulsatile secretory dynamics.
      ru: Более точное разделение уровня гормона, отсроченной обратной связи, непрерывной секреции и пульсирующей динамики.
    evidence_basis:
      en: Controlled pharmacological studies showed delayed and multi-component ACTH responses when cortisol signaling was changed.
      ru: Контролируемые фармакологические исследования показали отсроченные и многокомпонентные изменения ACTH при изменении сигналов кортизола.
    applicability:
      en: Endocrine research design and specialist interpretation of dynamic HPA tests.
      ru: Проектирование эндокринных исследований и специализированная интерпретация динамических тестов ГГН-оси.
    not_established:
      en: A single home or laboratory cortisol sample does not measure feedback capacity, chronic stress, or mental health, and this map does not define diagnostic thresholds.
      ru: Один домашний или лабораторный анализ кортизола не измеряет способность обратной связи, хронический стресс или психическое здоровье, а карта не задаёт диагностические пороги.
    safety_note:
      en: Metyrapone, cortisol, and other endocrine perturbations require medical supervision and are not self-experiments.
      ru: Метирапон, кортизол и другие эндокринные воздействия требуют медицинского контроля и не предназначены для самостоятельных экспериментов.
    actionability: interpretation_only
    confidence: moderate
    audience: [clinician, researcher]
    claim_ids: [pmm:claim:hpa-feedback-is-multiple-receptor-linked-processes, pmm:claim:cortisol-replacement-suppresses-acth-after-delay, pmm:claim:metyrapone-increases-continuous-and-pulsatile-acth]
    source_ids: [pmm:source:won-1986-feedback-phases, pmm:source:dorin-1996-acth-dynamics, pmm:source:gjerstad-2018-hpa-feedback]
    provenance: *provenance

  - id: pmm:application:use-treatment-context-without-replacing-care
    family_id: placebo-analgesia
    title: {en: Use credible treatment context without replacing active care, ru: "Используйте убедительный контекст лечения, не заменяя само лечение"}
    practical_question:
      en: Can communication and learned treatment cues contribute to pain relief?
      ru: Могут ли общение и выученные сигналы лечения вносить вклад в уменьшение боли?
    action:
      en: Pair an evidence-based intervention with clear, truthful explanation, predictable procedure, and credible positive expectations without promising a guaranteed response.
      ru: Сочетайте доказанное вмешательство с ясным правдивым объяснением, предсказуемой процедурой и обоснованными положительными ожиданиями без обещания гарантированного эффекта.
    expected_change:
      en: A possible additional reduction in reported pain for some people and protocols.
      ru: Возможное дополнительное уменьшение сообщаемой боли у части людей и в некоторых протоколах.
    evidence_basis:
      en: Pharmacological blockade and pooled imaging data support protocol-dependent expectation and conditioning effects, not one universal placebo pathway.
      ru: Фармакологическая блокада и объединённые нейровизуализационные данные поддерживают зависящие от протокола эффекты ожидания и обусловливания, но не единый универсальный путь плацебо.
    applicability:
      en: Ethical communication and treatment-context design in qualified pain care and research.
      ru: Этичное общение и проектирование контекста лечения в квалифицированной помощи при боли и исследованиях.
    not_established:
      en: Expectation does not reliably eliminate pain, identify its cause, or justify withholding active treatment; dopamine manipulation showed a scoped null result.
      ru: Ожидание не гарантирует устранение боли, не выявляет её причину и не оправдывает отказ от активного лечения; воздействие на дофамин дало ограниченный нулевой результат.
    safety_note:
      en: New, severe, or unexplained pain requires appropriate medical assessment; placebo context must not be used to conceal risk or substitute ineffective care.
      ru: Новая, сильная или необъяснимая боль требует медицинской оценки; контекст плацебо нельзя использовать для сокрытия риска или замены эффективной помощи.
    actionability: transfer_uncertain
    confidence: low
    audience: [clinician, researcher]
    claim_ids: [pmm:claim:naloxone-blocks-expectation-placebo-analgesia, pmm:claim:conditioning-neural-statistical-mediation, pmm:claim:expectation-opioid-mechanism-hypothesis]
    source_ids: [pmm:source:amanzio-1999-neuropharmacological-dissection, pmm:source:spisak-2026-neural-correlates]
    provenance: *provenance

  - id: pmm:application:use-valid-spatial-cues-for-detection
    family_id: spatial-attention
    title: {en: Use reliable spatial cues when fast detection matters, ru: Используйте надёжные пространственные подсказки для быстрого обнаружения}
    practical_question:
      en: How can an interface direct attention toward a likely target location?
      ru: Как интерфейс может направить внимание к вероятному месту появления цели?
    action:
      en: Place a clear cue before the target and make its spatial prediction meaningfully reliable; test both response time and errors rather than speed alone.
      ru: Показывайте ясную подсказку до цели и обеспечьте содержательную надёжность её пространственного прогноза; измеряйте и время ответа, и ошибки, а не только скорость.
    expected_change:
      en: Faster detection and, in some tasks, better accuracy at the cued location than at unexpected locations.
      ru: Более быстрое обнаружение и в некоторых заданиях более высокая точность в подсказанном месте по сравнению с неожиданным.
    evidence_basis:
      en: Controlled cue-validity experiments produced response-time and accuracy benefits, while sensory enhancement and decision weighting remain competing explanations.
      ru: Контролируемые эксперименты с валидностью подсказки дали преимущества во времени и точности, но сенсорное усиление и изменение веса решения остаются конкурирующими объяснениями.
    applicability:
      en: Interface alerts, visual search, training displays, and experimental design where target location is probabilistic.
      ru: Интерфейсные предупреждения, зрительный поиск, учебные экраны и экспериментальные задания с вероятностным положением цели.
    not_established:
      en: Invalid or overused cues can misdirect attention, and the evidence does not identify one universal perceptual mechanism or guarantee real-world safety improvement.
      ru: Неверные или чрезмерные подсказки могут направить внимание ошибочно, а данные не выявляют единый механизм восприятия и не гарантируют улучшение безопасности в реальности.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [designer, educator, researcher]
    claim_ids: [pmm:claim:valid-spatial-cues-reduce-detection-latency, pmm:claim:valid-endogenous-cues-improve-sequential-accuracy, pmm:claim:decision-weighting-may-contribute-to-spatial-cueing]
    source_ids: [pmm:source:posner-1980-detection-signals, pmm:source:johnson-2020-decision-model, pmm:source:banerjee-2019-sensory-decisional]
    provenance: *provenance

  - id: pmm:application:design-contrast-for-spatial-scale
    family_id: visual-perception
    title: {en: Design contrast for the relevant visual scale, ru: Подбирайте контраст с учётом размера деталей}
    practical_question:
      en: Why can equal nominal contrast produce different visibility for broad and fine patterns?
      ru: Почему одинаковый формальный контраст может давать разную видимость крупных и мелких деталей?
    action:
      en: Test important visual information at its actual size, distance, display, and viewing conditions; increase contrast or simplify fine detail when detection is poor.
      ru: Проверяйте важную зрительную информацию при реальном размере, расстоянии, экране и условиях просмотра; повышайте контраст или упрощайте мелкие детали при плохом обнаружении.
    expected_change:
      en: More reliable detection of important patterns across the spatial scales and conditions actually used.
      ru: Более надёжное обнаружение важных элементов при реально используемых размерах деталей и условиях.
    evidence_basis:
      en: Controlled psychophysics showed that detection threshold changes systematically with grating spatial frequency and waveform.
      ru: Контролируемые психофизические эксперименты показали закономерную зависимость порога обнаружения от пространственной частоты и формы решётки.
    applicability:
      en: Display, document, signage, and experimental-stimulus design; especially useful before formal accessibility testing.
      ru: Проектирование экранов, документов, знаков и экспериментальных стимулов, особенно перед формальной проверкой доступности.
    not_established:
      en: The grating findings do not specify a universal interface threshold, diagnose visual impairment, or prove divisive normalization as the unique human mechanism.
      ru: Результаты с решётками не задают универсальный порог интерфейса, не диагностируют нарушение зрения и не доказывают дивизивную нормализацию как единственный механизм у человека.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [designer, researcher, clinician]
    claim_ids: [pmm:claim:contrast-sensitivity-is-reciprocal-threshold, pmm:claim:grating-properties-change-detection-threshold, pmm:claim:divisive-normalization-may-shape-visual-gain]
    source_ids: [pmm:source:campbell-robson-1968-gratings, pmm:source:carandini-heeger-2012-normalization]
    provenance: *provenance

  - id: pmm:application:use-big-five-as-profile-not-type
    family_id: big-five
    title: {en: "Use the Big Five as a profile, not a label", ru: "Используйте Большую пятёрку как профиль, а не ярлык"}
    practical_question:
      en: How can a Big Five result be used without turning it into a diagnosis or fixed personality type?
      ru: Как использовать результат Большой пятёрки, не превращая его в диагноз или неизменный тип личности?
    action:
      en: Interpret all five domain scores and relevant facets as approximate continua, verify the instrument and language version, and connect the profile to specific modifiable behaviors rather than treating the score itself as a cause.
      ru: Рассматривайте все пять шкал и важные грани как приблизительные непрерывные показатели, проверяйте методику и языковую версию и связывайте профиль с конкретными изменяемыми действиями, а не считайте балл причиной.
    expected_change:
      en: More precise self-reflection, assessment, and research questions with fewer categorical labels and causal overclaims.
      ru: Более точная саморефлексия, оценка и постановка исследовательских вопросов с меньшим количеством типологических ярлыков и ложных причинных выводов.
    evidence_basis:
      en: The BFI-2 validation literature supports a five-domain, 15-facet measurement hierarchy, and meta-analysis links measured Conscientiousness with academic performance only associatively.
      ru: Исследования BFI-2 поддерживают измерительную иерархию из пяти доменов и 15 граней, а метаанализ связывает измеренную добросовестность с успеваемостью только статистически.
    applicability:
      en: Low-stakes self-reflection, research, education, coaching, and qualified personality assessment.
      ru: Низкорисковая саморефлексия, исследования, образование, коучинг и квалифицированная оценка личности.
    not_established:
      en: The profile is not a diagnosis, does not identify a personality mechanism, does not provide universal norms, and should not determine high-stakes educational or employment decisions by itself.
      ru: Профиль не является диагнозом, не выявляет механизм личности, не имеет универсальных норм и не должен самостоятельно определять важные образовательные или кадровые решения.
    safety_note:
      en: Do not use an online personality score as a substitute for clinical assessment or as the sole basis for selecting, excluding, or ranking people.
      ru: Не используйте результат онлайн-теста вместо клинической оценки или как единственное основание для отбора, исключения или ранжирования людей.
    actionability: interpretation_only
    confidence: moderate
    audience: [individual, educator, clinician, researcher]
    claim_ids: [pmm:claim:big-five-is-dimensional-taxonomy, pmm:claim:bfi2-supports-five-domain-fifteen-facet-profile, pmm:claim:conscientiousness-associated-with-academic-performance]
    source_ids: [pmm:source:berkeley-bfi2-2026, pmm:source:soto-john-2017-bfi2, pmm:source:poropat-2009-academic-performance]
    provenance: *provenance

  - id: pmm:application:target-study-behaviors-not-trait-score
    family_id: big-five
    title: {en: Target study behavior rather than the trait score, ru: "Воздействуйте на учебные действия, а не на балл черты"}
    practical_question:
      en: What is actionable if lower measured Conscientiousness accompanies study difficulties?
      ru: На что можно воздействовать, если более низкая измеренная добросовестность сопровождается трудностями в учёбе?
    action:
      en: Examine concrete routines such as planning, starting work, distraction control, task completion, and feedback use, then test one change at a time instead of trying to raise a personality score directly.
      ru: "Проверьте конкретные действия: планирование, начало работы, контроль отвлечений, завершение заданий и использование обратной связи, затем изменяйте по одному элементу вместо попытки напрямую повысить балл личности."
    expected_change:
      en: A testable change in study behavior or performance, without assuming that the broad trait itself was causally modified.
      ru: Проверяемое изменение учебного поведения или результата без предположения, что широкая черта была причинно изменена.
    evidence_basis:
      en: Conscientiousness and academic performance are associated across studies, but the mapped evidence does not test trait-score change as the cause of better performance.
      ru: Добросовестность и успеваемость связаны во многих исследованиях, но представленные данные не проверяют изменение балла черты как причину улучшения результата.
    applicability:
      en: Educational planning and low-stakes self-experimentation with observable study routines.
      ru: Планирование учёбы и низкорисковые самостоятельные проверки наблюдаемых учебных привычек.
    not_established:
      en: The association does not identify which routine matters for a particular person or prove that personality testing improves academic outcomes.
      ru: Связь не показывает, какая привычка важна для конкретного человека, и не доказывает, что тестирование личности улучшает успеваемость.
    actionability: interpretation_only
    confidence: low
    audience: [individual, educator]
    claim_ids: [pmm:claim:conscientiousness-associated-with-academic-performance]
    source_ids: [pmm:source:poropat-2009-academic-performance]
    provenance: *provenance

  - id: pmm:application:map-attachment-episode-without-labeling
    family_id: attachment-system
    title:
      en: Map the relationship episode instead of assigning a style
      ru: Разбирайте эпизод отношений вместо присвоения стиля
    practical_question:
      en: What can be changed when a threat to closeness repeatedly leads to distress or conflict?
      ru: Что можно изменить, когда угроза близости постоянно приводит к дистрессу или конфликту?
    action:
      en: >-
        Record one concrete episode as trigger, perceived danger, need, support-seeking or distancing action, the other person's response, immediate relief or escalation, and later consequence. Choose one observable change such as a clearer request, agreed response, boundary, or pause and review the result.
      ru: >-
        Запишите один конкретный эпизод как триггер, воспринятую угрозу, потребность, поиск поддержки или дистанцирование, ответ другого, немедленное облегчение или усиление и более позднее последствие. Выберите одно наблюдаемое изменение: более ясную просьбу, согласованный ответ, границу или паузу, затем оцените результат.
    expected_change:
      en: A testable change in communication, distress regulation, or repeated interaction without treating either person as a fixed type.
      ru: Проверяемое изменение общения, регуляции дистресса или повторяющегося взаимодействия без превращения человека в неизменный тип.
    evidence_basis:
      en: Attachment research supports relationship-specific patterns and associations with responsive care, while the complete episode-to-expectation mechanism remains proposed.
      ru: Исследования привязанности поддерживают специфичные для отношений паттерны и связи с отзывчивым уходом, но полный механизм от эпизода до ожиданий остаётся гипотезой.
    applicability:
      en: Low-risk reflection on close relationships, caregiving, or therapy formulation when safety permits direct communication.
      ru: Низкорисковый разбор близких отношений, ухода или терапевтической формулировки, когда безопасность позволяет прямое общение.
    not_established:
      en: The map does not diagnose attachment, prove childhood causation, guarantee that communication will help, or apply where coercion or violence makes direct negotiation unsafe.
      ru: Схема не диагностирует привязанность, не доказывает причину из детства, не гарантирует пользу общения и не применяется там, где принуждение или насилие делают переговоры небезопасными.
    safety_note:
      en: In coercive, violent, or unsafe relationships, prioritize safety planning and qualified support rather than joint experimentation.
      ru: При принуждении, насилии или небезопасных отношениях приоритетом являются план безопасности и квалифицированная помощь, а не совместный эксперимент.
    actionability: interpretation_only
    confidence: low
    audience: [individual, clinician, researcher]
    claim_ids: [pmm:claim:attachment-system-organizes-safety-seeking, pmm:claim:adult-attachment-measures-are-not-interchangeable, pmm:claim:attachment-regulation-loop-is-integrative-hypothesis]
    source_ids: [pmm:source:fraley-shaver-2000-attachment, pmm:source:ravitz-2010-adult-attachment-measures]
    provenance: *provenance

  - id: pmm:application:sensitive-response-without-determinism
    family_id: attachment-system
    title:
      en: Respond sensitively without treating one interaction as destiny
      ru: Отвечайте чутко, не считая один эпизод судьбой
    practical_question:
      en: What is a reasonable caregiving target suggested by attachment evidence?
      ru: Какую разумную цель ухода подсказывают данные о привязанности?
    action:
      en: Notice the child's signal, infer the likely need cautiously, respond promptly and proportionately, and observe whether the child can recover or return to exploration; adjust rather than forcing contact.
      ru: Заметьте сигнал ребёнка, осторожно предположите потребность, ответьте своевременно и соразмерно и наблюдайте, может ли ребёнок успокоиться или вернуться к исследованию; корректируйте ответ, а не навязывайте контакт.
    expected_change:
      en: More contingent caregiving and better information about what helps this child regulate in this relationship.
      ru: Более согласованный с сигналами уход и более точная информация о том, что помогает этому ребёнку регулироваться в данных отношениях.
    evidence_basis:
      en: Observed caregiver sensitivity is positively associated with secure preschool attachment, but observational evidence does not establish one sufficient causal recipe.
      ru: Наблюдаемая чувствительность опекуна положительно связана с безопасной привязанностью дошкольника, но наблюдательные данные не устанавливают единственный достаточный причинный рецепт.
    applicability:
      en: Ordinary caregiving and professional parent guidance within the child's developmental, sensory, cultural, and safety context.
      ru: Повседневный уход и профессиональное сопровождение родителей с учётом развития, сенсорных особенностей, культуры и безопасности ребёнка.
    not_established:
      en: Sensitivity alone does not determine attachment, and this guidance is not a substitute for assessment of developmental, medical, trauma, or safeguarding concerns.
      ru: Одна чувствительность не определяет привязанность, а рекомендация не заменяет оценку развития, здоровья, травмы или угроз безопасности.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [individual, clinician, educator]
    claim_ids: [pmm:claim:caregiver-sensitivity-associated-with-child-security, pmm:claim:attachment-security-shows-moderate-not-deterministic-stability]
    source_ids: [pmm:source:divito-kurkjian-2021-sensitivity, pmm:source:pinquart-2013-stability]
    provenance: *provenance

  - id: pmm:application:test-one-cbt-loop-link
    family_id: cbt-formulation
    title:
      en: Test one link in the cognitive-behavioral loop
      ru: Проверяйте одно звено когнитивно-поведенческой петли
    practical_question:
      en: How can a broad problem be turned into a safe and testable change?
      ru: Как превратить широкую проблему в безопасное проверяемое изменение?
    action:
      en: >-
        Describe one situation, interpretation, emotion, bodily response, action, and immediate and delayed consequence. Select one low-risk link: check a prediction, change an avoidance behavior, alter the environment, or practice a skill. Define the expected observable result before testing it.
      ru: >-
        Опишите одну ситуацию, интерпретацию, эмоцию, телесную реакцию, действие, немедленное и отсроченное последствие. Выберите одно низкорисковое звено: проверить прогноз, изменить избегающее действие или среду либо потренировать навык. До проверки задайте наблюдаемый ожидаемый результат.
    expected_change:
      en: Better individualized evidence about what maintains the problem and which change improves a personally relevant outcome.
      ru: Более точные индивидуальные данные о том, что поддерживает проблему и какое изменение улучшает важный для человека результат.
    evidence_basis:
      en: CBT has treatment efficacy in several scoped conditions, and cognitive variables are candidate mediators, but the full maintenance loop is person- and context-specific.
      ru: КПТ эффективна при ряде конкретных состояний, а когнитивные переменные являются возможными медиаторами, но полная поддерживающая петля зависит от человека и контекста.
    applicability:
      en: Low-risk self-observation, skills training, or qualified CBT and process-based formulation; not emergency or high-risk experimentation.
      ru: Низкорисковое самонаблюдение, обучение навыкам или квалифицированная КПТ и процессная формулировка; не для экстренных или рискованных экспериментов.
    not_established:
      en: A changed thought does not guarantee a changed feeling, and failure of one experiment does not prove the whole CBT model false or the person resistant.
      ru: Изменение мысли не гарантирует изменение чувства, а неудача одного эксперимента не опровергает всю модель КПТ и не означает сопротивление человека.
    safety_note:
      en: Severe symptoms, suicidality, psychosis, abuse, or medical risk require qualified assessment and an appropriate care plan.
      ru: Тяжёлые симптомы, суицидальность, психоз, насилие или медицинский риск требуют квалифицированной оценки и подходящего плана помощи.
    actionability: interpretation_only
    confidence: low
    audience: [individual, clinician, researcher]
    claim_ids: [pmm:claim:cbt-model-links-interpretation-and-response, pmm:claim:cbt-cycle-is-person-specific-mechanism-hypothesis, pmm:claim:cognitive-change-statistically-mediates-some-prevention-effects]
    source_ids: [pmm:source:beck-institute-cognitive-model, pmm:source:moreno-peral-2020-mediators]
    provenance: *provenance

  - id: pmm:application:use-cbt-efficacy-within-scope
    family_id: cbt-formulation
    title:
      en: Use CBT efficacy without claiming one proven mechanism
      ru: Используйте данные об эффективности КПТ без заявления о единственном механизме
    practical_question:
      en: What does strong treatment evidence justify in practice?
      ru: Что сильные данные о лечении позволяют утверждать на практике?
    action:
      en: For depression, consider a protocol-defined CBT option with qualified assessment, shared decision-making, progress measurement, and review of fit; identify the actual components delivered rather than assuming all CBT is identical.
      ru: При депрессии рассматривайте КПТ по определённому протоколу с квалифицированной оценкой, совместным решением, измерением прогресса и проверкой соответствия; фиксируйте реальные компоненты, а не считайте всю КПТ одинаковой.
    expected_change:
      en: On average, lower depressive symptom severity than control conditions represented in the evidence, with individual response monitored rather than presumed.
      ru: В среднем более низкая выраженность депрессивных симптомов, чем в представленных контрольных условиях, при обязательном отслеживании индивидуального ответа.
    evidence_basis:
      en: A meta-analysis of 409 randomized trials found a moderate-to-large average effect versus controls, while differences from other psychotherapies were small and not robust in sensitivity analyses.
      ru: Метаанализ 409 рандомизированных исследований выявил умеренный или крупный средний эффект по сравнению с контролем, тогда как отличия от других психотерапий были малы и неустойчивы в анализах чувствительности.
    applicability:
      en: Evidence-based depression care selected with a qualified professional and adapted to severity, preference, access, comorbidity, and risk.
      ru: Доказательная помощь при депрессии, выбранная с квалифицированным специалистом с учётом тяжести, предпочтений, доступности, сопутствующих состояний и риска.
    not_established:
      en: The result does not show that CBT is best for everyone, that self-help is equivalent to therapy, or that cognitive restructuring uniquely caused improvement.
      ru: Результат не показывает, что КПТ лучше для всех, что самопомощь эквивалентна терапии или что улучшение вызвала только когнитивная реструктуризация.
    safety_note:
      en: Treatment selection and crisis care should follow qualified clinical assessment; this map is not a treatment recommendation for an individual.
      ru: Выбор лечения и кризисная помощь должны основываться на квалифицированной клинической оценке; карта не назначает лечение конкретному человеку.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [individual, clinician, researcher]
    claim_ids: [pmm:claim:cbt-reduces-depression-versus-controls, pmm:claim:cbt-efficacy-does-not-validate-unique-mechanism]
    source_ids: [pmm:source:cuijpers-2023-cbt-depression, pmm:source:nice-depression-2022]
    provenance: *provenance

  - id: pmm:application:demonstrate-practice-feedback-transfer
    family_id: social-learning
    title:
      en: Demonstrate, let the learner practice, then test transfer
      ru: Покажите, дайте попробовать и затем проверьте перенос
    practical_question:
      en: How can observation be used without assuming that seeing a model is enough for learning?
      ru: Как использовать наблюдение, не предполагая, что одного показа достаточно для научения?
    action:
      en: Show one observable target action and its relevant result, ask the learner to reproduce or explain it, provide task-specific feedback, and later test the same skill with changed materials or context.
      ru: Покажите одно наблюдаемое целевое действие и важный результат, попросите учащегося воспроизвести или объяснить его, дайте обратную связь по заданию и позже проверьте тот же навык на другом материале или в ином контексте.
    expected_change:
      en: Better evidence about whether the learner attended, can reproduce the action, improves with feedback, and transfers it beyond the demonstration.
      ru: Более точные данные о том, заметил ли учащийся действие, способен ли его воспроизвести, улучшается ли результат после обратной связи и переносится ли навык за пределы показа.
    evidence_basis:
      en: Controlled model-exposure studies establish immediate observational effects, while reviews distinguish demonstration, acquisition, performance, and transfer.
      ru: Контролируемые исследования показа модели подтверждают немедленные эффекты наблюдения, а обзоры разделяют демонстрацию, усвоение, выполнение и перенос.
    applicability:
      en: Low-risk teaching, coaching, onboarding, rehabilitation practice, and behavioral-skills training when the modeled action is safe and observable.
      ru: Низкорисковое обучение, наставничество, ввод в работу, реабилитационная практика и тренировка поведенческих навыков, если показываемое действие безопасно и наблюдаемо.
    not_established:
      en: The included studies do not establish one optimal demonstration method, durable transfer to every domain, or that exact imitation is always the desired learning outcome.
      ru: Представленные исследования не устанавливают единственный лучший способ демонстрации, устойчивый перенос во все области или необходимость точного подражания как результата обучения.
    actionability: transfer_uncertain
    confidence: low
    audience: [individual, educator, clinician, researcher]
    claim_ids: [pmm:claim:observational-learning-is-not-identical-to-imitation, pmm:claim:observation-performance-selection-is-integrative-hypothesis]
    source_ids: [pmm:source:bandura-1965-model-consequences, pmm:source:greer-2006-observational-learning]
    provenance: *provenance

  - id: pmm:application:separate-social-learning-from-visible-performance
    family_id: social-learning
    title:
      en: Do not equate quiet performance with failure to learn
      ru: Не приравнивайте отсутствие выполнения к отсутствию усвоения
    practical_question:
      en: What should be checked when someone watched a demonstration but does not perform the action?
      ru: Что проверить, если человек наблюдал демонстрацию, но не выполняет действие?
    action:
      en: Separately check whether the person noticed the relevant step, can describe or recognize it, has the required motor or verbal skill, expects an adverse consequence, and can reproduce it under a safe prompt or incentive.
      ru: Отдельно проверьте, заметил ли человек важный шаг, может ли описать или узнать его, обладает ли необходимым двигательным или речевым навыком, ожидает ли неприятных последствий и может ли воспроизвести действие после безопасной подсказки или стимула.
    expected_change:
      en: A more precise identification of whether the immediate bottleneck concerns attention, retained information, available skill, motivation, expected consequences, or context.
      ru: Более точное определение того, связан ли текущий барьер со вниманием, сохранённой информацией, доступным навыком, мотивацией, ожидаемыми последствиями или контекстом.
    evidence_basis:
      en: In Bandura's 1965 study, an observer incentive removed spontaneous performance differences between prior model-consequence conditions.
      ru: В исследовании Бандуры 1965 года стимул для наблюдателя устранил различия в самопроизвольном выполнении между условиями с разными последствиями для модели.
    applicability:
      en: Interpretation of low-stakes training and assessment results; each candidate barrier still requires its own valid measurement.
      ru: Интерпретация результатов низкорискового обучения и оценки; каждый возможный барьер всё равно требует отдельного валидного измерения.
    not_established:
      en: A reward is not a universal diagnostic test, can itself alter behavior, and should not be used to pressure unsafe, unwanted, or ethically inappropriate performance.
      ru: Награда не является универсальным диагностическим тестом, сама может менять поведение и не должна использоваться для давления с целью небезопасного, нежелательного или неэтичного действия.
    actionability: interpretation_only
    confidence: moderate
    audience: [educator, clinician, researcher]
    claim_ids: [pmm:claim:observed-model-consequence-changes-spontaneous-imitation, pmm:claim:direct-incentive-removes-model-consequence-performance-gap]
    source_ids: [pmm:source:bandura-1965-model-consequences]
    provenance: *provenance

  - id: pmm:application:map-emotion-by-components
    family_id: emotion-process
    title:
      en: Map the emotion episode before choosing an intervention
      ru: Разберите эмоциональный эпизод до выбора воздействия
    practical_question:
      en: Where can a difficult emotional episode be changed without assuming one universal cause?
      ru: На какое звено трудного эмоционального эпизода можно воздействовать, не предполагая единственную универсальную причину?
    action:
      en: >-
        Write one concrete sequence: event and context → interpreted meaning → reported feeling and bodily changes → urge → observed action → immediate and delayed consequences. Mark which entries were observed, self-reported, or only inferred, then select one low-risk link to test.
      ru: >-
        Запишите одну конкретную последовательность: событие и контекст → воспринятый смысл → переживание и телесные изменения → побуждение → наблюдаемое действие → немедленные и отсроченные последствия. Отметьте, что наблюдалось, что сообщено человеком, а что только предполагается, затем выберите одно безопасное звено для проверки.
    expected_change:
      en: A more precise, testable target such as interpretation, exposure, bodily arousal, action, communication, environmental trigger, or consequence rather than a vague goal to “remove the emotion.”
      ru: >-
        Более точная и проверяемая цель: интерпретация, контакт с ситуацией, телесное возбуждение, действие, общение, средовой триггер или последствие вместо расплывчатой цели «убрать эмоцию».
    evidence_basis:
      en: Component reviews support separating experience, physiology, expression, and behavior; the appraisal meta-analysis supports checking meaning dimensions while not establishing a unique causal sequence.
      ru: Компонентные обзоры поддерживают разделение переживания, физиологии, выражения и поведения; метаанализ оценки ситуации поддерживает проверку смысловых измерений, но не устанавливает единственную причинную последовательность.
    applicability:
      en: Low-risk reflection, coaching, education, research formulation, and collaborative clinical assessment when the event can be examined safely.
      ru: Низкорисковая рефлексия, обучение, консультирование, исследовательская формулировка и совместная клиническая оценка, когда эпизод можно безопасно рассматривать.
    not_established:
      en: The map does not diagnose a disorder, prove the appraisal caused the feeling, or show which link should be changed for a particular person.
      ru: Схема не диагностирует расстройство, не доказывает, что оценка ситуации вызвала чувство, и не определяет автоматически, какое звено менять у конкретного человека.
    safety_note:
      en: Real danger, severe symptoms, trauma, self-harm, violence, or medical symptoms require appropriate protection and qualified assessment rather than self-experiment alone.
      ru: Реальная опасность, тяжёлые симптомы, травма, самоповреждение, насилие или медицинские симптомы требуют подходящей защиты и квалифицированной оценки, а не только самостоятельного эксперимента.
    actionability: interpretation_only
    confidence: moderate
    audience: [individual, educator, clinician, researcher]
    claim_ids: [pmm:claim:emotion-episode-is-multicomponent-process, pmm:claim:emotion-measures-are-not-interchangeable, pmm:claim:appraisal-patterns-associated-with-emotion-reports, pmm:claim:appraisal-guided-coordination-is-mechanism-hypothesis]
    source_ids: [pmm:source:mauss-robinson-2009-emotion-measures, pmm:source:yeo-ong-2024-appraisal-meta]
    provenance: *provenance

  - id: pmm:application:test-truthful-reappraisal-as-one-route
    family_id: reappraisal
    title:
      en: Test a truthful reinterpretation as one possible route
      ru: Проверьте правдивое переосмысление как один из возможных путей
    practical_question:
      en: When might checking the meaning of a situation help?
      ru: Когда может помочь проверка смысла ситуации?
    action:
      en: State the current interpretation and one observable prediction. Check available evidence and generate a realistic alternative meaning without denying danger or loss. Compare the predicted feeling, action, and consequence with what actually happens; if meaning is not the active link, test another channel.
      ru: Сформулируйте текущую интерпретацию и один наблюдаемый прогноз. Проверьте доступные факты и создайте реалистичный альтернативный смысл, не отрицая опасность или потерю. Сравните ожидаемое переживание, действие и последствие с тем, что произошло; если смысл не является действующим звеном, проверяйте другой канал.
    expected_change:
      en: Possibly lower self-reported negative emotion or a different available action in situations where the original interpretation is incomplete and a credible alternative can be tested.
      ru: Возможно меньшее субъективное негативное переживание или появление другого доступного действия в ситуациях, где исходная интерпретация неполна и реалистичную альтернативу можно проверить.
    evidence_basis:
      en: Randomized reappraisal instructions reduce reported negative emotion in bounded laboratory tasks, while appraisal-emotion associations and the proposed coordination mechanism do not guarantee the same effect in daily life.
      ru: Рандомизированные инструкции переоценки уменьшают сообщаемую негативную эмоцию в ограниченных лабораторных заданиях, но связи оценки с эмоцией и предполагаемый механизм координации не гарантируют такой же эффект в повседневной жизни.
    applicability:
      en: Ordinary low-risk situations with uncertain or incomplete interpretations and an observable way to check the prediction.
      ru: Обычные низкорисковые ситуации с неопределённой или неполной интерпретацией и наблюдаемым способом проверить прогноз.
    not_established:
      en: Reappraisal is not universally better than acceptance, problem solving, exposure, support, environmental change, or protection, and it need not change physiology or feeling for every person.
      ru: Переоценка не всегда лучше принятия, решения проблемы, экспозиции, поддержки, изменения среды или защиты и не обязана менять физиологию или переживание у каждого человека.
    safety_note:
      en: Do not reinterpret away credible danger, abuse, urgent medical symptoms, or another person's boundary.
      ru: Не переосмысливайте как несущественные реальную опасность, насилие, срочные медицинские симптомы или границы другого человека.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [individual, clinician, educator, researcher]
    claim_ids: [pmm:claim:reappraisal-reduces-reported-negative-emotion, pmm:claim:meaning-reinterpretation-mechanism-hypothesis]
    source_ids: [pmm:source:gross-1998-emotion-regulation]
    provenance: *provenance

  - id: pmm:application:adjust-context-from-temperament-profile
    family_id: temperament
    title:
      en: Use a temperament profile to adjust demands, not define identity
      ru: Используйте профиль темперамента для настройки условий, а не для определения личности
    practical_question:
      en: How can recurring reactivity or regulation difficulties guide a useful, testable change?
      ru: Как повторяющиеся трудности реактивности или саморегуляции могут подсказать полезное проверяемое изменение?
    action:
      en: >-
        Observe the same concrete sequence across several occasions and, when possible, informants: situation, immediate reaction, attempted regulation, action, and consequence. Select one modifiable mismatch such as unpredictability, stimulus intensity, transition time, missing choice, skill demand, or recovery support; change only that part and track one observable outcome.
      ru: >-
        Наблюдайте одну конкретную последовательность в нескольких случаях и, по возможности, у нескольких информантов: ситуация, немедленная реакция, попытка регуляции, действие и последствие. Выберите одно изменяемое несоответствие, например непредсказуемость, интенсивность стимула, нехватку времени на переход, отсутствие выбора, слишком высокое требование к навыку или недостаток помощи в восстановлении; измените только это звено и отслеживайте один наблюдаемый результат.
    expected_change:
      en: Better fit between demands and current regulation, visible as a prespecified change in behavior, recovery, participation, or task completion rather than replacement of a trait.
      ru: Лучшее соответствие требований текущим возможностям регуляции, заметное по заранее выбранному изменению поведения, восстановления, участия или выполнения задачи, а не по «замене» черты.
    evidence_basis:
      en: Questionnaire and longitudinal evidence supports dimensional measurement and imperfect continuity. This pack does not contain direct evidence that the proposed context adjustment will work for a particular person.
      ru: Опросниковые и продольные данные поддерживают размерное измерение и неполную устойчивость. В этом пакете нет прямого доказательства, что выбранное изменение условий поможет конкретному человеку.
    applicability:
      en: Repeated low-risk patterns where the situation and one concrete outcome can be observed, and where environmental adjustment does not remove a necessary safety boundary.
      ru: Повторяющиеся низкорисковые ситуации, в которых можно наблюдать условия и один конкретный результат, а изменение среды не устраняет необходимую границу безопасности.
    not_established:
      en: A temperament score does not diagnose a disorder, prescribe treatment, reveal one cause, or justify assuming that behavior is fixed.
      ru: Балл темперамента не диагностирует расстройство, не назначает лечение, не выявляет единственную причину и не оправдывает представление о неизменности поведения.
    safety_note:
      en: Do not use a temperament label to punish, stigmatize, lower all expectations, withhold accommodations, or overlook medical, developmental, trauma-related, or environmental causes.
      ru: Не используйте ярлык темперамента для наказания, стигматизации, общего снижения ожиданий, отказа в разумной поддержке или игнорирования медицинских, развивающих, травматических и средовых причин.
    actionability: interpretation_only
    confidence: low
    audience: [individual, educator, clinician, researcher]
    claim_ids: [pmm:claim:temperament-is-dimensional-and-developmental, pmm:claim:cbq-short-forms-estimate-dimensional-profile, pmm:claim:trait-rank-order-stability-increases-with-age, pmm:claim:adolescent-temperament-associated-with-adult-personality, pmm:claim:temperament-developmental-transaction-is-hypothesis]
    source_ids: [pmm:source:putnam-rothbart-2006-cbq-short, pmm:source:roberts-delvecchio-2000-stability, pmm:source:ringwald-2026-temperament-personality]
    provenance: *provenance

  - id: pmm:application:test-one-self-regulation-link
    family_id: self-regulation
    title: {en: Test one link in the goal-action-feedback loop, ru: Проверяйте одно звено петли «цель–действие–обратная связь»}
    practical_question:
      en: Where is a concrete goal repeatedly failing to become effective action?
      ru: На каком звене конкретная цель регулярно не превращается в результативное действие?
    action:
      en: >-
        Specify one observable goal and time window. Record the current result without judgment, then identify one candidate bottleneck: unclear goal, inaccurate monitoring, unavailable action, excessive friction, competing goal, missing skill, delayed consequence, or unhelpful feedback. Change one bottleneck and compare the next prespecified result with baseline.
      ru: >-
        Задайте одну наблюдаемую цель и срок. Без оценки запишите текущий результат, затем выберите одно предполагаемое узкое место: неясная цель, неточный мониторинг, недоступное действие, лишнее трение, конкурирующая цель, нехватка навыка, отложенное последствие или бесполезная обратная связь. Измените одно звено и сравните следующий заранее выбранный результат с исходным уровнем.
    expected_change:
      en: Better information about which link is modifiable and whether changing it improves the selected behavior or outcome, rather than a global judgment about willpower.
      ru: Более точное понимание изменяемого звена и того, улучшает ли его изменение выбранное поведение или результат, вместо общей оценки силы воли.
    evidence_basis:
      en: Randomized monitoring interventions improved attainment moderately on average, while generic feedback had highly variable and sometimes harmful performance effects. The complete feedback-control loop remains a mechanism hypothesis.
      ru: Рандомизированные вмешательства мониторинга в среднем умеренно улучшали достижение целей, тогда как общая обратная связь давала сильно различающиеся и иногда ухудшающие результат эффекты. Полная петля контроля остаётся гипотезой механизма.
    applicability:
      en: Low-risk, personally acceptable goals with an observable behavior or outcome and enough repeated opportunities to compare change.
      ru: Низкорисковые и приемлемые для человека цели с наблюдаемым поведением или результатом и достаточным числом повторений для сравнения.
    not_established:
      en: Monitoring is not sufficient for every goal, more feedback is not always better, and failure does not prove deficient self-control.
      ru: Мониторинга недостаточно для любой цели, больше обратной связи не всегда лучше, а неудача не доказывает дефицит самоконтроля.
    safety_note:
      en: Do not intensify monitoring when it reinforces compulsive checking, disordered eating, self-punishment, coercive surveillance, or unsafe persistence; change or abandon harmful goals and seek appropriate help.
      ru: Не усиливайте мониторинг, если он поддерживает навязчивые проверки, расстройство пищевого поведения, самонаказание, принудительный надзор или опасную настойчивость; вредную цель следует изменить или оставить и при необходимости обратиться за помощью.
    actionability: transfer_uncertain
    confidence: moderate
    audience: [individual, educator, clinician, researcher, designer]
    claim_ids: [pmm:claim:self-regulation-cycle-is-theoretical-framework, pmm:claim:monitoring-interventions-improve-goal-attainment, pmm:claim:monitoring-frequency-statistically-mediates-attainment, pmm:claim:generic-feedback-has-mixed-performance-effects, pmm:claim:goal-discrepancy-loop-is-mechanism-hypothesis]
    source_ids: [pmm:source:carver-2019-control-theory, pmm:source:harkin-2016-monitoring, pmm:source:kluger-denisi-1996-feedback]
    provenance: *provenance
