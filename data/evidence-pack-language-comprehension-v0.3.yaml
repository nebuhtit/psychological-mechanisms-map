    provenance: *provenance

claims:
  - id: pmm:claim:language-comprehension-extracts-communicative-meaning
    claim_type: definition
    statement: Language comprehension includes deriving communicative meaning from signals such as speech, written text, or sign, while isolated written-word recognition is only one narrow component.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: The scope follows common usage and the linked Cognitive Atlas entry, but that collaborative record is marked Unreviewed and does not settle a complete language ontology.
    scope:
      population: Humans receiving conventional linguistic or symbolic communication.
      species: [human]
      context_ids: [pmm:context:semantic-priming-lexical-decision-task, pmm:context:paired-word-classification-task]
      temporal_scope: Signal reception through availability of task-relevant meaning.
    defined_object_id: pmm:construct:language-comprehension
    source_ids: [pmm:source:cognitive-atlas-language-comprehension-2026]
    evidence_ids: []
    limitations:
      - The definition does not establish that lexical decision measures broad comprehension or specify a unique mechanism.
    provenance: *provenance

  - id: pmm:claim:semantic-relatedness-changes-lexical-decision-latency
    claim_type: causal_effect
    statement: In controlled semantic-priming protocols, changing a preceding prime from unrelated or neutral to semantically related changed target word-classification latency under the tested timing and task conditions.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: Foundational controlled experiments show robust within-protocol priming contrasts, but protocol variants and task-dependent processes constrain generalization.
    scope:
      population: Human participants in the Meyer and Schvaneveldt and Neely laboratory word-classification experiments.
      species: [human]
      context_ids: [pmm:context:semantic-priming-lexical-decision-task]
      temporal_scope: Prime presentation through target word or nonword response.
      boundary_conditions:
        - The reported visual word materials, prime-target relations, timing conditions, instructions, and speeded classification procedures.
    exposure_id: pmm:intervention:semantic-relatedness-timing-manipulation
    outcome_id: pmm:outcome:lexical-decision-response-latency
    causal_estimand: Within-protocol difference in target-classification latency produced by experimentally changing prime-target semantic relation.
    identification_strategy: controlled_contingency
    temporal_ordering: The experimenter-defined prime relation and timing preceded the target response.
    causal_assumptions:
      consistency: Each condition follows the reported stimulus construction, timing, instruction, and latency-scoring procedure.
      exchangeability: Controlled condition assignment and counterbalancing reduce stable participant and item confounding within each reported experiment.
      positivity: Participants or counterbalanced item sets represented the compared related, unrelated, or neutral conditions.
      interference: One participant's trial responses are assumed not to alter another participant's responses.
      assessment: partly_tested
    evidence_ids: [pmm:evidence:meyer-schvaneveldt-1971-priming, pmm:evidence:neely-1976-priming]
    limitations:
      - The causal effect is on response latency in these tasks, not direct proof of one lexical or semantic mechanism.
      - Meyer and Schvaneveldt used simultaneous word pairs, whereas later semantic-priming protocols often use a sequential prime and target.
    provenance: *provenance

  - id: pmm:claim:diffusion-model-decomposes-lexical-decisions
    claim_type: association
    statement: In Ratcliff, Gomez, and McKoon's lexical-decision experiments, a diffusion model jointly accounted for accuracy and correct and error response-time distributions using separable evidence-accumulation and decision components.
    epistemic_status: supported
    confidence:
      level: moderate
      rationale: The model explained multiple experimental manipulations and distributional outcomes, but parameter interpretation remains conditional on model specification and comparison.
    scope:
      population: Human participants completing lexical-decision experiments varying word frequency, list composition, and nonword type.
      species: [human]
      context_ids: [pmm:context:semantic-priming-lexical-decision-task]
      temporal_scope: Target presentation through word or nonword response.
      boundary_conditions:
        - The lexical-decision datasets and diffusion-model specification reported by Ratcliff, Gomez, and McKoon.
    exposure_id: pmm:behavior:word-nonword-classification
    outcome_id: pmm:measurement:lexical-decision-diffusion-profile
    estimate:
      metric: joint model account of response proportions and correct and error response-time distributions
      value_status: qualitative_only
      direction: mixed
      notes: Word frequency, list composition, and nonword properties were represented primarily through changes in drift rate under the fitted model.
    confounding_note: Model parameters can trade off, depend on preprocessing and architecture, and need not map one-to-one onto psychological or neural processes.
    evidence_ids: [pmm:evidence:ratcliff-2004-diffusion-model]
    limitations:
      - Model fit is not a causal intervention on evidence accumulation and does not validate the diffusion profile as a unique measure of lexical access.
    provenance: *provenance

  - id: pmm:claim:automatic-preactivation-may-contribute-to-priming
    claim_type: mechanism_hypothesis
    statement: Rapid automatic preactivation of related target information may contribute to semantic priming, especially when timing and task conditions constrain deliberate strategies.
    epistemic_status: proposed
    confidence:
      level: low
      rationale: Short-latency and limited-awareness findings are compatible with automatic contribution, but prime identification, task requirements, and alternative distributed or post-lexical processes prevent unique identification.
    scope:
      population: Humans completing semantic-priming tasks with brief or short-interval primes.
      species: [human]
      context_ids: [pmm:context:semantic-priming-lexical-decision-task]
      temporal_scope: Prime processing before and during early target processing.
      boundary_conditions:
        - Prime visibility, stimulus-onset asynchrony, relatedness proportion, target properties, and task demands are measured or controlled.
    mechanism_id: pmm:mechanism:automatic-semantic-preactivation
    exposure_id: pmm:intervention:semantic-relatedness-timing-manipulation
    outcome_id: pmm:outcome:lexical-decision-response-latency
    temporal_ordering: Prime processing must alter target availability before the task decision is completed.
    falsifiable_boundary: The account is weakened if priming disappears whenever expectancy and response matching are controlled, or if competing models predict held-out trial distributions better without preactivation.
    evidence_ids: [pmm:evidence:mangat-2026-automatic-strategic-review]
    limitations:
      - Automatic spreading activation, distributed feature overlap, and other early processes are not distinguished by the observed latency contrast alone.
    provenance: *provenance

  - id: pmm:claim:strategic-matching-may-contribute-to-priming
    claim_type: mechanism_hypothesis
    statement: Strategic expectancy or retrospective prime-target matching may contribute to semantic priming when timing, prime visibility, list structure, and the required response make the relation useful.
    epistemic_status: proposed
    confidence:
      level: moderate
      rationale: Timing-dependent facilitation and inhibition plus task-sensitive review evidence support strategic contribution, but expectancy and post-lexical matching are not always separately identified.
    scope:
      population: Humans completing visible-prime semantic-priming tasks, especially at longer prime-target intervals or high relatedness proportions.
      species: [human]
      context_ids: [pmm:context:semantic-priming-lexical-decision-task]
      temporal_scope: Prime identification through target decision and response selection.
      boundary_conditions:
        - The protocol allows conscious prime processing or makes prime-target relation informative for the required decision.
    mechanism_id: pmm:mechanism:strategic-postlexical-matching
    exposure_id: pmm:intervention:semantic-relatedness-timing-manipulation
    outcome_id: pmm:outcome:lexical-decision-response-latency
    temporal_ordering: Expectancy can develop before the target, while retrospective matching occurs after target information is available but before the response.
    falsifiable_boundary: The account is weakened when priming persists under conditions that reliably prevent prime identification and relation-based response bias and when strategic models fail held-out predictions.
    evidence_ids: [pmm:evidence:neely-1976-process-timing, pmm:evidence:mangat-2026-automatic-strategic-review]
    limitations:
      - Grouping expectancy and retrospective matching is provisional; future packs should represent and test them separately.
    provenance: *provenance

evidence:
  - id: pmm:evidence:meyer-schvaneveldt-1971-priming
    claim_ids: [pmm:claim:semantic-relatedness-changes-lexical-decision-latency]
    source_id: pmm:source:meyer-schvaneveldt-1971
    extraction_locator: PubMed abstract and report of two experiments comparing responses to semantically related and unrelated simultaneously presented string pairs.
    evidence_kind: controlled_experiment
    design: Two speeded classification experiments manipulating semantic relation within simultaneously presented word pairs.
    population: Human participants in the two foundational paired-word experiments; sample size not extracted from the accessible bibliographic record in this pilot.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect:
      metric: correct affirmative classification latency for related versus unrelated word pairs
      value_status: qualitative_only
      direction: negative
      notes: Related pairs were classified faster than unrelated pairs in the reported procedures.
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: not_reported, replication: conceptual_replication}
    summary: Semantically related word pairs produced faster correct classifications than unrelated pairs in two foundational experiments.
    limitations:
      - Small historical sample, no preregistration, and simultaneous paired presentation differ from many later sequential priming tasks.
    provenance: *provenance

  - id: pmm:evidence:neely-1976-priming
    claim_ids: [pmm:claim:semantic-relatedness-changes-lexical-decision-latency]
    source_id: pmm:source:neely-1976
    extraction_locator: PubMed abstract and experiment report varying prime-target relation and prime duration before a speeded word-nonword decision.
    evidence_kind: controlled_experiment
    design: Sequential semantic-priming lexical-decision experiment with related, unrelated, and neutral primes at several prime durations.
    population: Human participants completing speeded word-nonword decisions; sample size not extracted in this pilot.
    species: [human]
    inference_support: causal_effect
    support_direction: supports
    causal_support: direct
    effect:
      metric: target word-classification latency by prime relation and duration
      value_status: qualitative_only
      direction: mixed
      notes: Related primes facilitated and unrelated primes inhibited responses relative to a neutral condition, with timing-dependent patterns.
    domains: {directness: direct, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: not_reported, replication: conceptual_replication}
    summary: Manipulated prime relation changed target response latency and duration influenced the pattern of facilitation and inhibition.
    limitations:
      - The effect does not uniquely distinguish automatic activation, expectancy, and decision-related matching.
    provenance: *provenance

  - id: pmm:evidence:ratcliff-2004-diffusion-model
    claim_ids: [pmm:claim:diffusion-model-decomposes-lexical-decisions]
    source_id: pmm:source:ratcliff-gomez-mckoon-2004
    extraction_locator: PubMed abstract and open full-text model analyses across lexical-decision experiments.
    evidence_kind: computational_model
    design: Diffusion-model fit to response proportions and correct and error response-time distributions under word-frequency, list-composition, and nonword manipulations.
    population: Human participants in lexical-decision experiments reported and modeled in the article.
    species: [human]
    inference_support: association
    support_direction: supports
    causal_support: none
    effect:
      metric: diffusion-model account of behavioral distributions and experimental effects
      value_status: qualitative_only
      direction: mixed
      notes: The fitted model represented major lexical manipulations through drift-rate differences while jointly accounting for accuracy and latency distributions.
    domains: {directness: partially_indirect, risk_of_bias: some_concerns, consistency: mostly_consistent, precision: adequate, replication: conceptual_replication}
    summary: A diffusion model provided a joint quantitative account of lexical-decision choices and response-time distributions across several manipulations.
    limitations:
      - Model adequacy does not establish a unique cognitive architecture or direct measure of lexical access.
    provenance: *provenance

  - id: pmm:evidence:neely-1976-process-timing
    claim_ids: [pmm:claim:strategic-matching-may-contribute-to-priming]
    source_id: pmm:source:neely-1976
    extraction_locator: Interpretation of prime-duration-dependent facilitation and inhibition in the article abstract and experiment report.
    evidence_kind: controlled_experiment
    design: Sequential priming experiment using prime duration to test facilitatory and inhibitory retrieval processes.
    population: Human participants completing speeded word-nonword decisions; sample size not extracted in this pilot.
    species: [human]
    inference_support: mechanism
    support_direction: supports
    causal_support: indirect
    effect:
      metric: change in facilitation and inhibition pattern across prime durations
      value_status: qualitative_only
      direction: mixed
      notes: Duration-dependent effects were interpreted as evidence that more than one process contributes to semantic priming.
    domains: {directness: partially_indirect, risk_of_bias: some_concerns, consistency: single_source, precision: not_reported, replication: conceptual_replication}
    summary: Timing changed the priming pattern in a way compatible with a slower strategic contribution in addition to rapid facilitation.
    limitations:
      - Timing interactions are indirect process evidence and do not separately identify expectancy from retrospective matching.
    provenance: *provenance

  - id: pmm:evidence:mangat-2026-automatic-strategic-review
    claim_ids: [pmm:claim:automatic-preactivation-may-contribute-to-priming, pmm:claim:strategic-matching-may-contribute-to-priming]
    source_id: pmm:source:mangat-taikh-gagne-spalding-2026
    extraction_locator: Abstract and sections reviewing automatic processing, expectancy generation, post-lexical integration, timing, task, and proposed integrated accounts.
    evidence_kind: narrative_review
    design: Integrative narrative review drawing on reviews, meta-analyses, and original experiments concerning prime and task characteristics.
    population: Human semantic-priming studies across lexical decision, naming, semantic categorization, and related tasks.
    species: [human]
    inference_support: mechanism
    support_direction: mixed
    causal_support: indirect
    effect:
      metric: boundary conditions for automatic and strategic contributions to semantic priming
      value_status: qualitative_only
      direction: mixed
      notes: Prime properties, relation, modality, visibility, timing, relatedness proportion, and task can alter the balance of candidate processes.
    domains: {directness: partially_indirect, risk_of_bias: some_concerns, consistency: mixed, precision: not_reported, replication: conceptual_replication}
    summary: The review concludes that both automatic and strategic processes can contribute and that a priming effect alone does not identify one mechanism.
    limitations:
      - Narrative integration is not a preregistered systematic review and combines heterogeneous paradigms and operational definitions.
    provenance: *provenance

