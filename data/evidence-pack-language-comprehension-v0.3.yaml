pmm_version: 0.3.4
document_type: pmm_dataset
dataset_id: pmm:dataset:language-comprehension-primary-evidence-v0-3
metadata:
  title: Primary evidence pack for visual word recognition and semantic priming
  description: Separates broad language comprehension, visual lexical access, a lexical-decision task, prime-target manipulations, observable responses, performance measures, model parameters, and competing process hypotheses.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.1.0
    created_at: '2026-08-26T21:00:00+03:00'
    modified_at: '2026-08-26T21:00:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
namespaces:
  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmid: https://pubmed.ncbi.nlm.nih.gov/

objects:
  - id: pmm:construct:language-comprehension
    type: Construct
    label: Language comprehension
    definition: Capacity to derive communicative meaning from linguistic or other conventional symbolic signals, including spoken, written, or signed forms.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - This broad construct includes more than recognizing isolated written words; sentence, discourse, pragmatic, and sign-language comprehension are not modeled in this pilot.
      - Comprehension is not identical to language production, a lexical-decision response, or response time.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/concept/id/trm_4a3fd79d0a775/
        external_label: language comprehension
        mapping_relation: close_match
        mapping_status: provisional
        rationale: Scope is close, but the Cognitive Atlas record is marked Unreviewed and PMM does not import its hierarchy as settled.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:construct:visual-lexical-access
    type: Construct
    label: Visual lexical access
    definition: Access to stored lexical information sufficient to distinguish a familiar written word form from a nonword and make task-relevant information available.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - This restricted construct concerns written word forms and does not assume that lexical access is one indivisible stage.
      - A lexical-decision response can also depend on orthography, semantics, decision criteria, motor execution, and task strategy.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/concept/id/trm_4a3fd79d0b80f/
        external_label: lexical access
        mapping_relation: related_match
        mapping_status: provisional
        rationale: The linked unreviewed Cognitive Atlas definition is framed around spoken input, whereas this PMM construct is deliberately restricted to visual word recognition.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:context:semantic-priming-lexical-decision-task
    type: Context
    label: Semantic-priming lexical-decision task
    definition: Experimental task in which a prime precedes a target letter string and the participant classifies the target as a word or nonword while prime-target relation and timing can be varied.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      prime_visibility: masked or unmasked
      prime_target_relation: semantically related, unrelated, or neutral
      stimulus_onset_asynchrony: protocol-defined interval between prime and target onset
      target_lexical_status: word or nonword
      response_rule: classify the target string as a word or nonword
    scope: Human laboratory visual lexical-decision protocols with an experimentally presented prime and target.
    boundary_notes:
      - The task is not language comprehension itself and does not isolate one stage of word recognition.
      - Naming and semantic-categorization tasks can produce different priming patterns because they require different decisions.
    external_mappings:
      - system: CognitiveAtlas
        external_iri: https://www.cognitiveatlas.org/task/id/tsk_4a57abb949b38/
        external_label: lexical decision task
        mapping_relation: narrow_match
        mapping_status: provisional
        rationale: The PMM context is a semantic-priming implementation of the broader unreviewed Cognitive Atlas lexical-decision task record.
        accessed_at: '2026-08-26'
    provenance: *provenance

  - id: pmm:context:paired-word-classification-task
    type: Context
    label: Simultaneous paired-word classification task
    definition: Experimental task in which two letter strings are presented together and the participant rapidly classifies whether both are words or whether their lexical status is the same.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      presentation: simultaneous pair
      pair_relation: semantically related or unrelated
      lexical_composition: two words or a protocol-defined pair containing a nonword
      response_rule: classify the lexical status of the pair
    scope: The simultaneous paired-string procedures reported by Meyer and Schvaneveldt in 1971.
    boundary_notes:
      - This historical paired procedure is not interchangeable with a sequential prime-target lexical-decision task.
      - Faster paired classification does not reveal which member was recognized first or identify one retrieval mechanism.
    provenance: *provenance

  - id: pmm:intervention:semantic-relatedness-timing-manipulation
    type: Intervention
    label: Prime-target relatedness and timing manipulation
    definition: Experimental variation of the semantic relation between prime and target and the interval or visibility conditions under which the prime can influence target processing.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:behavior:word-nonword-classification
      - pmm:outcome:lexical-decision-response-latency
    delivery: Present related, unrelated, or neutral primes before target words or nonwords at protocol-defined durations and stimulus-onset asynchronies.
    intended_direction: test
    provenance: *provenance

  - id: pmm:behavior:word-nonword-classification
    type: Behavior
    label: Word-nonword classification response
    definition: Observable response classifying a target letter string as an existing word or a nonword under the task instructions.
    ontological_level: type
    curation_status: accepted
    behavior_kind: action
    observability: direct
    actor_scope: person
    response_topography: Protocol-defined keypress or verbal response indicating word or nonword.
    function_note: The same response can reflect lexical evidence, semantic relatedness, response bias, speed-accuracy setting, and motor execution.
    provenance: *provenance

  - id: pmm:outcome:lexical-decision-response-latency
    type: Outcome
    label: Lexical-decision response latency
    definition: Elapsed time from protocol-defined target onset to the participant's word or nonword response, usually analyzed for correct trials.
    ontological_level: type
    curation_status: accepted
    outcome_kind: performance
    valence: not_applicable
    boundary_notes:
      - A faster response is not a direct observation of comprehension, lexical access, or spreading activation.
      - Latency interpretation depends on accuracy, exclusions, response deadline, device, and distributional analysis.
    provenance: *provenance

  - id: pmm:measurement:condition-specific-lexical-decision-performance
    type: Measurement
    label: Condition-specific lexical-decision performance
    definition: Accuracy and response-latency distributions summarized separately for prime relation, timing, visibility, target lexical status, and other prespecified conditions.
    ontological_level: type
    curation_status: accepted
    measurement_kind: behavioral_task
    target_ids:
      - pmm:construct:visual-lexical-access
      - pmm:behavior:word-nonword-classification
      - pmm:outcome:lexical-decision-response-latency
    method: Record trial-level responses and latency, apply declared exclusions, and estimate related-minus-unrelated or neutral contrasts jointly with accuracy.
    unit_of_analysis: behavior
    result_type: continuous
    boundary_notes:
      - Mean correct-trial response time can hide speed-accuracy tradeoffs and distributional differences.
    provenance: *provenance

  - id: pmm:measurement:lexical-decision-diffusion-profile
    type: Measurement
    label: Lexical-decision diffusion profile
    definition: Model-based estimates separating evidence accumulation, response threshold, starting bias, and nondecision time from lexical-decision choices and response-time distributions.
    ontological_level: type
    curation_status: provisional
    measurement_kind: computational_parameter
    target_ids:
      - pmm:behavior:word-nonword-classification
      - pmm:outcome:lexical-decision-response-latency
    method: Fit a declared diffusion model jointly to correct and error response-time distributions and response proportions across conditions.
    unit_of_analysis: behavior
    result_type: model_parameter
    boundary_notes:
      - Drift rate and nondecision time are model-dependent parameters, not direct observations of lexical access or unique biological mechanisms.
      - Adequate fit does not prove that the fitted decomposition is the only psychologically valid account.
    provenance: *provenance

  - id: pmm:mechanism:automatic-semantic-preactivation
    type: Mechanism
    label: Automatic semantic preactivation
    definition: Proposed rapid process by which processing a prime makes related target information more available before the target decision without requiring deliberate prediction.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - {role: processed prime, object_id: pmm:intervention:semantic-relatedness-timing-manipulation}
      - {role: target response, object_id: pmm:behavior:word-nonword-classification}
      - {role: timing-sensitive observation, object_id: pmm:measurement:condition-specific-lexical-decision-performance}
    realization_conditions:
      - Prime information is processed early enough to affect target processing.
      - Strategic expectancy and post-lexical matching are constrained or measured rather than assumed absent.
    boundary_notes:
      - A semantic-priming effect does not uniquely identify spreading activation, a localist network, or an automatic process.
    provenance: *provenance

  - id: pmm:mechanism:strategic-postlexical-matching
    type: Mechanism
    label: Strategic expectancy or post-lexical matching
    definition: Proposed task-sensitive process in which participants predict likely targets or use the detected prime-target relation to influence a decision after target information becomes available.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - {role: prime-target relation, object_id: pmm:intervention:semantic-relatedness-timing-manipulation}
      - {role: lexical decision, object_id: pmm:behavior:word-nonword-classification}
      - {role: condition-sensitive observation, object_id: pmm:measurement:condition-specific-lexical-decision-performance}
    realization_conditions:
      - The protocol provides enough time, prime visibility, or relatedness structure for strategic use of prime information.
      - The response task permits semantic relation to bias the required decision.
    boundary_notes:
      - Expectancy before target identification and retrospective matching after lexical access are related but distinguishable candidate processes grouped here only for this pilot comparison.
    provenance: *provenance

relations:
  - id: pmm:relation:visual-lexical-access-measured-by-performance
    subject_id: pmm:construct:visual-lexical-access
