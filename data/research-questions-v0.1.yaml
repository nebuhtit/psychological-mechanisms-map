  - id: pmm:research-question:cbt-person-specific-process-selection
    family_id: cbt-formulation
    question:
      en: Which measured process should be targeted first for a particular person and goal, and does changing it improve the predicted outcome?
      ru: На какой измеренный процесс следует воздействовать первым для конкретного человека и цели и улучшает ли его изменение ожидаемый результат?
    why_open:
      en: CBT packages are effective for some conditions, but package efficacy and statistical mediation do not identify the dominant causal process in an individual's maintenance network.
      ru: Пакеты КПТ эффективны при некоторых состояниях, но эффективность пакета и статистическая медиация не выявляют главный причинный процесс в индивидуальной поддерживающей сети.
    what_would_help:
      en: High-frequency idiographic measurement, randomized or sequential process interventions, prespecified outcomes, and comparison of competing functional networks.
      ru: Частые идиографические измерения, рандомизированные или последовательные воздействия на процессы, заранее заданные исходы и сравнение конкурирующих функциональных сетей.
    question_kind: causal
    status: open
    display_prominence: peripheral
    about_ids: [pmm:mechanism:reciprocal-cbt-maintenance-cycle, pmm:intervention:behavioral-experiment, pmm:outcome:cbt-short-long-consequences]
    source_ids: [pmm:source:moreno-peral-2020-mediators, pmm:source:cuijpers-2023-cbt-depression]
    provenance: *provenance

  - id: pmm:research-question:social-learning-mechanism-and-transfer
    family_id: social-learning
    question:
      en: Which measured process explains durable transfer after observing a model, rather than only immediate matching performance?
      ru: Какой измеренный процесс объясняет устойчивый перенос после наблюдения модели, а не только немедленное похожее выполнение?
    why_open:
      en: Similar behavior after observation can reflect attention, response facilitation, outcome learning, emulation, exact imitation, direct task incentives, or demand effects, and the classic studies measured immediate performance.
      ru: Похожее поведение после наблюдения может отражать внимание, облегчение уже доступной реакции, обучение исходу, достижение той же цели другим способом, точное подражание, прямые стимулы задания или ожидания участника, а классические исследования измеряли немедленное выполнение.
    what_would_help:
      en: Preregistered experiments with no-model and nonmatching controls, separate acquisition and performance probes, delayed tests, changed materials and contexts, and competing process-model comparison.
      ru: Пререгистрированные эксперименты с условиями без модели и с непохожими действиями, отдельными проверками усвоения и выполнения, отсроченными тестами, новым материалом и контекстом и сравнением конкурирующих моделей процесса.
    question_kind: mechanism
    status: open
    display_prominence: peripheral
    about_ids: [pmm:mechanism:observation-performance-selection, pmm:measurement:spontaneous-imitation-coding, pmm:measurement:incentive-assisted-reproduction]
    source_ids: [pmm:source:bandura-1965-model-consequences, pmm:source:heyes-2012-social-learning, pmm:source:greer-2006-observational-learning]
    provenance: *provenance

  - id: pmm:research-question:emotion-within-person-component-dynamics
    family_id: emotion-process
    question:
      en: For a particular person and event, which change in appraisal, bodily response, action tendency, behavior, or context causally changes which later emotion component?
      ru: Какое изменение оценки ситуации, телесной реакции, побуждения, поведения или контекста причинно меняет какой последующий компонент эмоции у конкретного человека и в конкретном событии?
    why_open:
      en: Appraisal-emotion associations are broad but nonunique, response channels only partly converge, and most studies do not repeatedly measure and manipulate competing components within the same person.
      ru: Связи оценки ситуации с эмоциями широки, но не однозначны, каналы реакции совпадают лишь частично, а большинство исследований не измеряет и не изменяет конкурирующие компоненты многократно у одного человека.
    what_would_help:
      en: Preregistered intensive longitudinal and experimental studies with independent appraisal measures, channel-specific outcomes, temporal ordering, safe sequential interventions, and comparison of appraisal, bodily, learning, and constructionist models.
      ru: Пререгистрированные интенсивные продольные и экспериментальные исследования с независимыми измерениями оценки ситуации, отдельными исходами для каждого канала, временным порядком, безопасными последовательными воздействиями и сравнением оценочных, телесных, обучающих и конструкционистских моделей.
    question_kind: causal
    status: open
    display_prominence: peripheral
    about_ids: [pmm:mechanism:appraisal-guided-component-coordination, pmm:construct:event-appraisal-profile, pmm:state:subjective-emotional-feeling, pmm:state:emotion-related-physiological-response, pmm:behavior:emotion-related-action]
    source_ids: [pmm:source:yeo-ong-2024-appraisal-meta, pmm:source:scherer-moors-2019-emotion-process, pmm:source:mauss-robinson-2009-emotion-measures]
    provenance: *provenance

  - id: pmm:research-question:temperament-person-environment-causal-transactions
    family_id: temperament
    question:
      en: Which modifiable environmental or regulatory process changes within-person behavior and development, for whom, at which age, and in which context?
      ru: Какой изменяемый процесс среды или саморегуляции меняет поведение и развитие конкретного человека, для кого, в каком возрасте и контексте?
    why_open:
      en: Longitudinal stability and cross-age associations are observational, informants and measures are not interchangeable, and genetic or environmental variance components do not identify a concrete developmental process.
      ru: Продольная устойчивость и связи между возрастами наблюдательны, информанты и методы не взаимозаменяемы, а доли генетической и средовой дисперсии не выявляют конкретный процесс развития.
    what_would_help:
      en: Preregistered repeated multi-informant measurement, age-appropriate measurement-invariance tests, direct behavioral observation, safe sequential or randomized context changes, and out-of-sample replication.
      ru: Пререгистрированные повторные измерения у нескольких информантов, проверка сопоставимости методик по возрастам, прямое наблюдение поведения, безопасные последовательные или рандомизированные изменения условий и воспроизведение на новых выборках.
    question_kind: causal
    status: open
    display_prominence: peripheral
    about_ids: [pmm:mechanism:developmental-temperament-transaction, pmm:construct:developmental-temperament-dimensions, pmm:state:context-specific-temperamental-reactivity, pmm:behavior:observed-temperament-relevant-response]
    source_ids: [pmm:source:roberts-delvecchio-2000-stability, pmm:source:ringwald-2026-temperament-personality, pmm:source:briley-tucker-drob-2014-continuity]
    provenance: *provenance

  - id: pmm:research-question:self-regulation-person-specific-bottleneck
    family_id: self-regulation
    question:
      en: Which measured bottleneck in a person's goal-action-feedback sequence should be changed first, and does that change improve the prespecified outcome without creating another cost?
      ru: Какое измеренное узкое место в индивидуальной цепи «цель–действие–обратная связь» следует менять первым и улучшает ли это заранее выбранный результат без нового ущерба?
    why_open:
      en: Meta-analyses estimate average intervention effects, but goal conflict, measurement accuracy, available skills, habits, affect, context, feedback content, and decisions to revise or abandon goals vary within and between people.
      ru: Метаанализы оценивают средние эффекты, но конфликт целей, точность измерения, доступные навыки, привычки, эмоции, контекст, содержание обратной связи и решение изменить или оставить цель различаются внутри одного человека и между людьми.
    what_would_help:
      en: Preregistered intensive within-person measurement followed by safe sequential randomization of monitoring, environmental friction, action planning, feedback, and goal revision with competing process models.
      ru: Пререгистрированные частые внутрииндивидуальные измерения с последующей безопасной последовательной рандомизацией мониторинга, трения среды, планирования действий, обратной связи и пересмотра цели и сравнением конкурирующих моделей процесса.
    question_kind: causal
    status: open
    display_prominence: peripheral
    about_ids: [pmm:mechanism:goal-discrepancy-feedback-control, pmm:construct:represented-goal-standard, pmm:behavior:goal-progress-monitoring, pmm:behavior:self-regulatory-action, pmm:outcome:goal-attainment]
    source_ids: [pmm:source:carver-2019-control-theory, pmm:source:harkin-2016-monitoring, pmm:source:kluger-denisi-1996-feedback]
    provenance: *provenance
