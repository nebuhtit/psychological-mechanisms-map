metadata:
  title: Primary evidence pack for cognitive reappraisal
  description: >-
    Human experiments separating reappraisal instructions, reinterpretation as
    a proposed process, subjective emotional experience, expressive behavior,
    autonomic physiology, neural measurements, and statistical mediation.
  status: pilot
  language: en
  license: CC-BY-4.0
  schema_path: schema/pmm-v0.3.schema.yaml
  provenance: &provenance
    record_version: 0.3.1
    created_at: '2026-08-26T00:00:00+03:00'
    modified_at: '2026-08-26T00:00:00+03:00'
    created_by: [OpenAI Codex]
    review_status: machine_validated
    source_snapshot_date: '2026-08-26'
