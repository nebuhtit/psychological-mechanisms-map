  pmm: https://pmm.local/id/
  doi: https://doi.org/
  pmc: https://pmc.ncbi.nlm.nih.gov/articles/

objects:
  - id: pmm:context:aversive-stimulus-reappraisal-task
    type: Context
    label: Aversive-stimulus reappraisal task
    definition: Laboratory context in which participants view aversive films or images under assigned emotion-regulation instructions.
    ontological_level: type
    curation_status: accepted
    context_kind: experimental
    dimensions:
      elicitor: aversive film or image
      comparison: watch, acceptance, or suppression instruction
      response_channels: self-report, expression, physiology, or fMRI
    scope: Brief instructed regulation in human laboratory studies; not habitual real-world strategy use.
    provenance: *provenance

  - id: pmm:context:negative-emotion-episode
    type: Context
    label: Negative-emotion episode context
    definition: Time-bounded situation in which an eliciting stimulus is appraised as emotionally negative.
    ontological_level: type
    curation_status: provisional
    context_kind: composite
    dimensions:
      elicitor: present
      appraisal: negative
      duration: seconds to minutes
    scope: Experimental episodes represented in this pilot.
    provenance: *provenance

  - id: pmm:state:negative-emotional-experience
    type: State
    label: Negative emotional experience
    definition: Time-indexed subjective experience of negative affect during or after an eliciting event.
    ontological_level: type
    curation_status: accepted
    state_kind: affective
    bearer_scope: person
    temporal_scale: episode
    boundary_notes:
      - Subjective experience is not interchangeable with autonomic activity or facial expression.
    provenance: *provenance

  - id: pmm:state:autonomic-emotional-reactivity
    type: State
    label: Autonomic emotional reactivity
    definition: Time-indexed cardiovascular, electrodermal, respiratory, or pupillary response during an emotional episode.
    ontological_level: type
    curation_status: accepted
    state_kind: physiological
    bearer_scope: person
    temporal_scale: episode
    boundary_notes:
      - Different autonomic channels need not change in the same direction.
    provenance: *provenance

  - id: pmm:behavior:emotion-expressive-behavior
    type: Behavior
    label: Emotion-expressive behavior
    definition: Observable facial or bodily behavior coded as expression of emotion during an eliciting event.
    ontological_level: type
    curation_status: accepted
    behavior_kind: response_pattern
    observability: direct
    actor_scope: person
    response_topography: Facial and bodily expressions coded from recorded behavior.
    function_note: Reduced expression does not by itself imply reduced subjective emotion.
    provenance: *provenance

  - id: pmm:construct:situational-meaning-appraisal
    type: Construct
    label: Situational meaning appraisal
    definition: The interpreted meaning and significance assigned to an emotion-eliciting situation.
    ontological_level: type
    curation_status: provisional
    construct_kind: psychological
    boundary_notes:
      - Appraisal content must be operationalized rather than inferred solely from lower emotion ratings.
    provenance: *provenance

  - id: pmm:intervention:reappraisal-instruction
    type: Intervention
    label: Cognitive reappraisal instruction
    definition: Experimental instruction to reinterpret or psychologically distance from an eliciting situation so as to alter its emotional impact.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids:
      - pmm:construct:situational-meaning-appraisal
      - pmm:state:negative-emotional-experience
    delivery: Verbal or written instruction before or during aversive stimulus presentation.
    intended_direction: decrease
    provenance: *provenance

  - id: pmm:intervention:watch-instruction
    type: Intervention
    label: Watch instruction
    definition: Experimental comparison instruction to attend naturally to the emotional stimulus without assigned regulation.
    ontological_level: type
    curation_status: accepted
    intervention_kind: experimental_manipulation
    target_ids: [pmm:state:negative-emotional-experience]
    delivery: Natural viewing instruction during the same class of stimuli.
    intended_direction: test
    provenance: *provenance

  - id: pmm:mechanism:meaning-reinterpretation
    type: Mechanism
    label: Meaning reinterpretation
    definition: Proposed cognitive process that changes the construed meaning of an eliciting situation and thereby changes later emotional responding.
    ontological_level: type
    curation_status: provisional
    mechanism_kind: cognitive
    role_bindings:
      - role: interpreted meaning
        object_id: pmm:construct:situational-meaning-appraisal
      - role: emotional consequence
        object_id: pmm:state:negative-emotional-experience
      - role: eliciting context
        object_id: pmm:context:negative-emotion-episode
    realization_conditions:
      - The participant generates or adopts an alternative interpretation of the eliciting situation.
      - The reinterpretation occurs early enough to influence the measured emotional response.
    boundary_notes:
      - Successful instruction assignment does not verify that reinterpretation occurred.
      - Distancing, reinterpretation, distraction, acceptance, and suppression should remain distinguishable strategies.
    provenance: *provenance

  - id: pmm:measurement:negative-emotion-rating
    type: Measurement
    label: Trial-level negative-emotion rating
    definition: Self-reported intensity of negative emotional experience after an eliciting stimulus.
    ontological_level: type
    curation_status: accepted
    measurement_kind: self_report
    target_ids: [pmm:state:negative-emotional-experience]
    method: Visual analog, Likert, or comparable rating after watch or regulation trials.
    unit_of_analysis: self_report
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:autonomic-response-recording
    type: Measurement
    label: Autonomic response recording
    definition: Recording of heart rate, skin conductance, respiration, or pupil response during emotion regulation.
    ontological_level: type
    curation_status: accepted
    measurement_kind: physiology
    target_ids: [pmm:state:autonomic-emotional-reactivity]
    method: Channel-specific psychophysiological recording time-locked to emotional stimuli.
    unit_of_analysis: physiology
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:expressive-behavior-coding
    type: Measurement
    label: Emotion-expression coding
    definition: Observer coding of facial and bodily expressive behavior during emotional stimulation.
    ontological_level: type
    curation_status: accepted
    measurement_kind: observation
    target_ids: [pmm:behavior:emotion-expressive-behavior]
    method: Blind or standardized coding of recorded behavior.
    unit_of_analysis: behavior
    result_type: continuous
    provenance: *provenance

  - id: pmm:measurement:reappraisal-bold-response
    type: Measurement
    label: Reappraisal-related BOLD response
    definition: Task-related blood-oxygen-level-dependent signal contrast during reappraisal relative to a comparison instruction.
    ontological_level: type
    curation_status: provisional
    measurement_kind: circuit
    target_ids:
      - pmm:construct:situational-meaning-appraisal
      - pmm:state:negative-emotional-experience
    method: fMRI contrast and multilevel mediation analysis across trials and participants.
    unit_of_analysis: circuits
    result_type: continuous
    boundary_notes:
      - BOLD association or mediation is not equivalent to a causal neural mechanism.
    provenance: *provenance

