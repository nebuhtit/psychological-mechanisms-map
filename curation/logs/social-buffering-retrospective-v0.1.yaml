status: pilot
review_question:
  population: Human children or adolescents exposed to an acute laboratory stressor.
  exposure: Experimentally assigned interpersonal support, presence, or preparation condition around the stressor.
  comparator: Another support figure, stranger, alone condition, or another experimentally assigned social condition.
  outcome: Repeated cortisol response or recovery after the acute stressor.
  eligible_designs: [randomized experiment, controlled experimental study]
eligibility:
  include:
    - Participants are children or adolescents and human data are reported separately.
    - A social condition is experimentally assigned before or during an acute stressor.
    - Cortisol reactivity, trajectory, or recovery is measured after assignment.
    - The report permits extraction of the social-condition contrast or an interaction involving that contrast.
  exclude:
    - Parenting programs without an acute experimentally assigned support condition.
    - Observational association only, with no assigned social condition.
    - Chronic or hair cortisol without an acute stress-response outcome.
    - Review, commentary, animal study, protocol, or duplicate report without unique eligible results.
