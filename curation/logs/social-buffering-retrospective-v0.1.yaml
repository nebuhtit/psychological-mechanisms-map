known_gaps:
  - PubMed was not searched directly; run and export a prospective PubMed strategy with an exact hit count before calling coverage reproducible.
  - PsycInfo and at least one multidisciplinary citation database remain unsearched.
  - Backward and forward citation chasing, trial registries, preprints, and grey literature remain unsearched.
  - No information specialist has peer-reviewed the search strategy.
  - No record has two independent full-text decisions or two-person extraction verification.
  - Newly discovered eligible-looking records have not yet been added to PMM Claims or Evidence.
  - This pilot must not be described as a systematic review or complete evidence synthesis.
