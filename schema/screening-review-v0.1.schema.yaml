$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pmm.local/schema/screening-review-v0.1.0.schema.json
title: PMM Independent Screening Review v0.1.0
type: object
additionalProperties: false
required: [review_version, document_type, review_id, packet_id, reviewer_id, stage, status, blinded_to_other_decisions, decisions, provenance]
properties:
  review_version: {const: 0.1.0}
  document_type: {const: screening_review}
  review_id: {type: string, pattern: '^pmm:screening-review:[a-z0-9]+(?:-[a-z0-9]+)*$'}
  packet_id: {type: string, pattern: '^pmm:screening-packet:[a-z0-9]+(?:-[a-z0-9]+)*$'}
  reviewer_id: {type: string, minLength: 1}
  stage: {const: title_abstract}
  status: {enum: [in_progress, complete]}
  blinded_to_other_decisions: {const: true}
  decisions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [record_id, decision, reason_code, rationale, reviewed_at]
      properties:
        record_id: {type: string, pattern: '^record:pubmed-[0-9]+$'}
        decision: {enum: [pending, include, exclude, uncertain]}
        reason_code: {enum: [pending, potentially_eligible, wrong_population, wrong_exposure, wrong_outcome, wrong_design, wrong_publication_type, duplicate_or_no_unique_results, insufficient_abstract_information]}
        rationale: {type: string}
        reviewed_at: {type: [string, 'null'], format: date-time}
  provenance:
    type: object
    additionalProperties: false
    required: [created_at, modified_at, created_by]
    properties:
      created_at: {type: string, format: date-time}
      modified_at: {type: string, format: date-time}
      created_by: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
      note: {type: string}
