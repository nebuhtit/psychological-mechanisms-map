$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pmm.local/schema/practical-implications-v0.1.schema.json
title: PMM Practical Implications v0.1
description: Curated, bounded translations from PMM claims to possible use; not new scientific Claims or treatment advice.
type: object
additionalProperties: false
required: [applications_version, status, canonical_language, provenance, applications]
properties:
  applications_version: {const: 0.1.0}
  status: {enum: [pilot, reviewed, deprecated]}
  canonical_language: {const: en}
  provenance: {$ref: '#/$defs/provenance'}
  applications:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/application'}
$defs:
  localizedText:
    type: object
    additionalProperties: false
    required: [en, ru]
    properties:
      en: {type: string, minLength: 1}
      ru: {type: string, minLength: 1}
  provenance:
    type: object
    additionalProperties: false
    required: [record_version, created_at, modified_at, created_by, review_status]
    properties:
      record_version: {type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'}
      created_at: {type: string, format: date-time}
      modified_at: {type: string, format: date-time}
      created_by:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      review_status: {enum: [unreviewed, machine_validated, expert_reviewed, deprecated]}
      source_snapshot_date: {type: string, format: date}
  application:
    type: object
    additionalProperties: false
    required: [id, family_id, title, practical_question, action, expected_change, evidence_basis, applicability, not_established, actionability, confidence, audience, claim_ids, source_ids, provenance]
    properties:
      id: {type: string, pattern: '^pmm:application:[a-z0-9]+(?:-[a-z0-9]+)*$'}
      family_id: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
      title: {$ref: '#/$defs/localizedText'}
      practical_question: {$ref: '#/$defs/localizedText'}
      action: {$ref: '#/$defs/localizedText'}
      expected_change: {$ref: '#/$defs/localizedText'}
      evidence_basis: {$ref: '#/$defs/localizedText'}
      applicability: {$ref: '#/$defs/localizedText'}
      not_established: {$ref: '#/$defs/localizedText'}
      safety_note: {$ref: '#/$defs/localizedText'}
      actionability: {enum: [direct_within_tested_scope, transfer_uncertain, interpretation_only]}
      confidence: {enum: [moderate, low, very_low]}
      audience:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [individual, educator, clinician, researcher, designer]}
      claim_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^pmm:claim:[a-z0-9]+(?:-[a-z0-9]+)*$'}
      source_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^pmm:source:[a-z0-9]+(?:-[a-z0-9]+)*$'}
      provenance: {$ref: '#/$defs/provenance'}
